  function talkTo(id) {
    var d = def(id), n = nstate(id);
    if (!d || !n) { console.warn('[npcs] 未知 NPC:', id); return null; }
    if (!n.alive) { toast(d.name + '已经不在了。'); return null; }
    n.met = true;                                   // 搭话即认识
    var ev = findTalkStory(id);
    if (ev) return fireTalkStory(ev);
    return dailyChat(id);
  }
  G.engine.talkTo = talkTo;

    var d = def(id) || {};

  }
  G.engine.npcGiftLikes = npcGiftLikes;

  function giftItem(id, itemId) {
    var d = def(id), n = nstate(id), p = S().player;
    if (!d || !n) return { ok: false, msg: '找不到这个人。' };
    if (!n.alive) return { ok: false, msg: d.name + '已经不在了。' };
    if (n.vars.lastGiftDay === p.day) return { ok: false, msg: '今天已经送过一次了。' };
    if (!G.engine.hasItem(itemId)) return { ok: false, msg: '你没有这件东西。' };

    var idef = G.engine.itemDef(itemId) || {};
    var iname = idef.name || itemId, delta, reaction;
    if (d.likes.indexOf(itemId) >= 0) { delta = 5; reaction = 'like'; }
    else if (d.dislikes.indexOf(itemId) >= 0) { delta = -5; reaction = 'dislike'; }
    else { delta = 1; reaction = 'plain'; }

    G.engine.removeItem(itemId, 1);
    G.engine.affAdd(id, delta);
    n.vars.lastGiftDay = p.day;
    n.met = true;

    var tag = '[npc:' + id + ']' + d.name + '[/npc]';
    var itag = '[item]' + iname + '[/item]';
    var sign = (delta > 0 ? '+' : '') + delta;
    var msg;
    if (reaction === 'like') msg = tag + '接过' + itag + '，眼神软了一瞬：“……有心了。”（好感 ' + sign + '）';
    else if (reaction === 'dislike') msg = '你递上' + itag + '，' + tag + '皱眉推开：“这东西我用不上。”（好感 ' + sign + '）';
    else msg = tag + '接过' + itag + '，点了点头：“谢了。”（好感 ' + sign + '）';

    return { ok: true, delta: delta, reaction: reaction, msg: msg };
  }

    var pct = G.engine.clamp(aff, 0, 100);          // 负好感显示为空条
    var wrap = G.ui._h('div', { style: { height: '6px', background: 'rgba(255,255,255,.08)', borderRadius: '3px', overflow: 'hidden', margin: '4px 0' } });
    wrap.appendChild(G.ui._h('div', { style: { height: '100%', width: pct + '%', background: aff < 0 ? '#8e2f22' : '#c4a24a' } }));
    return wrap;
  }

  function chooseGift(id, onDone) {
    var h = G.ui._h;
    var inv = S().player.inventory.filter(function (e) {
      var idef = G.engine.itemDef(e.id);
      return idef && idef.type !== 'weapon' && idef.type !== 'key';
    });
    var ov = G.ui.openOverlay({
      title: '送给' + def(id).name,
      build: function (body) {
        if (!inv.length) { body.appendChild(h('div', { class: 'inv-empty', text: '没有可以送的东西。' })); return; }
        var likes = def(id).likes || [], dislikes = def(id).dislikes || [];
        inv.forEach(function (e) {
          var idef = G.engine.itemDef(e.id) || {};
          var row = h('div', { class: 'shop-item' });
          var hint = likes.indexOf(e.id) >= 0 ? ' ♥' : (dislikes.indexOf(e.id) >= 0 ? ' ✗' : '');
          row.appendChild(h('span', { text: (idef.name || e.id) + '×' + e.count + hint }));
          row.appendChild(h('button', {
            class: 'btn', text: '送出', onclick: function () {
              var res = giftItem(id, e.id);
              toast(res.msg ? G.ui.tags.strip(res.msg) : (res.ok ? '已送出' : '送礼失败'));
              ov.close();
              if (onDone) onDone();
            }
          }));
          body.appendChild(row);
        });
      }
    });
  }

  function openNpcPanel() {
    var h = G.ui._h;
    // 关掉可能已开的其它浮层，避免堆叠（本面板走 openOverlay，不经 panels.js 的 activeOverlay）
    var ex = (typeof document !== 'undefined') ? document.querySelectorAll('.overlay') : [];
    for (var i = 0; i < ex.length; i++) if (ex[i].parentNode) ex[i].parentNode.removeChild(ex[i]);

    G.ui.openOverlay({
      title: '关系',
      build: function (body) {
        var here = S().player.location;
        var met = (G.NPC_IDS || Object.keys(NPC)).filter(function (id) {
          var n = nstate(id); return NPC[id] && n && n.met;
        });
        if (!met.length) {
          body.appendChild(h('div', { class: 'inv-empty', text: '你还没有认识任何人。' }));
          return;
        }
        met.forEach(function (id) {
          var d = def(id), n = nstate(id);
          var card = h('div', { class: 'slot-card' });
          var head = h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } });
          var nameEl = h('span', { text: d.name, style: { color: G.ui.tags.npcColor(id), fontWeight: '600' } });
          var stageEl = h('span', { text: (n.alive ? G.engine.stageName(id) : '已离场') + (n.alive && G.engine.affinityReadyToAdvance(id) ? ' ▲' : ''), style: { fontSize: '12px', color: 'var(--fg-dim)' } });
          head.appendChild(nameEl); head.appendChild(stageEl);
          card.appendChild(head);
          card.appendChild(h('div', { class: 'slot-summary', text: '好感 ' + G.engine.affGet(id) + '　' + G.engine.stageName(id), style: { marginTop: '2px' } }));
          card.appendChild(affBar(G.engine.affGet(id)));
          // 分层简介
          var brief = d.briefs[Math.min(n.stage, d.briefs.length - 1)];
          card.appendChild(h('div', { class: 'slot-summary', text: brief, style: { opacity: '.85' } }));
          // 提示态
          if (n.alive) card.appendChild(h('div', { class: 'slot-summary', text: G.engine.talkHint(id), style: { color: G.engine.affinityReadyToAdvance(id) ? 'var(--accent)' : 'var(--fg-dim)' } }));
          // 送礼喜好（熟识起揭示）
          if (n.stage >= 1) {
            var likeNames = (d.likes || []).map(function (iid) { var x = G.engine.itemDef(iid); return x ? x.name : iid; }).join('、');
            card.appendChild(h('div', { class: 'slot-summary', text: '似乎喜欢：' + likeNames, style: { fontSize: '12px', opacity: '.7' } }));
          }
          // 行动：仅当 NPC 当前在场时可搭话/送礼
          if (n.alive && G.engine.npcPresent(id, here)) {
            var acts = h('div', { class: 'slot-actions' });
            acts.appendChild(h('button', {
              class: 'btn primary', text: '搭话', onclick: function () {
                var ex2 = document.querySelectorAll('.overlay');
                for (var k = 0; k < ex2.length; k++) if (ex2[k].parentNode) ex2[k].parentNode.removeChild(ex2[k]);
                G.engine.talkTo(id);
              }
            }));
            var gifted = n.vars.lastGiftDay === S().player.day;
            acts.appendChild(h('button', {
              class: 'btn', text: gifted ? '今日已送礼' : '送礼',
              onclick: gifted ? null : function () { chooseGift(id, openNpcPanel); }
            }));
            card.appendChild(acts);
          }
          body.appendChild(card);
        });
      }
    });
  }
  G.ui = G.ui || {};
  G.ui.showRelations = openNpcPanel;
  // 挂到 panels 命名空间，让 render.js 的底部导航 open('npc') 能路由到本面板
  if (G.ui.panels && G.ui.panels.open) {
    var _origOpen = G.ui.panels.open;
    G.ui.panels.open = function (name) {
      if (name === 'npc') return openNpcPanel();
      return _origOpen(name);
    };
    G.ui.panels.openNpc = openNpcPanel;
  }

})();

</script>

<script>
/* =============================================================================
 * intro.js — 开场剧情（M5）
 * -----------------------------------------------------------------------------
 * 安全屋醒来的开场 passage 组：交代背景（第 90 天、头伤、失忆）、发放开局
 * 物资（铁管/罐头/瓶装水/绷带 + 前情伏笔道具 worn_idcard）、引导去酒吧
 * （自然引出老秦初遇，见 qin.js 的 qin_s0_1）。
 *
 * 触发：type:'story' + when:['enter']，首次进入 home 时由 goLocation 的
 * enter 检查触发（newGameStart 开局即进 home）。once 防重复，结尾写
 * flag intro.done —— 三条 NPC 线的初遇事件都以此为前置。
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  var story = G.data.story, events = G.data.events;

  function P(id, text, choices) { story.register({ id: id, text: text, choices: choices }); }

  events.register({
    id: 'intro_wake', type: 'story', when: ['enter'], once: true, priority: 20,
    cond: { loc: 'home', flag: { 'intro.done': false } },
    passage: 'intro_p1'
  });

  P('intro_p1',
    '后脑的钝痛把你从黑暗里拽醒。天花板上的水渍你不认得，窗帘缝里漏进一线灰白的晨光，落在积灰的地板上。你躺在一张不属于你的床上，屋里很静，静得能听见自己的心跳。',
    [{ label: '撑起身，检查自己', fx: { goto: 'intro_p2' } }]);

  P('intro_p2',
    '你的头上缠着绷带，结打得歪歪扭扭，指尖一碰伤口就钻心地疼。你翻遍全身的口袋，只摸出一张塑封发黄的[item]旧身份证[/item]，照片和名字都被水渍洇开，你辨不出那是不是自己。你努力去想自己怎么到的这里，能想起的东西碎得拼不起来。',
    [{ label: '收起证件，搜一遍这间屋子', fx: { item: { worn_idcard: 1 }, goto: 'intro_p3' } }]);

  P('intro_p3',
    '屋子的主人走得匆忙，或者早就没能回来。你在床底摸出一截[item]铁管[/item]，橱柜里剩着一只罐头、一瓶水和半卷绷带，桌上的台历停在七月，有人用红笔把 7 月 14 日圈了一遍又一遍，圈到纸面起了毛。',
    [{ label: '收下这些东西，走到窗边', fx: { item: { rustpipe: 1, cannedfood: 1, bottledwater: 1, bandage: 1 }, goto: 'intro_p4' } }]);

  P('intro_p4',
    '窗外的临港市泡在晨雾里。街上翻倒的汽车锈成红褐色，一具[zed]尸体[/zed]在路口慢慢地挪，走三步，停一步，像在演一出没有观众的哑剧。窗边的墙上钉着一张手绘街区图，超市、居民区的位置都画了叉，只有一处被炭笔描粗——「[place]避风港[/place]」，旁边一行小字：活人聚的地方，酒吧，别带枪进门。',
    [{ label: '记下「避风港」的位置', fx: { flag: { 'intro.done': true }, milestone: '在陌生的安全屋醒来', goto: 'intro_p5' } }]);

  P('intro_p5',
    function (s) {
      var name = (s && s.player && s.player.name) || '无名氏';
      return '记忆像退潮后的滩涂，你捡得回来的只有自己的名字——' + name +
        '。灾变到今天是第九十天，你不知道这九十天自己是怎么过来的，但接下来怎么活，得由你自己决定：找吃的，找水，找能说话的活人。那间叫[place]避风港[/place]的酒吧不远，天黑以后最热闹。';
    },
    [{ label: '出发', fx: {} }]);

})();

</script>

<script>
/* =============================================================================
 * qin.js — 老秦（秦烈）剧情·前半（M5：警惕→熟识→信任）
 * -----------------------------------------------------------------------------
 * 节拍一览（flag 均存 npc.qin.*，锁序规则：cond 锁上一段 flag，结尾写本段 flag）：
 *   警惕（stage 0）
 *     qin_s0_1  酒吧初遇，被当成屠夫帮探子（enter/talk，夜间酒吧）
 *     qin_s0_2  委托：取回警局旧案卷宗（talk；拒绝可改日再谈，接受写 fetch）
 *     qin_s0_3  警局档案室取卷宗（enter/action @police，发 qin_dossier）
 *     qin_s0_4  交还卷宗，改观（talk，需持有 qin_dossier）
 *     qin_s0_5  升阶→熟识：正式认识（talk，需好感≥20，fx.stage）
 *   熟识（stage 1）
 *     qin_s1_1  教近战技巧（talk @police 白天，发 skill:melee）
 *     qin_s1_2  搭档之死（talk @bar 夜间）
 *     qin_s1_3  并肩清剿居民区尸群 + 升阶→信任（talk，需好感≥40，fx.stage）
 *   信任（stage 2）
 *     qin_s2_1  委托：侦查商场外围（talk，接受写 scout）
 *     qin_s2_2  商场外围侦查（enter/action @mall，完成写 scoutDone）
 *     qin_s2_3  回报情报（talk @bar 夜间，报酬 15 子弹）
 *     qin_s2_4  酒后自白：封城开枪打过平民（talk @bar 深夜；亲密铺垫，M6 接 stage 3）
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  var story = G.data.story, events = G.data.events;

  function P(id, text, choices) { story.register({ id: id, text: text, choices: choices }); }
  var NIGHT_BAR = [1140, 120];   // 老秦在酒吧的时段 19:00–02:00

  // ==========================================================================
  // 警惕（stage 0）
  // ==========================================================================

  // ---- qin_s0_1 酒吧初遇 ----------------------------------------------------
  events.register({
    id: 'qin_s0_1', type: 'story', npc: 'qin', when: ['enter', 'talk'], once: true, priority: 8,
    cond: { loc: 'bar', timeRange: NIGHT_BAR, stage: { qin: 0 }, flag: { 'intro.done': true, 'npc.qin.s0_1': false } },
    passage: 'qin_s0_1_p1'
  });

  P('qin_s0_1_p1',
    function (s) {
      s.npcs.qin.met = true;
      return '酒吧的门帘一掀，烟味和酒气糊了你一脸，油灯把十几条人影钉在墙上。你刚迈进两步，一只手按住你的肩，力道大得像钳子——[npc:qin]老秦[/npc]把你转过来，目光从你的脸一路刮到你的鞋，“生面孔。谁让你来的？”';
    },
    [
      { label: '报上名字，说自己是来找活路的', fx: { aff: { qin: 2 }, goto: 'qin_s0_1_p2' } },
      { label: '摊开双手，示意自己没带武器', fx: { aff: { qin: 2 }, goto: 'qin_s0_1_p2' } },
      { label: '“放开手，我自己会走。”', fx: { aff: { qin: -2 }, goto: 'qin_s0_1_p2b' } }
    ]);

  P('qin_s0_1_p2',
    '“商场那帮吃人饭的，最近往各处塞探子。”[npc:qin]老秦[/npc]松开手，人却仍挡在你和吧台之间，“进来可以，规矩三条：不带枪，不闹事，不打听别人的底。”吧台后的[npc:su]苏曼[/npc]笑着插话：“老秦，别把客人吓跑了。”他哼了一声，退回门边的高脚凳上，眼睛还钉在你身上。',
    [
      { label: '找个角落坐下', fx: { goto: 'qin_s0_1_p3' } },
      { label: '问他“商场那帮人”是什么来头', fx: { goto: 'qin_s0_1_p2q' } }
    ]);

  P('qin_s0_1_p2b',
    '[npc:qin]老秦[/npc]盯了你两秒，手指一根根松开。“行，嘴硬的探子我也见过。”他抱着胳膊靠回门框，“今晚我就守在这儿，你最好只喝酒。”吧台后的[npc:su]苏曼[/npc]朝你耸耸肩，示意你别往心里去。',
    [{ label: '找个位子坐下', fx: { goto: 'qin_s0_1_p3' } }]);

  P('qin_s0_1_p2q',
    '“屠夫帮。”[npc:qin]老秦[/npc]吐出三个字，像吐一口痰，“占了中环商场，抢货，抓人，也吃人。离他们远点——要是你真跟他们没关系的话。”他说完便不再看你，你在他那句话的后半截里听出了没散干净的怀疑。',
    [{ label: '记住这个名字', fx: { aff: { qin: 1 }, flag: { 'npc.qin.s0_1': true }, milestone: '初遇老秦' } }]);

  P('qin_s0_1_p3',
    '你挑了张离门最远的桌子，背靠着墙坐下。酒吧不大，十来个幸存者各占一角，压着嗓子交换消息，没人多看你一眼。这里的安静让你绷了一路的后背松了半寸——除了门口那道始终没挪开的视线。',
    [{ label: '（今晚先到这里）', fx: { flag: { 'npc.qin.s0_1': true }, milestone: '初遇老秦' } }]);

  // ---- qin_s0_2 委托：旧案卷宗 ----------------------------------------------
  // 拒绝不落死局：不 once，冷却一天后可再谈；接受才写 s0_2+fetch。
  events.register({
    id: 'qin_s0_2', type: 'story', npc: 'qin', when: ['talk'], once: false, cooldown: 1440, priority: 5,
    cond: { stage: { qin: 0 }, flag: { 'npc.qin.s0_1': true, 'npc.qin.s0_2': false } },
    passage: 'qin_s0_2_p1'
  });

  P('qin_s0_2_p1',
    '[npc:qin]老秦[/npc]难得先开口。他把烟头在鞋底摁灭，从怀里摸出半张手绘的楼层图：“看你进出的做派，手脚还算干净。警局二楼档案室塌了半边，里头压着一份[item]旧案卷宗[/item]，九十七号柜。我这身板钻不进缺口。”他的指节在图上敲了敲，“你去，报酬十发子弹。”',
    [
      { label: '应下这单活', fx: { flag: { 'npc.qin.s0_2': true, 'npc.qin.fetch': true }, aff: { qin: 2 }, appointment: { inDays: 2, minute: 1020, label: '帮老秦取回旧案卷宗' }, goto: 'qin_s0_2_p2' } },
      { label: '问他为什么信得过你', fx: { goto: 'qin_s0_2_p1q' } },
      { label: '“这活我不接。”', fx: { aff: { qin: -1 }, goto: 'qin_s0_2_pno' } }
    ]);

  P('qin_s0_2_p1q',
    '“信不过。”[npc:qin]老秦[/npc]回答得很快，“所以才让你去。那卷宗对外人是废纸，对我有用——你拿了它，卖不掉，也跑不掉。”他把楼层图往你这边推了半寸，“这叫试探，听明白就好。”',
    [
      { label: '应下这单活', fx: { flag: { 'npc.qin.s0_2': true, 'npc.qin.fetch': true }, aff: { qin: 2 }, appointment: { inDays: 2, minute: 1020, label: '帮老秦取回旧案卷宗' }, goto: 'qin_s0_2_p2' } },
      { label: '还是算了', fx: { aff: { qin: -1 }, goto: 'qin_s0_2_pno' } }
    ]);

  P('qin_s0_2_p2',
    '“档案室在二楼东侧，正门堵死了，走外墙的消防梯。”[npc:qin]老秦[/npc]把楼层图塞进你手里，“里面黑，也不干净，能不动手就别动手。东西到手，晚上来酒吧找我。”',
    [{ label: '收好楼层图', fx: {} }]);

  P('qin_s0_2_pno',
    '[npc:qin]老秦[/npc]收回楼层图，脸上没什么表情：“随你。”他转回门口的位置，这一晚没再看你一眼。',
    [{ label: '（离开）', fx: {} }]);

  // ---- qin_s0_3 警局档案室取卷宗 --------------------------------------------
  events.register({
    id: 'qin_s0_3', type: 'story', npc: 'qin', when: ['enter', 'action'], once: true, priority: 7,
    cond: { loc: 'police', flag: { 'npc.qin.fetch': true, 'npc.qin.s0_3': false } },
    passage: 'qin_s0_3_p1'
  });

  P('qin_s0_3_p1',
    '你顺着消防梯爬上警局二楼。走廊里积着厚灰，鞋印只有你自己的，档案室的门框歪塌下来，留出半人高的缺口，里面黑得像一口井。你屏住呼吸，听见纸页被什么东西缓慢碾过的声响。',
    [
      { label: '侧身钻进缺口，摸黑往里挪', fx: { stat: { energy: -8, sanity: -3 }, time: 20, goto: 'qin_s0_3_p2a' } },
      { label: '敲响门框，把里面的东西引出来打', fx: { combat: 'zombie_pair', goto: 'qin_s0_3_p2b' } }
    ]);

  P('qin_s0_3_p2a',
    '你贴着档案柜一格一格往里数，灰呛得喉咙发痒也不敢咳。黑暗里那阵碾纸声停了一停，又继续。九十七号柜半埋在塌梁底下，柜门变形卡死，你抵住柜身慢慢发力，铰链呻吟着让了步。',
    [{ label: '抽出卷宗，原路退出去', fx: { item: { qin_dossier: 1 }, flag: { 'npc.qin.s0_3': true }, time: 20, goto: 'qin_s0_3_p3' } }]);

  P('qin_s0_3_p2b',
    '走廊重新静下来，你侧身钻进缺口。手电够不着的角落里横着翻倒的柜子，九十七号柜半埋在塌梁底下，你把变形的柜门别开，里面的牛皮纸袋码得整整齐齐。',
    [{ label: '抽出卷宗就走', fx: { item: { qin_dossier: 1 }, flag: { 'npc.qin.s0_3': true }, time: 15, goto: 'qin_s0_3_p3' } }]);

  P('qin_s0_3_p3',
    '[item]旧案卷宗[/item]比想象中薄，牛皮纸封皮盖着警局的红章，边角被水泡过又干透，皱得像老人的手背。卷宗被麻绳捆了三道，你掂了掂，没有拆——这是老秦的东西，也是他给你出的题。',
    [{ label: '收进背包，去酒吧交差', fx: {} }]);

  // ---- qin_s0_4 交还卷宗 ----------------------------------------------------
  events.register({
    id: 'qin_s0_4', type: 'story', npc: 'qin', when: ['talk'], once: true, priority: 5,
    cond: { stage: { qin: 0 }, flag: { 'npc.qin.s0_3': true, 'npc.qin.s0_4': false }, has: { item: 'qin_dossier' } },
    passage: 'qin_s0_4_p1'

  // guardFlag 防止段落重复渲染时重复登记（text 函数副作用，M5 met 联动同法）。
  function bookWeekly(guardFlag, targetWd, minute, label) {
    if (G.engine.getFlag(guardFlag)) return;
    G.engine.setFlag(guardFlag, true);
    var p = G.state.player;
    var diff = (targetWd - (p.day % 7) + 7) % 7;
    if (!diff) diff = 7;
    G.state.calendar.appointments.push({ day: p.day + diff, minute: minute, label: label, eventId: null, done: false });
  }

      return '市二医院的走廊灯只亮着一半，消毒水味压不住底下的腐味。诊室里，[npc:lin]林晚[/npc]背对着你在洗手，白大褂外面套着毛衣，听见脚步声她头也不回：“外伤坐右边，急症直接说，付不起[item]子弹[/item]的现在就可以出去。”';

    '社区诊所的卷帘门锈死了大半，你从底下的缝里钻进去。候诊椅蒙着灰，输液架东倒西歪，通往地下室的楼梯口张着黑洞洞的嘴，一股潮湿的霉味从底下漫上来，里面掺着一点说不清的甜腥。',

  P('lin_s0_3_p2',
    '地下室比想象的大，两排药架翻倒在地，碎玻璃在微光里闪。最里侧的铁架后面传来指甲刮水泥的声音——有个东西被架子压住了半边身子，正朝你的方向扭。军绿色的[item]药品箱[/item]就在它够不到的墙角。',

    '石头滚下楼梯，声音在底下荡了几圈，黑暗里响起指甲刮水泥的动静，又慢慢停了。听动静只有一个，还被什么绊着。你捏紧武器下了楼梯，军绿色的[item]药品箱[/item]躺在墙角，封条完好。',

  P('lin_s0_4_p1',
    '[npc:lin]林晚[/npc]开锁的动作很轻，箱盖掀开的一瞬，她整个人静了半秒。安瓿、西林瓶、成排的[med]镇静剂[/med]码得整整齐齐，她伸手数了一遍，又数了第二遍，指尖在其中一格上停了停才收回来。“都在。”她说，嗓音比平时低，“辛苦你了。”',

  P('lin_s0_4_p2q',
    '“麻醉和镇静类，手术离不开的东西。”[npc:lin]林晚[/npc]把那一格单独取出来锁进诊台抽屉，钥匙贴身收好，动作快得不容追问。“[med]抗生素[/med]和绷带拿好，答应你的——往后小伤，不收你子弹。”',
    [{ label: '道谢', fx: { flag: { 'npc.lin.s0_4': true } } }]);

  P('lin_s0_4_p2',
    '[npc:lin]林晚[/npc]把[med]抗生素[/med]和绷带放进你手里，第一次正眼看你超过三秒。“会跑腿，不多嘴。”她像在下诊断，“这城里这样的人快绝种了。往后小伤来找我，不收你子弹。”',

    [
      { label: '留下', fx: { goto: 'lin_s3_4_p2' } },
      { label: '“今晚不行，明天来看你。”', fx: { goto: 'lin_s3_4_pout' } }

  P('lin_s3_4_pout',
    '她的手指立刻松开，收回口袋，语气如常：“嗯，路上小心。”只有转身时太快的那半步，泄露了一点别的。你走到走廊尽头回头看，值班室的灯还亮着，她的影子投在磨砂玻璃上，很久没有动。',
    [{ label: '（离开）', fx: {} }]);

  P('lin_s3_4_p2',
    function (s) {
      var head = '台灯拉到最低，值班室的行军床窄得只容两个人叠在一起。她吻你的方式带着一种孤注一掷的认真，手指埋进你的头发，扣着你的后脑不放，像怕你在一个吻的间隙里蒸发。';
      if (s.player.gender === 'f') {
        return head + '她的手顺着你的脊椎一节节按下去——是医生的手，准，稳，烫。可落到你身上时，那点专业的冷静烧得一干二净，她把脸埋在你颈窝，声音又低又哑：“说话，随便说什么，让我听见你。”她的指尖探进你身体的时候，你的喘息卡在喉咙里，她就吻你的喉咙，一遍一遍，把你拆开又拼拢，直到你在她掌心里发着抖到达。她抱着你不放，像抱一件失而复得的东西。';
      }
      return head + '她跨坐上来，台灯给她的轮廓描了一圈毛边。她握着你的手贴上她的心口——心跳快得吓人，和她脸上的镇静完全是两回事。她引着你进入她的时候，眉心蹙起又缓缓松开，俯身抵着你的额头，呼吸全乱了，还固执地睁着眼：“看着我。”她动得不快，却一下比一下沉，你扣住她的腰，她终于闭上眼，把一声破碎的喘息咬在你的肩膀上，身体一阵一阵地颤。';
    },
    [{ label: '搂紧她', fx: { goto: 'lin_s3_4_p3' } }]);

  P('lin_s3_4_p3',
    '事后她枕在你的心口，一根手指搭在你的颈动脉上——数你的脉搏，数着数着，呼吸终于匀了。后半夜你醒过一次，她在黑暗里睁着眼看你，被发现了也不躲：“继续睡。”她把毯子往你身上掖，“我就是确认一下，你在。”',
    [{ label: '（把她搂进怀里睡去）', fx: { stat: { energy: -18, sanity: 5 }, time: 360, aff: { lin: 8 }, flag: { 'npc.lin.s3_4': true }, milestone: '与林晚的一夜' } }]);

  // ==========================================================================
  // 羁绊（stage 4）
  // ==========================================================================

  // ---- lin_s4_1 升阶→羁绊：钥匙与义诊约定 -----------------------------------
  events.register({
    id: 'lin_s4_1', type: 'story', npc: 'lin', when: ['talk'], once: true, priority: 6,
    cond: { loc: 'hospital', stage: { lin: 3 }, flag: { 'npc.lin.s3_3': true, 'npc.lin.s4_1': false }, aff: { lin: { gte: 80 } } },
    passage: 'lin_s4_1_p1'
  });

  P('lin_s4_1_p1',
    '[npc:lin]林晚[/npc]把一小串钥匙放进你手心：诊室，后门，药房外间。“这栋楼的钥匙，一共只有两串。”另一串，她当着你的面从贴身口袋里取出来，和一枚男式的旧[item]戒指[/item]一起，放进抽屉最深处，落了锁。这一次，钥匙没有再拿出来。“人得往前活。”她说这话时看着你，不是看着抽屉。',
    [{ label: '收好钥匙', fx: { goto: 'lin_s4_1_p2' } }]);

  P('lin_s4_1_p2',
    function () {
      bookWeekly('npc.lin.clinicBooked', 6, 540, '医院义诊日');
      return '“还有件事。”她翻开排班表——那上面其实只有她一个人的名字，“每周日上午，我想开义诊，附近的幸存者都能来，不收子弹。这场面我一个人撑不住。”她把笔递给你，指了指自己名字旁边的空栏，“你在，我心里稳。”';
    },
    [{ label: '写下自己的名字', fx: { stage: { lin: 4 }, flag: { 'npc.lin.s4_1': true }, aff: { lin: 5 }, milestone: '林晚把医院的钥匙给了你' } }]);

  // ---- lin_clinic_1 周期事件：义诊日（每周日上午） ---------------------------
  events.register({
    id: 'lin_clinic_1', type: 'scheduled', npc: 'lin', priority: 4,
    cond: { loc: 'hospital', weekday: 6, timeRange: [540, 1020], stage: { lin: { gte: 4 } } },
    passage: 'lin_clinic_p1'
  });

  P('lin_clinic_p1',
    function () {
      var pool = [
        '天没大亮，医院门口已经排起了队：抱孩子的女人，咳嗽的老头，一个用门板抬来的伤号。[npc:lin]林晚[/npc]立在门口分诊，语速快得像点名；你负责维持队形、递器械、按住不肯配合的伤口。',
        '今天的义诊来了个熟面孔——上次那个腹部插钢筋的男人，拄着自制的拐，给[npc:lin]林晚[/npc]鞠了个躬，又给你鞠了一个。他身后跟着一家人，篮子里装着几个还热的红薯，说什么都要留下。',
        '队伍里起了争执，两个汉子为插队吵得要动手。你还没走过去，[npc:lin]林晚[/npc]头也不抬地开口：“打架的出去，伤好了再打。我这儿缝一针收一发子弹——今天免费，明天恢复原价。”队伍哄笑，架吵不起来了。'
      ];
      return pool[Math.floor(Math.random() * pool.length)];
    },
    [{ label: '一直帮到收摊', fx: { time: 240, stat: { energy: -15, sanity: 5 }, aff: { lin: 3 }, appointment: { inDays: 7, minute: 540, label: '医院义诊日' }, goto: 'lin_clinic_p2' } }]);

  P('lin_clinic_p2',
    '最后一个病人走的时候，日头已经偏西。[npc:lin]林晚[/npc]靠在挂号台上揉手腕，白大褂前襟蹭着血点和碘伏渍，人却比平时任何时候都亮。“下周日，”她偏头看你，“还来？”',
    [{ label: '“每周都来。”', fx: { aff: { lin: 1 } } }]);

  // ---- lin_cure_1 感染救治专属剧情（可重复） --------------------------------
  events.register({
    id: 'lin_cure_1', type: 'story', npc: 'lin', when: ['enter', 'action', 'talk'], once: false, cooldown: 1440, priority: 9,
    cond: { loc: 'hospital', stage: { lin: { gte: 4 } }, stat: { infection: { gte: 60 } } },
    passage: 'lin_cure_p1'
  });

  P('lin_cure_p1',
    '你人还没站稳，[npc:lin]林晚[/npc]的目光已经钉在你脖颈侧面——皮肤底下，暗色的纹路正顺着血管往上爬。她脸上的血色褪了个干净，下一秒，她已经拽着你往手术室走，力气大得不像她。“多久了？咬伤还是划伤？为什么现在才来！”三个问题，没有一个等你回答。',
    [{ label: '任她摆布', fx: { goto: 'lin_cure_p2' } }]);

  P('lin_cure_p2',
    '军用抗病毒剂，冰盐水，她自己配的、气味刺鼻的洗剂——整套流程她做得又快又狠。输液针扎进去，烧灼感顺着血管一路爬，疼得你指节发白。“忍着。剂量是我照实验楼那半本台账重配的，比军标的狠，也比它有用。”不知过了多久，那种从骨缝里往外渗的热，终于退了。',
    [
      { label: '缓过气来', cond: { flag: { 'npc.lin.curedOnce': false } }, fx: { stat: { infection: -50, hp: 5, energy: -10 }, time: 240, aff: { lin: 3 }, flag: { 'npc.lin.curedOnce': true }, milestone: '林晚把你从感染线上拉回来', goto: 'lin_cure_p3' } },
      { label: '缓过气来', cond: { flag: { 'npc.lin.curedOnce': true } }, fx: { stat: { infection: -50, hp: 5, energy: -10 }, time: 240, aff: { lin: 2 }, goto: 'lin_cure_p3' } }
    ]);

  P('lin_cure_p3',
    '她坐在床边，盯着你的瞳孔看了很久，确认里面没有那种浑浊，才允许自己靠进椅背，长长吐出一口气。“听着。”她的声音平得刻意，“我允许你受伤，允许你生病，允许你把我的绷带用成消耗品——”她俯下身，额头抵着你的，“唯独不允许你，变成我救不了的东西。”',
    [{ label: '“记住了。”', fx: {} }]);

  // ---- lin_s4_2 羁绊成人变体（可重复） --------------------------------------
  events.register({
    id: 'lin_s4_2', type: 'story', npc: 'lin', when: ['talk'], once: false, cooldown: 2880, priority: 2,
    cond: { loc: 'hospital', timeRange: LIN_NIGHT, stage: { lin: { gte: 4 } }, flag: { 'npc.lin.s3_4': true } },
    passage: 'lin_s4_2_p1'
  });

  P('lin_s4_2_p1',
    '值班室的台灯又亮到深夜。你进门时，[npc:lin]林晚[/npc]正对着排班表出神，听见动静回头看你，目光在你脸上停了几秒，然后起身，很自然地反锁了门。“今晚没有病人。”她摘下发绳走过来，“医嘱：你需要休息。我也是。”',
    [
      { label: '遵医嘱', fx: { goto: 'lin_s4_2_p2' } },
      { label: '“今晚真得回去。”', fx: { goto: 'lin_s4_2_pno' } }
    ]);

  P('lin_s4_2_pno',
    '“嗯。”她把你送到走廊口，替你理了理衣领，动作像检查绷带一样认真，“那就把觉补回来——这也是医嘱。”',
    [{ label: '（离开）', fx: {} }]);

  P('lin_s4_2_p2',
    function (s) {
      if (s.player.gender === 'f') {
        return '这一次她不再需要你的声音来确认什么。她把你按在行军床上，吻得慢条斯理，医生的手一寸寸把你拆开，准确，专注，带着一点报复般的耐心——上次你弄乱她呼吸的账，她今晚全数讨回去。你在她手里到达的时候，她撑在你上方看着你，眼睛亮得像换了一个人。“这个表情，”她低声说，“归我。”';
      }
      return '这一次她不再需要黑暗壮胆。她把你推倒在行军床上，跨坐上来，台灯也不关，解衬衫扣子的手指又稳又慢——存心的。她引着你进入，节奏由她定，你想快，她就俯身咬住你的下唇不许。到最后她伏在你胸口喘，心跳撞着心跳，好半天，哑着嗓子开口：“体检结论：心肺功能良好。”顿了顿，“下周复查。”';
    },
    [{ label: '（拥着她睡去）', fx: { stat: { energy: -18, sanity: 6 }, time: 120, aff: { lin: 4 } } }]);

})();

<script>
/* =============================================================================
 * mao.js — 灰猫剧情·前半（M5：警惕→熟识→信任）
 * -----------------------------------------------------------------------------
 * 灰猫在信任（stage 2）之前没有作息表（npcs.js 仅登记 stageMin:2 的下水道
 * 据点），所以警惕/熟识两阶段的节拍全部用 enter/action 随机遭遇承载
 * （anyOf: sewer/dock），信任起才有 talk 入口。
 *
 * 节拍一览（flag 均存 npc.mao.*）：
 *   警惕（stage 0）
 *     mao_s0_1  初遇：卖半真半假的商场情报（买下/识破/不理都推进）
 *     mao_s0_2  情报兑现：商场夹层有货也有埋伏（仅买家触发，吃亏路线）
 *     mao_s0_3  二遇：补一条白送的真情报（按初遇选择分支）
 *     mao_s0_4  升阶→熟识：谈成长期买卖（需好感≥20，解锁情报购买 intelShop）
 *   熟识（stage 1）
 *     mao_intel 情报购买玩法（可重复，冷却一天；5 子弹一条，掺闲聊选项）
 *     mao_s1_1  她被屠夫帮追杀，主角掩护（演戏或动手两路）
 *     mao_s1_2  江边喝酒，互探来历（她的话半真半假）
 *     mao_s1_3  升阶→信任：带你去她的下水道据点（需好感≥40，fx.stage）
 *   信任（stage 2，据点 talk 入口）
 *     mao_s2_1  教你走地下捷径 → setFlag world.sewerShortcut（M3 交接约定）
 *     mao_s2_2  透露她在替「某个买家」收病毒文件（不揭晓买家）
 *     mao_s2_3  越轨：不收子弹收「利息」（信任阶段成人事件，已在 NPC设定.md
 *               补登记；她主导并中止，全程自愿，正戏留给 M6）
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  var story = G.data.story, events = G.data.events;

  function P(id, text, choices) { story.register({ id: id, text: text, choices: choices }); }
  var MAO_TURF = [{ loc: 'sewer' }, { loc: 'dock' }];   // 她出没的两处

  // ==========================================================================
  // 警惕（stage 0）
  // ==========================================================================

  // ---- mao_s0_1 初遇 --------------------------------------------------------
  events.register({
    id: 'mao_s0_1', type: 'story', npc: 'mao', when: ['enter', 'action'], once: true, priority: 8,
    cond: { anyOf: MAO_TURF, stage: { mao: 0 }, flag: { 'intro.done': true, 'npc.mao.s0_1': false } },
    passage: 'mao_s0_1_p1'
  });

  P('mao_s0_1_p1',
    function (s) {
      s.npcs.mao.met = true;
      return '打火机咔的一声在阴影里亮起，你握武器的手抬到一半。那是个女人，蹲在你够不着的高处，帽檐压得很低，指间转着一枚弹壳。“放松，我不咬人。”她的笑声先落下来，“我做消息买卖，你可以叫我[npc:mao]灰猫[/npc]。见面礼：中环商场三楼有个没搬空的仓库——细节，五发子弹。”';
    },
    [
      { label: '付五发子弹，买下情报', cond: { has: { bullets: 5 } }, fx: { bullets: -5, flag: { 'npc.mao.bought': true }, aff: { mao: 2 }, goto: 'mao_s0_1_p2buy' } },
      { label: '“商场是屠夫帮的地盘，轮得到你卖？”', fx: { goto: 'mao_s0_1_p2call' } },
      { label: '不感兴趣，转身要走', fx: { goto: 'mao_s0_1_p2no' } }
    ]);

  P('mao_s0_1_p2buy',
    '“痛快。”她接过子弹，凑近了半分，声音压得只有你们俩听得见：“三楼东侧的旧货梯井，顺着检修爬梯下到夹层，货架上的东西没人动过。”她从高处跳下来，落地几乎没有声音，“丑话说在前头——我的消息，保真七成。”她冲你眨眨眼，退进黑暗里没了影。',
    [{ label: '记下情报', fx: { flag: { 'npc.mao.s0_1': true }, milestone: '初遇灰猫' } }]);

  P('mao_s0_1_p2call',
    '她转弹壳的手指停了。“哟。”她把帽檐往上推了半寸，露出一双发亮的眼睛，“这城里十个人有九个先摸子弹，你先动了脑子。”她利落地跳下来，“罚我请客：商场的货是真的，可楼里窝着的东西也是真的——这半条，免费。”',
    [
      { label: '“那另外半条呢？”', fx: { goto: 'mao_s0_1_p2call2' } },
      { label: '记下这份人情', fx: { flag: { 'npc.mao.s0_1': true, 'npc.mao.sawThrough': true }, aff: { mao: 4 }, milestone: '初遇灰猫' } }
    ]);

  P('mao_s0_1_p2call2',
    '“另外半条，要收钱啦。”[npc:mao]灰猫[/npc]笑得理直气壮，倒退着走进阴影，“记住这张脸——下水道和码头都能碰见我，带够子弹再来。”',
    [{ label: '（目送她消失）', fx: { flag: { 'npc.mao.s0_1': true, 'npc.mao.sawThrough': true }, aff: { mao: 4 }, milestone: '初遇灰猫' } }]);

  P('mao_s0_1_p2no',
    '“哎——机会只敲一次门。”她也不恼，把弹壳抛起来又接住，“不过没关系，你会回头的，这城里人人都缺消息。”你走出十几步回头再看，高处已经空了，像刚才只是一场幻觉。',
    [{ label: '（离开）', fx: { flag: { 'npc.mao.s0_1': true }, milestone: '初遇灰猫' } }]);

  // ---- mao_s0_2 情报兑现（仅买家） ------------------------------------------
  events.register({
    id: 'mao_s0_2', type: 'story', npc: 'mao', when: ['enter', 'action'], once: true, priority: 7,
    cond: { loc: 'mall', flag: { 'npc.mao.bought': true, 'npc.mao.s0_2': false } },
    passage: 'mao_s0_2_p1'
  });

  P('mao_s0_2_p1',
    '货梯井果然在三楼东侧，检修爬梯锈得厉害但还结实。你摸下夹层，借着通风口漏下的光看过去——货架上真码着成箱的东西，灰猫的消息是真的。可你脚边的地面上拖痕纵横，新鲜得发亮，这半条，她可没提。',
    [
      { label: '抄家伙，把窝在里面的东西清掉', fx: { combat: 'crawler_ambush', goto: 'mao_s0_2_p2' } },
      { label: '不冒这个险，退出去', fx: { flag: { 'npc.mao.s0_2': true }, goto: 'mao_s0_2_p2b' } }
    ]);

  P('mao_s0_2_p2',
    '夹层重新静下来，你撬开最近的两只货箱——罐头、[item]烈酒[/item]，还有半箱压缩饼干，全是能救命的硬货。灰猫那句话在你耳边打转：保真七成。货是真的，埋伏也是真的，这买卖，你算是见识了。',
    [{ label: '装满背包离开', fx: { item: { cannedfood: 2, liquor: 1, drycracker: 2 }, flag: { 'npc.mao.s0_2': true, 'npc.mao.ateLoss': true }, milestone: '灰猫的七成真话' } }]);

  P('mao_s0_2_p2b',
    '你退回爬梯上，井底的黑暗安静得可疑。到手的便宜和埋着的钩子，灰猫把两样拴在一起卖给你——这一课，值五发子弹。',
    [{ label: '（离开）', fx: {} }]);

  // ---- mao_s0_3 二遇 --------------------------------------------------------
  events.register({
    id: 'mao_s0_3', type: 'story', npc: 'mao', when: ['enter', 'action'], once: true, priority: 6,

  P('chen_s0_1_p2',
    '“日落后若无处可去，长椅可以借宿，热水在炉子上。”老人把一盏小烛台挪到你够得着的地方，“我们不问来路，也不留人过三天——躲一躲可以，日子还得回到外面去过。”',

  P('cai_talk_p2',
    function () {

        '“商场那帮戴红布条的，四个钟头换一班岗，交接那会儿门口就剩一个。老蔡数过，数了七遍，回回一样。”',

  events.register({

  P('cai_s0_2_p1',

  P('fang_s0_1_p1',

  P('fang_s0_2_p1',

    '夜里的检查站冷得快。[npc:fang]方哨[/npc]拢着一小堆火，看见你来，往旁边挪了挪让出位置。火光里他盯着自己的枪看了很久，忽然开口：“他们都管我叫逃兵。名单上我也是逃兵。”他扯了下嘴角，“你想不想听真的？”',
    [{ label: '“说吧，我听着。”', fx: { goto: 'fang_s1_1_p2' } }]);

    '“封城第七天，我们班守北桥桥面。人潮冲卡，上头的命令一级级压下来——上刺刀，一个不放。”他的手在膝盖上攥成拳，指节咯咯响，“班长照办了。我旁边的兵也照办了。我看着刺刀前头那些脸……”他的喉咙滚了几下，“我把枪一扔，翻过护栏，顺着桥墩爬下去的。跑的时候身后全是喊「逃兵」的声音。”火堆噼啪炸了一下，他声音低下去，“枪我后来捡回来了。命令，我到今天也没捡。”',

      { label: '往火里添根柴，陪他坐着', fx: { aff: { fang: 5 }, goto: 'fang_s1_1_p3' } }
    ]);

  P('fang_s1_1_p3',
    '[npc:fang]方哨[/npc]长长呼出一口白气，像卸掉一副背了三个月的背囊。“这事我谁都没说过。说出来……好像也没塌下来什么。”他把枪抱回怀里，抱姿松了很多，“谢了。往后你过这道卡，不用喊口令。”',
    [{ label: '（在火边多坐一会儿）', fx: { stage: { fang: 2 }, time: 60, flag: { 'npc.fang.s1_1': true }, milestone: '北桥的另一侧' } }]);

  // ---- fang_s2_3 可选成人段 --------------------------------------------------
  events.register({
    id: 'fang_s2_3', type: 'story', npc: 'fang', when: ['talk'], once: false, cooldown: 1440, priority: 5,

    passage: 'fang_s2_3_p1'

  P('fang_s2_3_p1',
    '岗亭里生着小火炉，暖和得让人不想走。[npc:fang]方哨[/npc]替你倒了热水，递杯子的时候手指碰到你的，像被烫到一样缩回去，耳朵瞬间红透。“那个……”他盯着自己的鞋尖，声音越来越小，“今晚风大。你要是……要是不嫌弃这儿，可以留下。行军床是新领的，没人睡过。我、我可以睡外头岗位上——除非你说不用。”',

<script>
/* =============================================================================
 * worldevents.js — 世界事件池（M8）
 * -----------------------------------------------------------------------------
 * 内容：
 *   1. 地点事件池补足：15 地点各 +3 条（幸存者掠影 sv_ / 遭遇·氛围二波 enc_/amb_ /
 *      罕见奇遇 rare_，与 M3 打底的 amb_/enc_/loot_ 合计每地点 4–6 条）
 *   2. 状态触发池：幻觉 halluc_1~5（sanity<20）、醉酒 drunk_1~3（alcohol>60）、
 *      毒瘾发作日 addict_attack_1（addiction>50，scheduled 每日一次，三分支）、
 *      感染濒死线 infect_crit_1（infection>80，高优先级反复催命，医院可救治）
 *   3. 全局周期：尸潮夜链（horde_warn 预警→日历 eventId 强制触发 horde_night_start
 *      → 尸潮遭遇池 horde_enc_1/2 + 室内 horde_safe_1 → 05:00 horde_night_end 收尾）、
 *      雨天（rain_start 上午随机开雨 → rain_harvest/rain_amb 加成与氛围 → 20:00 rain_end）
 *   4. 屠夫帮世界线：butcher_world_1~4（读 qin/mao 线 flag 出文案变体，不写剧情 flag）
 *
 * 世界 flag（本模块自管）：world.hordeAlert（预警中）/ world.hordeNight（尸潮夜进行中）
 *                        / world.rainDay（雨天进行中）
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  var story = G.data.story, events = G.data.events;

  function P(id, text, choices) { story.register({ id: id, text: text, choices: choices }); }
  // random 事件速记：ev(id, cond, cooldown, passageId, priority?, when?)
  function ev(id, cond, cooldown, passageId, priority, when) {
    var e = { id: id, type: 'random', cond: cond, cooldown: cooldown, passage: passageId };
    if (priority != null) e.priority = priority;
    if (when) e.when = when;
    events.register(e);
  }
  var NIGHT = [1200, 300];

  // ==========================================================================
  // 1. 地点事件池补足（每地点：掠影 / 二波遭遇·氛围 / 罕见奇遇）
  // ==========================================================================

  // ---- home ----------------------------------------------------------------
  P('sv_home_1_p', '门缝底下塞进来半张纸条，铅笔字歪歪扭扭：「西边楼里夜里有孩子哭，有余粮的行行好。」没有署名，也不知道塞了几家。', [
    { label: '收好纸条，记在心里', fx: { stat: { sanity: 2 } } },
    { label: '这年头，管不过来', fx: { stat: { sanity: -1 } } }
  ]);
  ev('sv_home_1', { loc: 'home', chance: 0.1 }, 720, 'sv_home_1_p');

  P('amb_home_3_p', '窗台上蹲着一只瘦得脱形的狸花猫，隔着玻璃跟你对视，喉咙里发出试探的咕噜声。', [
    { label: '分它一点鱼罐头', cond: { has: { item: 'cannedfish' } }, fx: { item: { cannedfish: -1 }, stat: { sanity: 5 } } },
    { label: '隔窗看它一会儿', fx: { stat: { sanity: 2 } } }
  ]);
  ev('amb_home_3', { loc: 'home', chance: 0.1 }, 720, 'amb_home_3_p');

  P('rare_home_1_p', '搬柜子的时候，天花板的一块吊顶松了角。你捅开一看——前住户的暗格，油纸包得严严实实：几个罐头，一小盒[item]子弹[/item]，还有半包受潮的烟。', [
    { label: '全部收下', fx: { item: { cannedfood: 2 }, bullets: 6, stat: { sanity: 2 } } }
  ]);
  ev('rare_home_1', { loc: 'home', chance: 0.05 }, 4320, 'rare_home_1_p');

  // ---- residential -----------------------------------------------------------
  P('sv_residential_1_p', '三楼的窗台上坐着个老人，怀里抱着一台老收音机，音量拧到最大——里面只有沙沙声。看见你，他举起收音机晃了晃：“周三！周三就有声音了！”', [
    { label: '朝他比个大拇指', fx: { stat: { sanity: 3 } } },
    { label: '（快步走开）', fx: {} }
  ]);
  ev('sv_residential_1', { loc: 'residential', chance: 0.12 }, 600, 'sv_residential_1_p');

  P('enc_residential_2_p', '夜色里两条黑影贴着墙根窜过来，速度快得不像死人——它们转过头来的时候，半张脸都没有了。', [
    { label: '迎上去解决', fx: { combat: 'runner_pack' } },
    { label: '躲进单元门洞', fx: { stat: { energy: -5, sanity: -2 } } }
  ]);
  ev('enc_residential_2', { loc: 'residential', timeRange: NIGHT, chance: 0.22 }, 300, 'enc_residential_2_p');

  P('rare_residential_1_p', '顶楼有一户的防盗门完好地锁着——你从阳台翻进去，屋里落满灰，却没被翻过：橱柜里的存粮、药箱、床头的瓶装水，都还在原位，像主人只是出了趟远门。', [
    { label: '收走能用的东西', fx: { item: { cannedfood: 2, bottledwater: 2, bandage: 1 }, stat: { sanity: -2 }, time: 30 } },

<script>
/* =============================================================================
 * dol.js — M13 DoL 模式增强（数据层）
 * -----------------------------------------------------------------------------
 * 内容（各项机制说明见 docs/任务书/M13-DoL模式增强.md）：
 *   A. 战败醒来段落 dol_defeat_p1/p2 —— combat.js 的人类敌人战败路由指向这里；
 *      机制（洗劫/重伤/昏迷 3 小时）在引擎侧结算，这里只管文本，读易失的
 *      s._defeatLoss 列损失清单（存读档后丢失则退化为通用文案，无副作用）。
 *   B. 打工系统 —— 三份工，scheduled 事件每日至多询一次（进场/整点触发）：
 *        dol_job_su  酒吧帮工（su 好感≥20，18–21 点开工，3 小时 → 3 子弹，周六偶发酒客闹事）
 *        dol_job_lin 医院助手（lin 好感≥40，8–14 点开工，4 小时 → 4 子弹+绷带，周三偶发伤员，
 *                    有 bandage 技能时有高收益处置选项）
 *        dol_job_cai 码头搬运（识得老蔡即可，8–15 点开工，4 小时 → 5 子弹，精力大耗，
 *                    周四偶发走私箱、周日偶发浮尸（尸潮前兆）见闻）
 *      收益基线：子弹时薪 1–1.25，低于中期搜刮折算期望（M13 自测报告），打工是兜底不是最优解。
 *   C. 人类遇敌非战斗脱身的共享结局段 —— 色诱/贿赂/虚张声势 三条路的成功与失败段。
 *      入口选项加在 locations.js（enc_police_1_p / enc_checkpoint_1_p）与
 *      worldevents.js（enc_gas_2_p / enc_mall_2_p / butcher_world_1_p），
 *      用 fx.roll（M13 引擎扩展）掷成功率，失败落战斗。全部只对成年人类敌人、全部玩家主动选择。
 *   D. NPC 主动邀约 —— 好感≥60（主线八人另需信任阶段）的 NPC 按作息随机发起约会：
 *        dol_invite_{id}（random，chance .15 / cd 4320，datePending 防重复登记）
 *        → 答应则登日历 appointment（次日定点，eventId 强制触发 dol_date_{id}）
 *        → 到点在场=赴约小剧情（好感+4/理智收益），不在场=爽约（好感-3）。
 *      拒绝邀约不扣好感；两条出口都清 npc.{id}.datePending。
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  var story = G.data.story, events = G.data.events;

  function P(id, text, choices) { story.register({ id: id, text: text, choices: choices }); }
  function EV(ev) { events.register(ev); }
  function obj(k, v) { var o = {}; o[k] = v; return o; }

  var LOCS = ['home', 'residential', 'market', 'hospital', 'police', 'bar', 'campus', 'metro',
              'park', 'gas', 'mall', 'church', 'dock', 'checkpoint', 'sewer'];
  // 「不在某地」条件：cond DSL 无否定，用其余 14 地点的 anyOf 表达
  function notAt(loc) {
    return { anyOf: LOCS.filter(function (l) { return l !== loc; }).map(function (l) { return { loc: l }; }) };
  }

  // ==========================================================================
  // A. 战败醒来（人类敌人战败非死亡，机制见 combat.js humanDefeat）
  // ==========================================================================

  P('dol_defeat_p1', function (s) {
    var loss = s._defeatLoss, parts = [];
    if (loss) {
      if (loss.bullets > 0) parts.push('子弹×' + loss.bullets);
      (loss.items || []).forEach(function (it) { parts.push(it.name + '×' + it.count); });
    }
    var lossStr = parts.length
      ? '口袋全被翻了面，少掉的东西数得出来：[item]' + parts.join('、') + '[/item]。'
      : '口袋全被翻了面，他们没搜出几样值钱的，临走啐了一口。';
    if ((s.world.flags.thugDefeats || 0) <= 1) {
      return '疼把你砸醒。你趴在冰冷的地上，嘴里都是铁锈味，[blood]肋骨[/blood]随着呼吸一抽一抽地扯着疼，' + lossStr +

    { label: '今晚另有安排', fx: {} }
  ]);

  P('dol_job_su_end_p', function (s) {
    var base = '三个钟头里你收了几十只杯子，替苏曼挡了两回自来熟的醉话，掌心被托盘勒出一道红印。她把三发[item]子弹[/item]拍进你手心，一发不少。';
    if (s.player.day % 7 === 5) {
      return base + '打烊前，靠门那桌起了争执，一个喝高的把凳子掀翻，正冲着邻桌撸袖子。';

  }, [
    { label: '把闹事的架出去', cond: { weekday: 5 }, fx: { aff: { su: 2 }, bullets: 1, stat: { energy: -5 }, goto: 'dol_job_su_x_p' } },
    { label: '收工', fx: {} }
  ]);

  P('dol_job_su_x_p', '你从背后架住那醉汉的胳膊往门外送，他骂骂咧咧，到底没敢真抡拳头。[npc:su]苏曼[/npc]看着你把人放到街沿上，多塞给你一发子弹："今晚这杯，算店里请。"', [
    { label: '收工', fx: {} }

  EV({ id: 'dol_job_su', type: 'scheduled', priority: 3,

  P('dol_job_lin_offer_p', function () {

  P('dol_job_lin_end_p', function (s) {

  P('dol_job_lin_x_p', '血止住的时候，伤员的骂声弱下去，变成一串含混的道谢。[npc:lin]林晚[/npc]收拾着器械抬头看了你一眼："手没抖，不错。"', [

<script>
/* =============================================================================
 * clothing.js — M14 服装系统的文本适配（数据层）
 * -----------------------------------------------------------------------------
 * 机制（服装三槽/属性/耐久/护甲/迁移）在引擎侧（state.js/combat.js/save.js）与
 * 数据侧（items.js/trade.js/locations.js）实现；本文件只做「决定性场景」的文本分支：
 *
 *   decency 反应事件（5 名 NPC 各一句）——当全身着装体面合计过低（cond.decency<=2，
 *   相当于只剩垫底基础装再被撕破、或穿了短裙这类不合时宜的搭配）时，在各 NPC 的
 *   作息地点低频弹一句氛围台词。纯氛围、不锁剧情、不设硬门槛（任务书约束），
 *   priority 1、chance 低、冷却长，met 门保证只对已识 NPC 触发。
 *
 * 成人场景的「宽衣」描写分支：引擎已提供 G.engine.isDressed()（上装+下装两槽都在），
 * 供成人段落的 text 函数按需分叉；M6/M7 既有亲密段落维持原样（改写风险与工作量红线），
 * 新增成人内容可直接读该接口。见 PLAN.md M14 交接备注。
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  var story = G.data.story, events = G.data.events;
  function P(id, text, choices) { story.register({ id: id, text: text, choices: choices }); }

  // decency 反应：{ id, npc, loc, line }。低体面时该 NPC 在其作息地点给一句反应。
  var REACTS = [
    { id: 'su',   npc: 'su',   loc: 'bar',
      line: '[npc:su]苏曼[/npc]递酒的手顿了顿，目光在你身上扫了一圈："这身……啧，末日了也不是这么穿的。后面纸箱里有几件旧衣裳，自己挑挑。"' },
    { id: 'zhao', npc: 'zhao', loc: 'market',
      line: '[npc:zhao]赵铁[/npc]从柜台后抬眼看你，眉头拧了一下："姑娘家小伙子，衣裳穿成这样，路上招人。我这儿也卖几件遮体的，便宜。"' },
    { id: 'chen', npc: 'chen', loc: 'church',
      line: '[npc:chen]陈神父[/npc]默默从长凳上取来一条毛毯，披到你肩上，什么也没多说，只念了半句听不清的祷词。' },
    { id: 'fang', npc: 'fang', loc: 'checkpoint',
      line: '[npc:fang]方哨[/npc]端着枪的手没动，只是皱眉打量你："这么点布片挡不住抓咬，也挡不住夜里的冷。找件正经衣服穿上。"' },
    { id: 'lin',  npc: 'lin',  loc: 'hospital',
      line: '[npc:lin]林晚[/npc]抬头看你一眼，从柜子里翻出一件干净的旧外套搁在台面上："先披上。冻病了我这儿药也不够治你。"' }
  ];

  REACTS.forEach(function (r) {
    var pid = 'decency_react_' + r.id + '_p';
    P(pid, r.line, [{ label: '（点头）', fx: {} }]);
    events.register({
      id: 'decency_react_' + r.id, type: 'random', priority: 1, cooldown: 2880,
      cond: { loc: r.loc, met: r.npc, decency: { lte: 2 }, chance: 0.35 },

    });

</script>

<script>
/* =============================================================================
 * season.js — M15 入冬季节事件（数据层）
 * -----------------------------------------------------------------------------
 * 机制（季节档/寒冷值/水源联动/丧尸减速/商店涨价）在引擎侧（time.js 季节与寒冷、
 * combat.js 减速、state.js season cond）与数据侧（locations.js 破冰/接雪/生火、
 * trade.js 涨价上新、items.js 柴火）实现；本文件只做「季节文本层」：
 *
 *   1. 寒潮预警链（仿 M8 尸潮夜 appointment 写法）：coldsnap_warn 预警 → 次日定点
 *      coldsnap_start 强制开场（写 world.coldSnap，室外寒冷 +TUNE.coldSnapSurge）→
 *      次日 coldsnap_end 收尾清旗。只在冬季（season winter）出现。
 *   2. 雪天氛围池 snow_amb_1~7（冬季·室外，纯氛围/少量数值）。
 *   3. 冻毙的流浪者 frozen_wanderer_1~3（冬季·室外，拾取遗物衣物的道德小分支：
 *      取暖 vs 留全尸，各给不同数值取向）。为控体量做成「共享池」跨室外地点触发，
 *      而非逐地点各写 2–3 条——与 M8 世界事件同样的共享池取舍（见 PLAN.md M15 备注）。
 *
 * 世界 flag（本模块自管）：world.coldSnapAlert（预警中）/ world.coldSnap（寒潮进行中）
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  var story = G.data.story, events = G.data.events;

  function P(id, text, choices) { story.register({ id: id, text: text, choices: choices }); }
  function ev(id, cond, cooldown, passageId, priority, when) {
    var e = { id: id, type: 'random', cond: cond, cooldown: cooldown, passage: passageId };
    if (priority != null) e.priority = priority;
    if (when) e.when = when;
    events.register(e);
  }
  var NIGHT = [1200, 300];
  // 室外地点（室内安全区 home/bar/church 除外），供雪天/流浪者共享池 anyOf
  var OUTDOOR = { anyOf: [
    { loc: 'residential' }, { loc: 'market' }, { loc: 'hospital' }, { loc: 'police' },
    { loc: 'campus' }, { loc: 'metro' }, { loc: 'park' }, { loc: 'gas' },
    { loc: 'mall' }, { loc: 'dock' }, { loc: 'checkpoint' }, { loc: 'sewer' }
  ] };
  function outdoor(extra) {
    var c = { anyOf: OUTDOOR.anyOf };
    for (var k in extra) c[k] = extra[k];
    return c;
  }

  // ==========================================================================
  // 1. 寒潮预警链
  // ==========================================================================
  events.register({
    id: 'coldsnap_warn', type: 'random', when: ['tick', 'enter'], priority: 5, cooldown: 8640,
    cond: { season: 'winter', timeRange: [1020, 1380], chance: 0.09,
            flag: { 'world.coldSnap': false, 'world.coldSnapAlert': false } },
    passage: 'coldsnap_warn_p1'
  });

  P('coldsnap_warn_p1',
    function (s) {
      if (s.npcs.zhou && s.npcs.zhou.met) {
        return '收音机里插进一段加播，周响的声音压得很沉：“再报一次寒潮预警——今夜起北方强冷空气过境，最低温度骤降，务必备足柴火、糊严门窗，非必要不要出门。冻死人的天气，不是吓唬你们。”';
      }
      if (s.npcs.cai && s.npcs.cai.met) {
        return '老蔡蹲在码头边闻了闻风，忽然扭头冲你喊：“要变天了！这风带着刀子味——今晚起寒潮，屋里囤柴，江面明后天就得封冰。”说完又缩回他那堆破棉絮里。';
      }
      return '街角几个人围着一台半导体收音机，脸色都不好看：预报说今夜起寒潮过境，气温断崖式往下掉。人群很快散了，各自回去抱柴、堵窗——这年头，冻比饿来得更快。';
    },
    [{ label: '囤柴、糊窗，准备熬这一场', fx: {
        flag: { 'world.coldSnapAlert': true },

  P('snow_amb_1_p', '雪不知什么时候下了起来，一片片压着灰败的街道，把弹壳、血迹和拖行的爪痕都盖成了同一种白。有那么一瞬间，这座城安静得像是从没死过。', [

  ev('snow_amb_1', outdoor({ season: 'winter', chance: 0.15 }), 360, 'snow_amb_1_p', 1);

    { label: '（愿他走到了想去的地方）', fx: { stat: { sanity: 1 } } }

  ev('snow_amb_2', outdoor({ season: 'winter', chance: 0.12 }), 480, 'snow_amb_2_p', 1);

  P('snow_amb_3_p', '一只麻雀冻僵在窗台的雪堆里，羽毛还蓬着，像只是睡着了。这样的冬天，连活得最不起眼的东西也熬不住。', [
    { label: '把它埋进雪里', fx: { stat: { sanity: 2 }, time: 10 } },
    { label: '移开视线走开', fx: { stat: { sanity: -1 } } }
  ]);
  ev('snow_amb_3', outdoor({ season: 'winter', chance: 0.12 }), 480, 'snow_amb_3_p', 1);

  P('snow_amb_4_p', '呵出的白气刚离开嘴唇就散了。你搓着手，忽然想起从前这种天该是围炉、烫酒、窝在被子里刷手机的日子——那些暖和的念头此刻反倒让人更冷。', [
    { label: '甩掉这点念想', fx: { stat: { sanity: -2 } } },
    { label: '算了，还活着就好', fx: { stat: { sanity: 2 } } }
  ]);
  ev('snow_amb_4', outdoor({ season: 'winter', chance: 0.1 }), 600, 'snow_amb_4_p', 1);

  P('snow_amb_5_p', '积雪压塌了一处棚顶，闷响过后，整条街的死人都朝这边偏了偏头，又缓缓垂下——它们在雪里迟钝得像慢放的影子，你却半天暖不过来。冬天是敌弱，我更弱。', [
    { label: '趁它们发懵绕开', fx: { stat: { energy: -3 }, time: 10 } }
  ]);
  ev('snow_amb_5', outdoor({ season: 'winter', chance: 0.1 }), 600, 'snow_amb_5_p', 1);

  P('snow_amb_6_p', '深冬的夜里，天冷得连星子都显得锋利。远处某扇窗透出一点橘黄的火光，像这片死寂里唯一还跳动的东西。你盯着那点光，脚步不由得快了些。', [
    { label: '朝着有火光的方向走', fx: { stat: { sanity: 2, cold: 2 } } }
  ]);
  ev('snow_amb_6', outdoor({ season: 'deepwinter', timeRange: NIGHT, chance: 0.14 }), 420, 'snow_amb_6_p', 1);

  P('snow_amb_7_p', '风卷着雪粒抽在脸上，生疼。你把围在脸上的布又拉高一截，睫毛上的霜化了又结。这种风里，保暖的衣裳不是讲究，是命。', [
    { label: '（低头顶着风走）', fx: { stat: { cold: 4, energy: -2 } } }
  ]);
  ev('snow_amb_7', outdoor({ season: 'deepwinter', chance: 0.12 }), 480, 'snow_amb_7_p', 1);

  // ==========================================================================
  // 3. 冻毙的流浪者（冬季·室外，拾取衣物的道德小分支）
  // ==========================================================================
  // 三条变体各给一件保暖衣物：取 → 保暖但理智略损；留 → 理智略增。共享池跨室外地点。
  P('frozen_wanderer_1_p',
    '墙根下靠坐着一个人，一动不动。你以为是睡着的，走近才看清——早冻硬了，怀里还护着半块没啃完的饼。他身上那件厚[item]连帽卫衣[/item]倒是完好，对活人来说，是能续命的东西。', [
    { label: '脱下他的卫衣带走', fx: { item: { hoodie: 1 }, stat: { sanity: -4 }, time: 15 } },
    { label: '给他拢一把雪盖上，走了', fx: { stat: { sanity: 3 }, time: 10 } }
  ]);
  ev('frozen_wanderer_1', outdoor({ season: 'winter', chance: 0.1 }), 2880, 'frozen_wanderer_1_p', 2);

  P('frozen_wanderer_2_p',

    { label: '换走他的靴子', fx: { item: { work_boots: 1 }, stat: { sanity: -3 }, time: 15 } },
    { label: '留他一具全尸', fx: { stat: { sanity: 2 } } }
  ]);
  ev('frozen_wanderer_2', outdoor({ season: 'winter', chance: 0.1 }), 2880, 'frozen_wanderer_2_p', 2);

  P('frozen_wanderer_3_p',
    function (s) {
      var base = '一具冻僵的尸体半埋在雪里，身上裹着件蓬松的[item]羽绒服[/item]，是这种天气里最要命也最救命的东西。它已经帮不了主人了。';
      if (s.player.stats.cold > (G.TUNE ? G.TUNE.T_COLD_CAP : 50)) {
        base += '你自己也冷得开始发抖，牙关咯咯打颤——这件衣服，你比他更需要。';
      }
      return base;
    }, [
    { label: '剥下羽绒服穿上／收好', fx: { item: { down_jacket: 1 }, stat: { sanity: -5 }, time: 20 } },
    { label: '狠不下心，替他合上眼', fx: { stat: { sanity: 4 }, time: 10 } }
  ]);
  ev('frozen_wanderer_3', outdoor({ season: 'deepwinter', chance: 0.08 }), 4320, 'frozen_wanderer_3_p', 2);

<script>
/* =============================================================================
 * main.js — 启动流程 / 全局错误兜底 / G.ui 占位接口（必须最后加载）
 * -----------------------------------------------------------------------------
 * G.ui 接口清单（M1 为占位空实现，M2 实现真正渲染）：
 *   G.ui.showLocation()          —— 渲染当前地点主界面（行动列表/状态条）
 *   G.ui.showPassage(id)         —— 渲染一个剧情段落（正文 + 选项）
 *   G.ui.refresh()               —— 刷新状态栏/日历等常驻面板
 *   G.ui.showCombat(combatState) —— 渲染战斗界面
 *   —— 以下为 M1 追加的接口（见 PLAN 交接备注），M2 一并实现：
 *   G.ui.showShop(shopId)        —— 打开交易界面
 *   G.ui.showDeath(cause)        —— 死亡后的读档界面
 *   G.ui.showIntro()             —— 开场/角色创建（决定 name+gender 后调 G.engine.newGameStart）
 *
 * 引擎侧启动接口：
 *   G.engine.newGameStart(opts)  —— 用 opts:{name,gender} 开新局并进入安全屋
 *   G.engine.boot()              —— 启动：有自动档则载入，否则进开场/默认新局
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  G.engine = G.engine || {};

  // ---- G.ui 占位（仅在缺失时补，M2 的真实实现会被保留） ------------------
  G.ui = G.ui || {};
  function stub(name, fn) {
    if (!G.ui[name]) { fn.__stub = true; G.ui[name] = fn; }
  }
  stub('showLocation', function () { console.log('[ui:stub] showLocation @', G.state && G.state.player.location); });
  stub('showPassage', function (id) { console.log('[ui:stub] showPassage:', id); });
  stub('refresh', function () { /* no-op */ });
  stub('showCombat', function (c) { console.log('[ui:stub] showCombat vs', c.enemies.map(function (e) { return e.name; }).join('、')); });
  stub('showShop', function (id) { console.log('[ui:stub] showShop:', id); });
  stub('showDeath', function (cause) { console.log('[ui:stub] showDeath:', cause); });
  stub('showIntro', function () { console.log('[ui:stub] showIntro（无 UI，退回默认开局）'); });

  // ---- 启动流程 -----------------------------------------------------------
  function newGameStart(opts) {
    G.state = G.engine.newGame(opts || {});
    if (G.ui.refresh) G.ui.refresh();
    G.engine.goLocation(G.state.player.location);
    return G.state;
  }
  G.engine.newGameStart = newGameStart;

  function boot() {
    try {
      if (G.engine.hasSave('auto')) { G.engine.load('auto'); return; }
      // 无自动档：若有真实开场界面则走角色创建，否则以默认值直接开局
      if (G.ui.showIntro && !G.ui.showIntro.__stub) { G.ui.showIntro(); return; }
      newGameStart();
    } catch (e) {
      console.error('[main] 启动失败:', e);
    }
  }
  G.engine.boot = boot;

  // ---- 全局错误兜底 -------------------------------------------------------
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('error', function (ev) {
      console.error('[main] 未捕获错误:', ev.error || ev.message);
    });
    window.addEventListener('unhandledrejection', function (ev) {
      console.error('[main] 未处理的 Promise 拒绝:', ev.reason);
    });
  }

  // ---- 自动启动（浏览器环境） ---------------------------------------------
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  }

})();

</script>
