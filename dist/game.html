<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12100f">
  <title>临港余生</title>
  <style>
/* =============================================================================
 * style.css — 移动端竖屏优先深色主题（M2）
 * -----------------------------------------------------------------------------
 * 结构对应 js/ui/render.js 与 js/ui/panels.js 构建的 DOM：
 *   #app > .topbar + .statusbar + .main + .bottomnav
 *   面板/商店/战斗/开局/死亡均以 .overlay 全屏浮层呈现（.overlay-panel 内容卡片）
 * 颜色变量集中在 :root，M9 若要整体调色只改这里。
 * ========================================================================== */

/* ---- 重置 ---------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
input { font: inherit; }

:root {
  --bg:        #141414;
  --bg-raise:  #1b1a19;
  --bg-card:   #201f1d;
  --border:    #2f2c28;
  --fg:        #c8c8c8;
  --fg-dim:    #8d8a84;
  --fg-bright: #ece7de;
  --accent:    #b5793a;
  --accent-2:  #8a6a3f;
  --danger:    #c0392b;
  --ok:        #4a9a63;
  --warn:      #c49a3a;
  --info:      #3a7fb0;

  --tag-item:  #d4a941;
  --tag-place: #56a8b0;
  --tag-blood: #c0392b;
  --tag-med:   #9b59b6;
  --tag-zed:   #8e2f22;
  --tag-lust:  #d46a9c;

  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);

  --topbar-h: 52px;
  --statusbar-h: 40px;
  --bottomnav-h: 56px;
}

html {
  background: var(--bg);
  touch-action: manipulation;   /* 禁用双击缩放，降低 300ms 点击延迟 */
  -webkit-text-size-adjust: 100%;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", "Songti SC", serif;
  font-size: 17px;
  line-height: 1.9;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
}

#app {
  position: relative;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* 桌面浏览器：居中限宽，两侧露出深色背景 */
@media (min-width: 481px) {
  body { background: #0c0c0c; }
  #app { box-shadow: 0 0 40px rgba(0,0,0,.6); }
}

a, button, .tappable { -webkit-tap-highlight-color: transparent; }

/* ---- 顶栏 ------------------------------------------------------------------ */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  height: var(--topbar-h);
  padding: calc(var(--sat)) 12px 0;
  min-height: calc(var(--topbar-h) + var(--sat));
  background: var(--bg-raise);
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  color: var(--fg-dim);
}
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.topbar-btn { display: flex; align-items: center; gap: 6px; padding: 8px 4px; min-height: 44px; background: none; border: none; cursor: pointer; }
.topbar-icon { font-size: 16px; }
.topbar-date { color: var(--fg); }
.topbar-time { color: var(--fg-bright); font-variant-numeric: tabular-nums; }
.topbar-bullets { color: var(--tag-item); }
.topbar-loc { color: var(--tag-place); max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- 状态条区 --------------------------------------------------------------- */
.statusbar {
  position: sticky; top: calc(var(--topbar-h) + var(--sat)); z-index: 19;
  display: flex; gap: 8px;
  padding: 6px 12px;
  background: var(--bg-raise);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.statusbar-item { flex: 1; min-width: 0; }
.statusbar-label { font-size: 11px; color: var(--fg-dim); display: flex; justify-content: space-between; }
.statusbar-track { height: 6px; border-radius: 3px; background: #302d29; overflow: hidden; margin-top: 2px; }
.statusbar-fill { height: 100%; border-radius: 3px; transition: width .25s ease; }
.statusbar-fill.hp { background: var(--danger); }
.statusbar-fill.hunger { background: var(--warn); }
.statusbar-fill.thirst { background: var(--info); }
.statusbar-fill.energy { background: var(--ok); }
.statusbar-fill.cold { background: #6fa8c7; }
.statusbar-fill.low { filter: brightness(1.3); animation: pulse 1.4s ease-in-out infinite; }

/* ---- 主区域 ------------------------------------------------------------------ */
.main {
  flex: 1;
  padding: 16px 16px calc(24px + var(--sab));
  padding-left: calc(16px + var(--sal));
  padding-right: calc(16px + var(--sar));
  overflow-y: auto;
}

.passage-text, .location-desc { color: var(--fg); white-space: pre-wrap; margin-bottom: 20px; }

.choice-list, .action-list, .move-list { display: flex; flex-direction: column; gap: 10px; }

.btn {
  display: block; width: 100%; text-align: left;
  min-height: 44px; padding: 11px 14px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
  color: var(--fg-bright); cursor: pointer;
}
.btn:active { background: var(--bg-raise); border-color: var(--accent-2); }
.btn.disabled, .btn[disabled] { color: var(--fg-dim); opacity: .5; pointer-events: none; }
.btn.primary { border-color: var(--accent); color: var(--accent); }
.btn.danger { border-color: var(--danger); color: var(--danger); }

.section-title { font-size: 13px; color: var(--fg-dim); margin: 18px 0 8px; letter-spacing: .1em; }
.section-title:first-child { margin-top: 0; }

.location-npcs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.npc-chip {
  min-height: 36px; padding: 6px 12px; border-radius: 18px;
  background: var(--bg-card); border: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px; cursor: pointer;
}
.npc-chip .dot { width: 8px; height: 8px; border-radius: 50%; }

/* ---- 底部导航 ---------------------------------------------------------------- */
.bottomnav {
  position: sticky; bottom: 0; z-index: 20;
  display: flex;
  height: var(--bottomnav-h);
  padding-bottom: var(--sab);
  background: var(--bg-raise);
  border-top: 1px solid var(--border);
}
.navbtn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 44px; background: none; border: none; color: var(--fg-dim); cursor: pointer;
}
.navbtn .navicon { font-size: 18px; }
.navbtn .navlabel { font-size: 11px; }
.navbtn.active { color: var(--accent); }

/* ---- 浮层通用（面板/商店/战斗/开局/死亡） ------------------------------------ */
.overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,.55);
  display: flex; flex-direction: column; justify-content: flex-end;
}
.overlay.center { justify-content: center; align-items: center; padding: 24px; }
.overlay-panel {
  background: var(--bg-raise);
  border-top: 1px solid var(--border);
  border-radius: 14px 14px 0 0;
  max-height: 86vh;
  display: flex; flex-direction: column;
  padding-bottom: var(--sab);
  width: 100%; max-width: 480px; margin: 0 auto;
}
.overlay.center .overlay-panel { border-radius: 12px; max-height: 80vh; }
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-header h2 { margin: 0; font-size: 17px; color: var(--fg-bright); font-weight: normal; }
.panel-close {
  min-width: 44px; min-height: 44px; background: none; border: none;
  color: var(--fg-dim); font-size: 20px; cursor: pointer;
}
.panel-body { padding: 14px 16px; overflow-y: auto; }

/* ---- 日历面板 ----------------------------------------------------------------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head button { min-width: 44px; min-height: 36px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-wd { text-align: center; font-size: 12px; color: var(--fg-dim); padding-bottom: 4px; }
.cal-cell {
  position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 6px; background: var(--bg-card); font-size: 13px; color: var(--fg-dim); cursor: pointer;
}
.cal-cell.pad { background: transparent; cursor: default; }
.cal-cell.today { border: 1px solid var(--accent); color: var(--fg-bright); }
.cal-cell .dots { position: absolute; bottom: 3px; display: flex; gap: 2px; }
.cal-cell .dots i { width: 4px; height: 4px; border-radius: 50%; display: block; }
.cal-dot-appt { background: var(--info); }
.cal-dot-cycle { background: var(--ok); }
.cal-dot-milestone { background: var(--accent); }
.cal-legend { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--fg-dim); }
.cal-legend span { display: inline-flex; align-items: center; gap: 4px; }
.cal-legend i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.cal-day-detail { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 14px; color: var(--fg); }

/* ---- 背包面板 ------------------------------------------------------------------ */
.inv-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; }
.inv-tab {
  flex-shrink: 0; min-height: 36px; padding: 6px 14px; border-radius: 16px;
  background: var(--bg-card); border: 1px solid var(--border); color: var(--fg-dim); cursor: pointer;
}
.inv-tab.active { color: var(--fg-bright); border-color: var(--accent); }
.inv-weight { font-size: 12px; color: var(--fg-dim); margin-bottom: 10px; }
.inv-weight.over { color: var(--danger); }
.inv-list { display: flex; flex-direction: column; gap: 8px; }
.inv-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  min-height: 44px; padding: 10px 12px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
}
.inv-item .name { color: var(--fg-bright); }
.inv-item .name.equipped::after { content: " · 已装备"; color: var(--accent); font-size: 12px; }
.inv-item .count { color: var(--fg-dim); font-size: 13px; }
.inv-empty { color: var(--fg-dim); text-align: center; padding: 30px 0; }
.item-detail-body { display: flex; flex-direction: column; gap: 12px; }
.item-detail-desc { color: var(--fg); }
.item-detail-meta { font-size: 13px; color: var(--fg-dim); }
.item-actions { display: flex; gap: 8px; }
.item-actions .btn { flex: 1; text-align: center; }

/* ---- 身体面板 ------------------------------------------------------------------ */
.body-grid { display: flex; flex-direction: column; gap: 14px; }
.body-stat .label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
.body-stat .label .val { color: var(--fg-bright); font-variant-numeric: tabular-nums; }
.body-stat .track { height: 8px; border-radius: 4px; background: #302d29; overflow: hidden; }
.body-stat .fill { height: 100%; border-radius: 4px; }
.body-stat .note { font-size: 12px; color: var(--fg-dim); margin-top: 3px; }
.body-stat.abnormal .label .val, .body-stat.abnormal .note { color: var(--danger); }

/* ---- 着装区块（M14） ---------------------------------------------------------- */
.outfit-summary { font-size: 13px; color: var(--fg-dim); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.outfit-slots { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
.outfit-row { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 10px; border-radius: 6px; background: #26231f; }
.outfit-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.outfit-slot { font-size: 12px; color: var(--fg-dim); }
.outfit-name { font-size: 14px; color: var(--fg-bright); }
.outfit-name.empty { color: var(--fg-dim); font-style: italic; }
.outfit-name.torn { color: var(--danger); }
.outfit-dur { font-size: 11px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
.outfit-acts { display: flex; gap: 6px; flex-shrink: 0; }
.outfit-acts .btn { padding: 4px 10px; font-size: 13px; }

/* ---- 地图面板（M11：按 mapPos 真实地理摆放，替代原环形布局） ------------------- */
.map-wrap { width: 100%; overflow: hidden; }
.map-svg { width: 100%; height: auto; display: block; }
.map-edge { stroke: var(--border); stroke-width: 1.5; }
.map-edge.shortcut { stroke: var(--tag-place); stroke-dasharray: 3 3; }
.map-edge-label { fill: var(--fg-dim); font-size: 6px; text-anchor: middle; }
.map-node circle { stroke: var(--border); stroke-width: 2; }
.map-node text { fill: var(--fg-dim); font-size: 10px; text-anchor: middle; }
.map-node.danger-0 circle { fill: var(--ok); }
.map-node.danger-1 circle { fill: #7a9a45; }
.map-node.danger-2 circle { fill: var(--warn); }
.map-node.danger-3 circle { fill: var(--danger); }
.map-node.current circle { stroke: var(--fg-bright); stroke-width: 3; }
.map-node.current text { fill: var(--fg-bright); font-weight: bold; }
.map-node.adj circle { stroke: var(--tag-place); stroke-width: 3; }
.map-node.closed { opacity: .4; }
.map-node { cursor: pointer; }
.map-legend { margin-top: 6px; font-size: 12px; color: var(--fg-dim); }

/* ---- 系统面板 ------------------------------------------------------------------ */
.slot-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.slot-card { padding: 10px 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; }
.slot-card .slot-title { color: var(--fg-bright); margin-bottom: 4px; }
.slot-card .slot-summary { font-size: 13px; color: var(--fg-dim); margin-bottom: 8px; }
.slot-card .slot-actions { display: flex; gap: 8px; }
.slot-card .slot-actions .btn { flex: 1; text-align: center; min-height: 40px; padding: 8px; }
.export-box { width: 100%; min-height: 80px; background: var(--bg-card); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; resize: vertical; }
.about-text { font-size: 13px; color: var(--fg-dim); margin-top: 16px; }

/* ---- 战斗界面 ------------------------------------------------------------------ */
.combat-screen { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.enemy-row { display: flex; gap: 10px; flex-wrap: wrap; padding: 14px 16px 0; }
.enemy-card { flex: 1; min-width: 120px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.enemy-card.dead { opacity: .4; }
.enemy-card .ename { color: var(--tag-zed); margin-bottom: 4px; }
.enemy-card .hp-track { height: 6px; border-radius: 3px; background: #302d29; overflow: hidden; }
.enemy-card .hp-fill { height: 100%; background: var(--danger); }
.combat-log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
.combat-log .line { color: var(--fg); }
.combat-log .line.turn-sep { color: var(--fg-dim); font-size: 12px; margin-top: 4px; border-top: 1px dashed var(--border); padding-top: 6px; }
.combat-weapon { padding: 0 16px 8px; font-size: 12px; color: var(--fg-dim); }
.combat-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 16px calc(14px + var(--sab)); }
.combat-actions .btn { text-align: center; font-size: 13px; line-height: 1.25; padding: 8px 4px; }
.enc-tag { color: var(--fg-dim); font-size: .88em; }

/* ---- 商店界面 ------------------------------------------------------------------ */
.shop-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
.shop-bullets { font-size: 13px; color: var(--tag-item); margin-bottom: 10px; }
.shop-list { display: flex; flex-direction: column; gap: 8px; }
.shop-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 10px 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; }
.shop-item .price { color: var(--tag-item); font-size: 13px; }
.shop-item .btn { min-height: 36px; padding: 6px 12px; width: auto; }

/* ---- 开局流程 ------------------------------------------------------------------ */
.intro-screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; gap: 24px; }
.intro-title { font-size: 22px; color: var(--fg-bright); text-align: center; letter-spacing: .1em; }
.intro-sub { font-size: 14px; color: var(--fg-dim); text-align: center; margin-top: -12px; }
.gender-select { display: flex; gap: 10px; }
.gender-btn { flex: 1; min-height: 48px; text-align: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.gender-btn.active { border-color: var(--accent); color: var(--accent); }
.name-input { min-height: 48px; padding: 0 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--fg-bright); width: 100%; }
.name-input::placeholder { color: var(--fg-dim); }

/* ---- 短暂提示 ------------------------------------------------------------------ */
.toast {
  position: fixed; left: 50%; top: calc(var(--topbar-h) + var(--sat) + 10px);
  transform: translateX(-50%);
  max-width: 88%; z-index: 90;
  background: rgba(20,18,16,.95); border: 1px solid var(--border); border-radius: 8px;
  color: var(--fg-bright); font-size: 13px; padding: 10px 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,.4);
}

/* ---- 死亡界面 ------------------------------------------------------------------ */
.death-screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 32px 24px; gap: 18px; text-align: center; }
.death-title { font-size: 24px; color: var(--danger); letter-spacing: .15em; }
.death-cause { color: var(--fg-dim); }

/* ---- 文字标签 ------------------------------------------------------------------ */
.tag-item  { color: var(--tag-item); }
.tag-place { color: var(--tag-place); }
.tag-blood { color: var(--tag-blood); }
.tag-med   { color: var(--tag-med); }
.tag-zed   { color: var(--tag-zed); }
.tag-lust  { color: var(--tag-lust); }
.tag-horror, .tag-flash { color: var(--danger); }
.tag-anim-horror { display: inline-block; animation: tag-shake .5s ease-in-out infinite; }
.tag-anim-flash  { display: inline-block; animation: tag-blink 1s step-start infinite; }

@keyframes tag-shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-1.5px) rotate(-1deg); }
  75% { transform: translateX(1.5px) rotate(1deg); }
}
@keyframes tag-blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: .35; }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .5; }
}

@media (prefers-reduced-motion: reduce) {
  .tag-anim-horror, .tag-anim-flash, .statusbar-fill.low { animation: none; }
}

  </style>

<!-- js/engine/state.js -->
<script>
/* =============================================================================
 * state.js — 游戏状态与 DSL 求值器
 * -----------------------------------------------------------------------------
 * 挂载到 G.state（数据）与 G.engine（下列函数）：
 *
 *   G.engine.newGame(opts)            —— 创建新开局 GameState（opts: {name, gender}）
 *   G.engine.absMinute(state?)        —— 绝对分钟 = day*1440 + minute
 *   G.engine.clamp(v, lo, hi)         —— 数值钳制
 *   G.engine.statGet(name)            —— 读身体状态
 *   G.engine.statAdd(name, delta)     —— 加身体状态并钳制 0–100，返回新值
 *   G.engine.statSet(name, val)       —— 设身体状态（钳制 0–100）
 *   G.engine.getFlag(path)            —— 读标记（路径规则见下）
 *   G.engine.setFlag(path, val)       —— 写标记
 *   G.engine.affGet(id) / affAdd(id,d)—— NPC 好感（钳制 -100..100）
 *   G.engine.stageGet(id)             —— NPC 阶段
 *   G.engine.advanceStage(id, target) —— 阶段推进，仅允许 +1，越级/回退被拒
 *   G.engine.hasItem(id) / countItem(id) / addItem(id,n) / removeItem(id,n)
 *   G.engine.invWeight()              —— 背包总重
 *   G.engine.checkCond(cond)          —— 条件 DSL 求值 → bool
 *   G.engine.applyFx(fx)              —— 效果 DSL 执行 → 返回导航指令 {goto?,combat?,shop?}
 *
 * 标记路径规则（getFlag/setFlag/cond.flag/fx.flag 通用）：
 *   "world.xxx"   → G.state.world.flags.xxx
 *   "npc.qin.xxx" → G.state.npcs.qin.storyFlags.xxx
 *   其他 "xxx"    → G.state.player.flags.xxx
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  G.engine = G.engine || {};

  // 全部 NPC id（剧情事实源见 docs/NPC设定.md）；数据层可复用此表
  var NPC_IDS = ['qin', 'lin', 'mao', 'su', 'dou', 'zhou', 'zhao', 'chen', 'cai', 'fang'];
  G.NPC_IDS = NPC_IDS;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  G.engine.clamp = clamp;

  // ---- 新开局 -------------------------------------------------------------
  function newGame(opts) {
    opts = opts || {};
    var npcs = {};
    NPC_IDS.forEach(function (id) {
      npcs[id] = { met: false, alive: true, affinity: 0, stage: 0, storyFlags: {}, vars: {} };
    });
    var gender = opts.gender === 'f' ? 'f' : 'm';
    return {
      meta: { version: G.SAVE_VERSION || 1, saveTime: 0 },
      player: {
        name: opts.name || '',
        gender: gender,
        // 时间锚点：第 90 天 = 10月12日周日，开局早晨醒来
        day: 90, minute: 480,
        location: 'home',
        stats: { hp: 100, hunger: 70, thirst: 70, energy: 80,
                 sanity: 80, alcohol: 0, addiction: 0, infection: 0,
                 cold: 0 },   // M15：寒冷值（0–100），开局 10 月尚在秋季不累积
        bullets: 20,
        weapon: null,                 // {id, durability}
        outfit: initialOutfit(gender),// M14：三槽服装 {top,bottom,shoes}，每槽 {id,dur}|null
        inventory: [],                // [{id, count}]；武器/服装条目额外带 durability
        skills: {},
        flags: {}
      },
      npcs: npcs,
      world: { flags: {}, cooldowns: {}, _firedDay: {}, season: 'autumn' }, // _firedDay: scheduled 每日去重；season: M15 季节缓存
      calendar: { appointments: [], milestones: [] },
      scavenge: {}
    };
  }
  G.engine.newGame = newGame;

  function S() { return G.state; }

  // ---- 时间 ---------------------------------------------------------------
  function absMinute(state) {
    var s = (state || S()).player;
    return s.day * 1440 + s.minute;
  }
  G.engine.absMinute = absMinute;

  // ---- 身体状态（0–100） --------------------------------------------------
  function statGet(name) { return S().player.stats[name]; }
  function statSet(name, val) {
    return (S().player.stats[name] = clamp(val, 0, 100));
  }
  function statAdd(name, delta) {
    var st = S().player.stats;
    if (typeof st[name] !== 'number') st[name] = 0;
    return (st[name] = clamp(st[name] + delta, 0, 100));
  }
  G.engine.statGet = statGet;
  G.engine.statSet = statSet;
  G.engine.statAdd = statAdd;

  // ---- 标记路径解析 -------------------------------------------------------
  // 返回 {obj, key}，getFlag/setFlag 共用
  function resolveFlag(path) {
    var s = S();
    if (path.indexOf('world.') === 0) {
      return { obj: s.world.flags, key: path.slice(6) };
    }
    if (path.indexOf('npc.') === 0) {
      var rest = path.slice(4);              // "qin.xxx"
      var dot = rest.indexOf('.');
      var id = dot < 0 ? rest : rest.slice(0, dot);
      var key = dot < 0 ? '' : rest.slice(dot + 1);
      var npc = s.npcs[id];
      if (!npc) { console.warn('[state] 未知 NPC 标记路径:', path); return null; }
      return { obj: npc.storyFlags, key: key };
    }
    return { obj: s.player.flags, key: path };
  }
  function getFlag(path) {
    var r = resolveFlag(path);
    return r ? r.obj[r.key] : undefined;
  }
  function setFlag(path, val) {
    var r = resolveFlag(path);
    if (r) r.obj[r.key] = val;
    return val;
  }
  G.engine.getFlag = getFlag;
  G.engine.setFlag = setFlag;

  // ---- NPC 好感 / 阶段 ----------------------------------------------------
  function npc(id) {
    var n = S().npcs[id];
    if (!n) console.warn('[state] 未知 NPC:', id);
    return n;
  }
  function affGet(id) { var n = npc(id); return n ? n.affinity : 0; }
  function affAdd(id, delta) {
    var n = npc(id); if (!n) return 0;
    return (n.affinity = clamp(n.affinity + delta, -100, 100));
  }
  function stageGet(id) { var n = npc(id); return n ? n.stage : 0; }
  // 阶段只允许 +1 式推进，由引擎校验（Schema fx.stage 约定）
  function advanceStage(id, target) {
    var n = npc(id); if (!n) return false;
    if (target === n.stage + 1) { n.stage = target; return true; }
    if (target <= n.stage) { return false; }           // 回退或重复：静默拒绝
    console.warn('[state] 阶段越级被拒:', id, n.stage, '→', target);
    return false;
  }
  G.engine.affGet = affGet;
  G.engine.affAdd = affAdd;
  G.engine.stageGet = stageGet;
  G.engine.advanceStage = advanceStage;

  // ---- 背包 ---------------------------------------------------------------
  function itemDef(id) { return (G.data && G.data.items && G.data.items[id]) || null; }
  function invEntry(id) {
    var inv = S().player.inventory;
    for (var i = 0; i < inv.length; i++) if (inv[i].id === id) return inv[i];
    return null;
  }
  function countItem(id) { var e = invEntry(id); return e ? e.count : 0; }
  function hasItem(id) { return countItem(id) > 0; }
  function addItem(id, n) {
    n = (n == null) ? 1 : n;
    if (n <= 0) return removeItem(id, -n);
    var def = itemDef(id);
    var inv = S().player.inventory;
    // 武器/服装每件独立成条目并带耐久（可堆叠数量仅对无耐久物资有效）
    if (def && (def.type === 'weapon' || def.type === 'clothing')) {
      for (var k = 0; k < n; k++) {
        inv.push({ id: id, count: 1, durability: def.durMax || 1 });
      }
      return;
    }
    var e = invEntry(id);
    if (e) e.count += n; else inv.push({ id: id, count: n });
  }
  function removeItem(id, n) {
    n = (n == null) ? 1 : n;
    if (n <= 0) return;
    var inv = S().player.inventory;
    var e = invEntry(id);
    if (!e) return;
    e.count -= n;
    if (e.count <= 0) {
      var idx = inv.indexOf(e);
      if (idx >= 0) inv.splice(idx, 1);
    }
  }
  function invWeight() {
    var inv = S().player.inventory, total = 0;
    for (var i = 0; i < inv.length; i++) {
      var def = itemDef(inv[i].id);
      total += (def ? (def.weight || 0) : 0) * inv[i].count;
    }
    return total;
  }
  // 背包总重上限 30（Schema），可被技能/道具扩容；超重无法快跑逃跑/快速移动
  var CARRY_BASE = 30;
  function carryCap() {
    var p = S().player, cap = CARRY_BASE;
    if (p.skills.packmule) cap += 10;      // 预留：负重技能（数据层定义）
    if (p.flags.carryBonus) cap += p.flags.carryBonus;
    return cap;
  }
  function isOverweight() { return invWeight() > carryCap(); }
  G.engine.itemDef = itemDef;
  G.engine.countItem = countItem;
  G.engine.hasItem = hasItem;
  G.engine.addItem = addItem;
  G.engine.removeItem = removeItem;
  G.engine.invWeight = invWeight;
  G.engine.carryCap = carryCap;
  G.engine.isOverweight = isOverweight;

  // ---- 服装（M14） --------------------------------------------------------
  // 开局按性别发一套垫底基础装（worn 系列）。老档迁移走 save.js DEFAULT_OUTFIT。
  var CLOTH_SLOTS = ['top', 'bottom', 'shoes'];
  G.CLOTH_SLOTS = CLOTH_SLOTS;
  function initialOutfit(gender) {
    var def = itemDef; // 取 durMax
    function piece(id) { var d = def(id); return { id: id, dur: (d && d.durMax) || 1 }; }
    return gender === 'f'
      ? { top: piece('worn_blouse'), bottom: piece('worn_jeans'), shoes: piece('worn_flats') }
      : { top: piece('worn_tshirt'), bottom: piece('worn_jeans'), shoes: piece('worn_sneakers') };
  }
  G.engine.initialOutfit = initialOutfit;

  // 单件服装的「有效属性」：耐久跌破半值即撕破，warmth/armor/decency 减半向下取整。
  function clothingEff(entry) {
    var out = { warmth: 0, armor: 0, decency: 0 };
    if (!entry) return out;
    var def = itemDef(entry.id);
    if (!def) return out;
    var torn = entry.dur != null && entry.dur < (def.durMax || 1) * 0.5;
    var f = torn ? 0.5 : 1;
    out.warmth = Math.floor((def.warmth || 0) * f);
    out.armor = Math.floor((def.armor || 0) * f);
    out.decency = Math.floor((def.decency || 0) * f);
    out.torn = torn;
    return out;
  }
  G.engine.clothingEff = clothingEff;

  // 全身三槽属性合计（M15 读 warmth；combat 读 armor；文本读 decency）
  function outfitSum(attr) {
    var o = S().player.outfit; if (!o) return 0;
    var total = 0;
    for (var i = 0; i < CLOTH_SLOTS.length; i++) total += clothingEff(o[CLOTH_SLOTS[i]])[attr];
    return total;
  }
  function outfitWarmth() { return outfitSum('warmth'); }
  function outfitArmor() { return outfitSum('armor'); }
  function outfitDecency() { return outfitSum('decency'); }
  // 是否「基本着装」：上装与下装两槽都有衣物（成人场景宽衣描写等按此分支）
  function isDressed() {
    var o = S().player.outfit;
    return !!(o && o.top && o.bottom);
  }
  G.engine.outfitWarmth = outfitWarmth;
  G.engine.outfitArmor = outfitArmor;
  G.engine.outfitDecency = outfitDecency;
  G.engine.isDressed = isDressed;

  // 战斗被击时的损衣：随机一件在穿服装耐久 -amount，跨过撕破/报废阈值时返回提示文本。
  // 报废（dur<=0）则从 outfit 移除该槽。无在穿服装返回 null。
  function damageClothing(amount) {
    var o = S().player.outfit; if (!o) return null;
    amount = amount || 1;
    var worn = CLOTH_SLOTS.filter(function (s) { return o[s]; });
    if (!worn.length) return null;
    var slot = worn[Math.floor(Math.random() * worn.length)];
    var c = o[slot], def = itemDef(c.id) || {};
    var wasTorn = c.dur < (def.durMax || 1) * 0.5;
    c.dur -= amount;
    if (c.dur <= 0) {
      o[slot] = null;
      return '[blood]' + (def.name || '衣物') + '[/blood]被彻底扯烂，再也没法穿了。';
    }
    if (!wasTorn && c.dur < (def.durMax || 1) * 0.5) {
      return (def.name || '衣物') + '被撕开一道大口子，护不住身了。';
    }
    return null;
  }
  G.engine.damageClothing = damageClothing;

  // ---- 条件 DSL ------------------------------------------------------------
  // 对象内多条件为 AND；anyOf 数组内为 OR。
  function cmp(actual, spec) {
    // spec 可为裸值（相等判定）或 {lt,lte,gt,gte,eq,ne} 比较对象
    if (spec == null) return true;
    if (typeof spec !== 'object') return actual === spec;
    var ok = true;
    if ('eq'  in spec) ok = ok && actual === spec.eq;
    if ('ne'  in spec) ok = ok && actual !== spec.ne;
    if ('lt'  in spec) ok = ok && actual <  spec.lt;
    if ('lte' in spec) ok = ok && actual <= spec.lte;
    if ('gt'  in spec) ok = ok && actual >  spec.gt;
    if ('gte' in spec) ok = ok && actual >= spec.gte;
    return ok;
  }

  // 分钟落在 [start,end) 内，支持跨午夜（start>end）
  function inTimeRange(minute, range) {
    var a = range[0], b = range[1];
    if (a <= b) return minute >= a && minute < b;
    return minute >= a || minute < b;               // 跨午夜
  }
  G.engine.inTimeRange = inTimeRange;

  function checkCond(cond) {
    if (!cond) return true;
    var s = S(), p = s.player;

    if ('anyOf' in cond) {
      var any = false;
      for (var i = 0; i < cond.anyOf.length; i++) {
        if (checkCond(cond.anyOf[i])) { any = true; break; }
      }
      if (!any) return false;
    }

    if ('loc' in cond && p.location !== cond.loc) return false;
    if ('gender' in cond && p.gender !== cond.gender) return false;
    if ('timeRange' in cond && !inTimeRange(p.minute, cond.timeRange)) return false;
    if ('weekday' in cond && (p.day % 7) !== cond.weekday) return false;
    if ('dayMin' in cond && p.day < cond.dayMin) return false;
    if ('dayMax' in cond && p.day > cond.dayMax) return false;   // 扩展字段
    if ('season' in cond) {                                      // M15：季节门（winter=初冬+深冬）
      var tier = G.engine.seasonTierNow ? G.engine.seasonTierNow() : 0;
      var want = cond.season;
      var ok = want === 'winter' ? tier >= 1
             : want === 'deepwinter' ? tier === 2
             : want === 'earlywinter' ? tier === 1
             : tier === 0;                                       // 'autumn'
      if (!ok) return false;
    }

    if ('stat' in cond) {
      for (var st in cond.stat) if (!cmp(p.stats[st], cond.stat[st])) return false;
    }
    if ('aff' in cond) {
      for (var a in cond.aff) if (!cmp(affGet(a), cond.aff[a])) return false;
    }
    if ('stage' in cond) {
      for (var sg in cond.stage) if (!cmp(stageGet(sg), cond.stage[sg])) return false;
    }
    if ('flag' in cond) {
      for (var fk in cond.flag) {
        var want = cond.flag[fk], cur = getFlag(fk);
        // 布尔 false 需匹配「未设置(undefined)」与「显式 false」
        if (want === false) { if (cur) return false; }
        else if (typeof want === 'object') { if (!cmp(cur, want)) return false; }
        else if (cur !== want) return false;
      }
    }
    if ('has' in cond) {
      var h = cond.has;
      if ('bullets' in h && p.bullets < h.bullets) return false;
      if ('item' in h) {
        var items = Array.isArray(h.item) ? h.item : [h.item];
        for (var ii = 0; ii < items.length; ii++) if (!hasItem(items[ii])) return false;
      }
    }
    if ('skill' in cond && !p.skills[cond.skill]) return false;   // 扩展字段
    if ('met' in cond) {                                          // 扩展字段：是否已相遇
      var mn = s.npcs[cond.met]; if (!mn || !mn.met) return false;
    }
    if ('decency' in cond && !cmp(outfitDecency(), cond.decency)) return false;  // M14：着装体面合计

    // chance 放最后：只有其余条件全过才掷骰，避免浪费判定
    if ('chance' in cond && Math.random() >= cond.chance) return false;

    return true;
  }
  G.engine.checkCond = checkCond;

  // ---- 效果 DSL ------------------------------------------------------------
  // 返回导航指令 {goto?, combat?, shop?}；副作用（数值/物品/时间等）就地执行。
  // 执行顺序：数值/物品/标记 → 日历 → 时间推进 → 收集导航。
  function applyFx(fx) {
    var nav = {};
    if (!fx) return nav;
    var p = S().player;

    if (fx.stat) for (var st in fx.stat) statAdd(st, fx.stat[st]);
    if ('bullets' in fx) p.bullets = Math.max(0, p.bullets + fx.bullets);
    if (fx.item) for (var it in fx.item) {
      var d = fx.item[it]; if (d >= 0) addItem(it, d); else removeItem(it, -d);
    }
    if (fx.aff) for (var a in fx.aff) affAdd(a, fx.aff[a]);
    if (fx.stage) for (var sg in fx.stage) advanceStage(sg, fx.stage[sg]);
    if (fx.flag) for (var fk in fx.flag) setFlag(fk, fx.flag[fk]);
    if (fx.skill) {
      var sk = Array.isArray(fx.skill) ? fx.skill : [fx.skill];
      for (var k = 0; k < sk.length; k++) p.skills[sk[k]] = true;
    }

    if (fx.appointment) {
      var ap = fx.appointment;
      S().calendar.appointments.push({
        day: p.day + (ap.inDays || 0),
        minute: ap.minute != null ? ap.minute : p.minute,
        label: ap.label || '', eventId: ap.eventId || null, done: false
      });
    }
    if (fx.milestone) {
      S().calendar.milestones.push({ day: p.day, label: fx.milestone });
    }

    // 时间推进最后于副作用之后进行（可能触发跨整点/阈值事件）
    if (fx.time) G.engine.advance(fx.time);

    // M13 扩展：概率分支 roll:{chance, win:{...fx}, lose:{...fx}}
    // 掷骰后递归执行对应分支，分支里的导航指令向外传递（覆盖外层同名导航）。
    // 供「非战斗脱身」类选项使用：成功率写死在 chance、标注在选项文案里。
    if (fx.roll) {
      var branch = Math.random() < (fx.roll.chance || 0) ? fx.roll.win : fx.roll.lose;
      var sub = applyFx(branch);
      if (sub.goto)   nav.goto = sub.goto;
      if (sub.combat) nav.combat = sub.combat;
      if (sub.shop)   nav.shop = sub.shop;
    }

    if (fx.goto && !nav.goto)     nav.goto = fx.goto;
    if (fx.combat && !nav.combat) nav.combat = fx.combat;
    if (fx.shop && !nav.shop)     nav.shop = fx.shop;
    return nav;
  }
  G.engine.applyFx = applyFx;

})();

</script>

<script>
/* =============================================================================
 * time.js — 时间推进、日历换算、阈值检测、睡眠结算
 * -----------------------------------------------------------------------------
 * 挂载到 G.engine：
 *
 *   G.engine.advance(minutes, opts?)  —— 逐 10 分钟步进推进时间，处理跨日/跨整点/自然消耗/阈值
 *                                        opts.sleeping=true 时精力不衰减（供 sleep 使用）
 *                                        返回 {crossedDays, crossedHours, died}
 *   G.engine.sleep(hours)             —— 睡眠：恢复精力/少量 hp，随后正常结算，返回 advance 结果
 *   G.engine.timeOfDay(state?)        —— 时段：'清晨'|'白天'|'黄昏'|'夜晚'
 *   G.engine.dateOf(day)              —— 日期换算 → {year,month,date,weekday,weekdayName,md}
 *   G.engine.dateStr(state?)          —— 便捷显示串，如 "10月12日 周日"
 *   G.engine.timeStr(state?)          —— "HH:MM"
 *   G.engine.timeCostMod()           —— 行动耗时倍率（精力<15 时 1.5，供 M2/M3 计算行动时长）
 *   G.engine.isDrunk() / isHallucinating() / isCritical() —— 阈值状态查询（供文本分支）
 *
 * 数值常量集中在文件开头 TUNE，M9 调平衡只改这里。
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  G.engine = G.engine || {};

  var STEP = 10;   // 最小时间刻度（分钟）

  // ---- 可调平衡常量（M9） --------------------------------------------------
  var TUNE = {
    hungerPer10:   0.35,   // 每 10 分钟饥饿值下降（越低越饿）
    thirstPer10:   0.40,   // 每 10 分钟口渴值下降（水源仅 2 处，较饥饿略放宽）
    energyPer10:   0.30,   // 清醒时每 10 分钟精力下降
    starveHpPer10: 0.60,   // 饥或渴低于阈值时每 10 分钟额外掉 hp
    sleepEnergyPerHour: 12, // 睡眠每小时恢复精力
    sleepHpPerHour:     1.5,// 睡眠每小时恢复 hp
    infectionDaily:     3,  // 已感染时每日进展（0 则不动）
    addictionDaily:     4,  // 成瘾时每日上升
    scavengeRegenPerDay: 3, // 每日各地点搜刮计数回落（模拟物资缓慢补给，避免永久枯竭）
    scavengeFloor:      0.5, // 搜刮命中率保底下限（被搜空的地点仍有一半基础产出）
    // 阈值线（见 docs/Schema.md「阈值效果」）
    T_STARVE: 20,   // 饥/渴 < 此值开始掉血
    T_ENERGY: 15,   // 精力 < 此值行动耗时 +50%
    T_SANITY: 20,   // 理智 < 此值触发幻觉事件池
    T_DRUNK:  60,   // 酒精 > 此值进入醉酒变体
    T_ADDICT: 50,   // 成瘾 > 此值每日发作
    T_INFECT: 80,   // 感染 > 此值进入濒死线
    lowEnergyTimeMult: 1.5,

    // ---- M15 入冬季节压力 ----------------------------------------------------
    // 季节按游戏日分三档（不做连续温度模拟）：秋(默认) → 初冬 → 深冬。
    // 开局第 90 天=10月12日；day140≈12月1日入初冬，day170≈12月31日入深冬。
    seasonDayEarly: 140,   // 初冬起始日
    seasonDayDeep:  170,   // 深冬起始日
    // 室外每 10 分钟寒冷累积基准，按季节档 [秋,初冬,深冬]；秋季 0=无寒冷压力。
    coldOutPer10:   [0, 1.1, 1.9],
    warmthRelief:   0.10,  // 每点全身有效保暖抵消的寒冷累积（outfitWarmth 读值）
    coldIndoorPer10: 2.0,  // 室内/避风每 10 分钟寒冷消退
    coldSnapSurge:  0.8,   // 寒潮期间（world.coldSnap）室外寒冷额外加成
    boilWarmRelief: 12,    // 煮水行动兼取暖：一次的寒冷消退
    fireWarmRelief: 40,    // 生火取暖（消耗柴火）一次的寒冷消退
    winterWarmMarkup: 1.5, // 冬季保暖衣物商店涨价倍率（warmth>=3 的服装）
    // 寒冷阈值（照感染/毒瘾的既有阈值模式）
    T_COLD_CAP: 50,        // cold > 此值精力上限随寒冷值等量下降
    T_COLD_HP:  80,        // cold > 此值每 10 分钟掉血（失温）
    coldHpPer10: 0.5
  };
  G.TUNE = TUNE;

  // 室内避风据点（不累积寒冷、并快速消退）；其余地点视为室外。
  var INDOOR = { home: true, bar: true, church: true };

  function S() { return G.state; }

  // ---- 日历换算 -----------------------------------------------------------
  // 锚点：第 0 天 = 7月14日 周一。借用真实历法（含月长/闰年），基准年 2025（该年 7/14 恰为周一）。
  // 星期严格按 N%7（0=周一）计算，与基准年无关，保证 Schema 锚点精确。
  var ANCHOR = Date.UTC(2025, 6, 14);          // 2025-07-14（月份 0-based）
  var WEEKDAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  var DAY_MS = 86400000;

  function dateOf(day) {
    var d = new Date(ANCHOR + day * DAY_MS);
    var wd = ((day % 7) + 7) % 7;
    return {
      year: d.getUTCFullYear(),
      month: d.getUTCMonth() + 1,
      date: d.getUTCDate(),
      weekday: wd,                 // 0=周一 … 6=周日
      weekdayName: WEEKDAYS[wd],
      md: (d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日'
    };
  }
  G.engine.dateOf = dateOf;

  function dateStr(state) {
    var d = dateOf((state || S()).player.day);
    return d.md + ' ' + d.weekdayName;
  }
  function timeStr(state) {
    var m = (state || S()).player.minute;
    var h = Math.floor(m / 60), mm = m % 60;
    return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm;
  }
  G.engine.dateStr = dateStr;
  G.engine.timeStr = timeStr;

  // ---- 时段 ---------------------------------------------------------------
  // 清晨 05–08 / 白天 08–17 / 黄昏 17–20 / 夜晚 20–05
  function timeOfDay(state) {
    var m = (state || S()).player.minute;
    if (m >= 300 && m < 480)  return '清晨';
    if (m >= 480 && m < 1020) return '白天';
    if (m >= 1020 && m < 1200) return '黄昏';
    return '夜晚';
  }
  G.engine.timeOfDay = timeOfDay;
  G.engine.isNight = function (state) { return timeOfDay(state) === '夜晚'; };

  // ---- 季节（M15） --------------------------------------------------------
  // 档位：0 秋 / 1 初冬 / 2 深冬，按游戏日阈值切换（world.season 缓存于日结算，
  // 但所有消费方一律走这里按当前日计算，兼容缺 world.season 的老档）。
  var SEASON_NAMES = ['autumn', 'earlywinter', 'deepwinter'];
  function seasonTier(day) {
    if (day >= TUNE.seasonDayDeep) return 2;
    if (day >= TUNE.seasonDayEarly) return 1;
    return 0;
  }
  function seasonTierNow(state) { return seasonTier((state || S()).player.day); }
  function seasonNow(state) { return SEASON_NAMES[seasonTierNow(state)]; }
  function isWinter(state) { return seasonTierNow(state) >= 1; }
  G.engine.seasonTier = seasonTier;
  G.engine.seasonTierNow = seasonTierNow;
  G.engine.seasonNow = seasonNow;
  G.engine.isWinter = isWinter;

  // ---- 阈值状态查询 -------------------------------------------------------
  function timeCostMod() {
    return S().player.stats.energy < TUNE.T_ENERGY ? TUNE.lowEnergyTimeMult : 1;
  }
  function isDrunk()         { return S().player.stats.alcohol > TUNE.T_DRUNK; }
  function isHallucinating() { return S().player.stats.sanity < TUNE.T_SANITY; }
  function isCritical()      { return S().player.stats.infection > TUNE.T_INFECT; }
  G.engine.timeCostMod = timeCostMod;
  G.engine.isDrunk = isDrunk;
  G.engine.isHallucinating = isHallucinating;
  G.engine.isCritical = isCritical;

  // ---- 寒冷累积/消退（M15；每 10 分钟步进调用一次） ----------------------
  // 室内：寒冷快速消退；室外：按季节档基准 - 全身保暖累积寒冷，寒潮加成，
  // 保暖充足（gain<=0）时缓慢回落。秋季无寒冷压力，仅让残留寒冷慢慢散去。
  function coldStep(p) {
    var cold = p.stats.cold || 0;
    if (INDOOR[p.location]) {
      if (cold > 0) G.engine.statAdd('cold', -TUNE.coldIndoorPer10);
      return;
    }
    var base = TUNE.coldOutPer10[seasonTier(p.day)] || 0;
    if (base <= 0) {                                   // 非冬季室外：无压力，残留缓退
      if (cold > 0) G.engine.statAdd('cold', -TUNE.coldIndoorPer10 * 0.5);
      return;
    }
    var w = S().world;
    if (w && w.flags && w.flags.coldSnap) base += TUNE.coldSnapSurge;
    var warmth = G.engine.outfitWarmth ? G.engine.outfitWarmth() : 0;
    var gain = base - warmth * TUNE.warmthRelief;
    if (gain > 0) G.engine.statAdd('cold', gain);
    else if (cold > 0) G.engine.statAdd('cold', -TUNE.coldIndoorPer10 * 0.5);
  }

  // ---- 跨日结算：毒瘾/感染日结算 + 每日事件调度 --------------------------
  function dayRollover() {
    var st = S().player.stats;
    if (S().world) S().world.season = SEASON_NAMES[seasonTier(S().player.day)];
    if (st.infection > 0) G.engine.statAdd('infection', TUNE.infectionDaily);
    if (st.addiction > TUNE.T_ADDICT) G.engine.statAdd('addiction', TUNE.addictionDaily);
    // 地点物资缓慢补给：搜刮计数每日回落（decay = max(.25, 1-count*.12)），
    // 避免同一地点被搜空后永久停在 25% 掉率，保证中后期食水「略紧但可维持」。
    var sc = S().scavenge || {};
    for (var loc in sc) {
      sc[loc] = Math.max(0, sc[loc] - TUNE.scavengeRegenPerDay);
      if (sc[loc] === 0) delete sc[loc];
    }
    // scheduled 事件按 weekday 调度 + 毒瘾发作等由事件层在 'tick' 时机统一命中；
    // 这里仅清理「每日已触发」标记，供 events.js 的 scheduled 去重。
    S().world._firedDay = {};
  }

  // ---- 时间推进 -----------------------------------------------------------
  function advance(minutes, opts) {
    opts = opts || {};
    var p = S().player;
    var steps = Math.max(0, Math.round(minutes / STEP));
    var crossedDays = 0, crossedHours = 0, died = false;

    for (var i = 0; i < steps; i++) {
      var prevMin = p.minute;
      p.minute += STEP;
      if (p.minute >= 1440) {
        p.minute -= 1440;
        p.day += 1;
        crossedDays++;
        dayRollover();
      }
      // 跨整点判定（新分钟为 60 的整数倍，或跨日回到 0）
      if (p.minute % 60 === 0) crossedHours++;

      // 自然消耗
      G.engine.statAdd('hunger', -TUNE.hungerPer10);
      G.engine.statAdd('thirst', -TUNE.thirstPer10);
      if (!opts.sleeping) G.engine.statAdd('energy', -TUNE.energyPer10);

      // M15 寒冷累积/消退（睡眠也照常，室内会消退，露宿则继续挨冻）
      coldStep(p);

      // 饥/渴过低掉血
      if (p.stats.hunger < TUNE.T_STARVE || p.stats.thirst < TUNE.T_STARVE) {
        G.engine.statAdd('hp', -TUNE.starveHpPer10);
      }

      // M15 寒冷阈值：>50 精力上限随寒冷等量压低；>80 失温掉血
      if (p.stats.cold > TUNE.T_COLD_CAP) {
        var cap = 100 - (p.stats.cold - TUNE.T_COLD_CAP);   // 50→100 … 100→50
        if (p.stats.energy > cap) G.engine.statSet('energy', cap);
      }
      if (p.stats.cold > TUNE.T_COLD_HP) G.engine.statAdd('hp', -TUNE.coldHpPer10);

      // 死亡检测（hp=0）
      if (p.stats.hp <= 0) {
        died = true;
        if (G.engine.onDeath) G.engine.onDeath('exhaustion');
        break;
      }

      // 跨整点触发事件（第四种触发时机之一）
      if (p.minute % 60 === 0 && G.engine.checkEvents) {
        G.engine.checkEvents('tick');
        if (p.stats.hp <= 0) { died = true; if (G.engine.onDeath) G.engine.onDeath('event'); break; }
      }
    }
    return { crossedDays: crossedDays, crossedHours: crossedHours, died: died };
  }
  G.engine.advance = advance;

  // ---- 睡眠 ---------------------------------------------------------------
  // 安全屋睡觉按小时恢复精力/少量 hp；跨日的毒瘾/感染结算由 advance→dayRollover 处理。
  function sleep(hours) {
    var res = advance(hours * 60, { sleeping: true });
    G.engine.statAdd('energy', TUNE.sleepEnergyPerHour * hours);
    G.engine.statAdd('hp', TUNE.sleepHpPerHour * hours);
    if (G.engine.checkEvents) G.engine.checkEvents('sleep');
    return res;
  }
  G.engine.sleep = sleep;

})();

</script>
<!-- js/engine/events.js -->
<script>
/* =============================================================================
 * events.js — 事件注册表 / passage 注册表 / 触发调度 / 剧情推进
 * -----------------------------------------------------------------------------
 * 挂载到 G.data（注册表）与 G.engine（调度/剧情）：
 *
 *   G.data.events.register(ev)        —— 注册事件（结构见 docs/Schema.md）
 *   G.data.events.get(id) / all()
 *   G.data.story.register(passage)    —— 注册剧情段落
 *   G.data.story.get(id)
 *
 *   G.engine.checkEvents(trigger)     —— 触发检查，trigger ∈ 'enter'|'action'|'tick'|'sleep'
 *                                        命中最高优先级事件并触发，返回该事件或 null
 *   G.engine.openPassage(id)          —— 展示 passage（记录当前段落，调 G.ui.showPassage）
 *   G.engine.passageText(id)          —— 解析 passage 正文为字符串（供 UI/测试）
 *   G.engine.passageChoices(id)       —— 返回按 cond 过滤后的可选项（附原索引 _i）
 *   G.engine.selectChoice(choice)     —— 结算一个选项：cond 校验→applyFx→导航路由
 *   G.engine.selectChoiceAt(id, i)    —— 便捷版：按段落 id + 原索引结算（供控制台验收）
 *   G.engine.goLocation(locId)        —— 切换地点并跑 'enter' 事件（无事件则回地点界面）
 *
 * 事件触发时机（Schema）：进入地点(enter) / 地点内行动结算(action) / 时间跨过整点(tick) / 睡眠结算(sleep)
 * 事件可选 when:[...] 覆盖默认时机；默认：random→[enter,action]，scheduled→[tick,enter]，story→[enter,action,tick]
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  G.engine = G.engine || {};
  G.data = G.data || {};

  // ---- 注册表 -------------------------------------------------------------
  var eventList = [];
  var eventMap = {};
  G.data.events = {
    register: function (ev) {
      if (!ev || !ev.id) { console.warn('[events] 事件缺少 id'); return; }
      if (eventMap[ev.id]) console.warn('[events] 事件 id 重复覆盖:', ev.id);
      ev._order = eventList.length;
      eventMap[ev.id] = ev;
      // 覆盖时替换原对象
      var existing = eventList.findIndex(function (e) { return e.id === ev.id; });
      if (existing >= 0) eventList[existing] = ev; else eventList.push(ev);
    },
    get: function (id) { return eventMap[id] || null; },
    all: function () { return eventList; }
  };

  var storyMap = {};
  G.data.story = {
    register: function (p) {
      if (!p || !p.id) { console.warn('[story] 段落缺少 id'); return; }
      if (storyMap[p.id]) console.warn('[story] 段落 id 重复覆盖:', p.id);
      storyMap[p.id] = p;
    },
    get: function (id) { return storyMap[id] || null; }
  };

  function S() { return G.state; }
  var DEFAULT_WHEN = {
    random:    ['enter', 'action'],
    scheduled: ['tick', 'enter'],
    story:     ['enter', 'action', 'tick']
  };
  function whenOf(ev) { return ev.when || DEFAULT_WHEN[ev.type] || ['enter', 'action', 'tick']; }
  var TYPE_RANK = { story: 3, scheduled: 2, random: 1 };

  // ---- 触发资格判定 -------------------------------------------------------
  function eligible(ev, trigger) {
    var s = S();
    s.world._once = s.world._once || {};
    s.world.cooldowns = s.world.cooldowns || {};
    s.world._firedDay = s.world._firedDay || {};

    if (whenOf(ev).indexOf(trigger) < 0) return false;
    if (ev.once && s.world._once[ev.id]) return false;
    var cd = s.world.cooldowns[ev.id];
    if (cd && G.engine.absMinute() < cd) return false;
    // scheduled 每日只触发一次
    if (ev.type === 'scheduled' && s.world._firedDay[ev.id] === s.player.day) return false;
    if (!G.engine.checkCond(ev.cond)) return false;
    return true;
  }

  function fireEvent(ev) {
    var s = S(), now = G.engine.absMinute();
    s.world._once = s.world._once || {};
    if (ev.once) s.world._once[ev.id] = true;
    if (ev.cooldown) s.world.cooldowns[ev.id] = now + ev.cooldown;
    if (ev.type === 'scheduled') s.world._firedDay[ev.id] = s.player.day;
    if (ev.passage) openPassage(ev.passage);
    return ev;
  }

  // ---- 日历约定到期 -------------------------------------------------------
  // 到期的 appointment：标记 done，若登记了 eventId 则强制触发其 passage。
  function dueAppointments() {
    var s = S(), now = G.engine.absMinute(), fired = null;
    var aps = s.calendar.appointments;
    for (var i = 0; i < aps.length; i++) {
      var ap = aps[i];
      if (ap.done) continue;
      if (ap.day * 1440 + ap.minute <= now) {
        ap.done = true;
        if (ap.eventId) {
          var ev = eventMap[ap.eventId];
          if (ev && ev.passage) { fireEvent(ev); fired = ev; break; }
          else console.warn('[events] 约定 eventId 未注册:', ap.eventId);
        }
      }
    }
    return fired;
  }

  // ---- 触发检查 -----------------------------------------------------------
  function checkEvents(trigger) {
    // 战斗中不触发环境事件
    if (G.engine.inCombat && G.engine.inCombat()) return null;

    // tick/enter 时先结算到期约定（约定优先于随机池）
    if (trigger === 'tick' || trigger === 'enter') {
      var ap = dueAppointments();
      if (ap) return ap;
    }

    var best = null;
    var list = eventList;
    for (var i = 0; i < list.length; i++) {
      var ev = list[i];
      if (!eligible(ev, trigger)) continue;
      if (!best || better(ev, best)) best = ev;
    }
    if (best) return fireEvent(best);
    return null;
  }
  function better(a, b) {
    var pa = a.priority || 0, pb = b.priority || 0;
    if (pa !== pb) return pa > pb;
    var ra = TYPE_RANK[a.type] || 0, rb = TYPE_RANK[b.type] || 0;
    if (ra !== rb) return ra > rb;
    return a._order < b._order;                    // 先注册者优先
  }
  G.engine.checkEvents = checkEvents;

  // ---- passage 展示与解析 -------------------------------------------------
  function openPassage(id) {
    var p = storyMap[id];
    if (!p) { console.warn('[story] 未知段落:', id); return; }
    S()._currentPassage = id;
    if (G.ui.showPassage) G.ui.showPassage(id);
  }
  G.engine.openPassage = openPassage;

  function passageText(id) {
    var p = storyMap[id];
    if (!p) return '';
    return typeof p.text === 'function' ? p.text(S()) : (p.text || '');
  }
  G.engine.passageText = passageText;

  // 返回可选项（按 cond 过滤），每项附 _i = 在原 choices 中的索引
  function passageChoices(id) {
    var p = storyMap[id];
    if (!p || !p.choices) return [];
    var out = [];
    for (var i = 0; i < p.choices.length; i++) {
      var c = p.choices[i];
      if (c.cond && !G.engine.checkCond(c.cond)) continue;
      var copy = Object.create(c); copy._i = i;
      out.push(copy);
    }
    return out;
  }
  G.engine.passageChoices = passageChoices;

  // ---- 选项结算（交互主脊） -----------------------------------------------
  function routeNav(nav) {
    if (nav.combat) {
      if (G.engine.startCombat) G.engine.startCombat(nav.combat, { returnPassage: nav.goto });
      return nav;
    }
    if (nav.shop) {
      if (G.ui.showShop) G.ui.showShop(nav.shop);
      return nav;
    }
    if (nav.goto) { openPassage(nav.goto); return nav; }
    // 无导航 → 回地点主界面（Schema：无 choices 或选择后无 goto 时返回地点主界面）
    if (G.ui.showLocation) G.ui.showLocation();
    return nav;
  }

  function selectChoice(choice) {
    if (!choice) return null;
    if (choice.cond && !G.engine.checkCond(choice.cond)) return null; // 条件不满足，不可选
    var nav = G.engine.applyFx(choice.fx);
    return routeNav(nav);
  }
  G.engine.selectChoice = selectChoice;

  function selectChoiceAt(passageId, index) {
    var p = storyMap[passageId];
    if (!p || !p.choices || !p.choices[index]) { console.warn('[story] 无此选项', passageId, index); return null; }
    return selectChoice(p.choices[index]);
  }
  G.engine.selectChoiceAt = selectChoiceAt;

  // ---- 进入地点 -----------------------------------------------------------
  function goLocation(locId) {
    S().player.location = locId;
    var ev = checkEvents('enter');
    if (!ev && G.ui.showLocation) G.ui.showLocation();
    return ev;
  }
  G.engine.goLocation = goLocation;

})();

</script>
<!-- js/engine/combat.js -->
<script>
/* =============================================================================
 * combat.js — 轻量回合制战斗
 * -----------------------------------------------------------------------------
 * 挂载到 G.engine：
 *
 *   G.engine.startCombat(encounterId, opts)  —— 开战。encounterId 可为 G.data.encounters 的编组
 *                                               id，或单个敌人 id，或敌人 id 数组。
 *     opts: { returnPassage, onWin, onLose, onFlee }  胜利/失败/逃跑后的续接
 *   G.engine.combatAction(action, param)     —— 玩家一个回合动作，随后敌人回合。
 *     action ∈ 'attack'|'heavy'|'defend'|'item'|'flee'；param 为 item 动作的道具 id
 *     返回 { status:'ongoing'|'win'|'lose'|'flee', log:[本回合文本], state }
 *   G.engine.inCombat()                      —— 是否战斗中
 *   G.engine.combatState()                   —— 当前战斗状态对象（G.state.combat）
 *
 * 敌人数据（G.data.enemies）与编组（G.data.encounters）由 M3 提供。战斗文本从 descPool 抽取拼接。
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  G.engine = G.engine || {};
  G.data = G.data || {};
  G.data.enemies = G.data.enemies || {};
  G.data.encounters = G.data.encounters || {};

  // ---- 可调常量（M9 建立 / M10 调整） -------------------------------------
  var C = {
    fistDmg: [2, 5],
    heavyMult: 1.6,
    heavyEnergy: 10,
    hitNormal: 0.9,
    hitHeavy: 0.70,          // M10：0.62→0.70，让重击期望伤害不再低于普攻
    defendReduce: 0.4,       // 防御时受到伤害 ×0.4（减伤 60%）
    defendEnergyRegen: 4,    // M10：防御回合小幅回精力，支撑「防御→重击」循环
    enemyHit: 0.75,
    infectMin: 10, infectMax: 25,
    fleeBase: 0.5,
    // M10 技能落地
    meleeHitBonus: 0.05,     // skill:melee 近战命中 +0.05
    meleeDmgBonus: 2,        // skill:melee 近战伤害 +2
    bandageMult: 1.5,        // skill:bandage 治疗类 fx ×1.5
    moddingWearEvery: 2,     // skill:modding 每 N 次攻击才损耗 1 点耐久
    // M10 连击奖励（可选爽感）
    comboBonus: 1,           // 每段连击追加伤害
    comboCap: 3,             // 连击追加伤害上限
    // M14 服装：护甲减伤 + 损衣
    armorDenom: 4,           // 每次受击减伤 = floor(全身 armor 合计 / armorDenom)；满配约 -3，远低于防御的 -60%
    clothWearChance: 0.15    // 每次被击中，此概率磨损一件在穿服装（跌破半耐久撕破/归零报废）
  };
  G.COMBAT_TUNE = C;

  function S() { return G.state; }
  function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr && arr.length ? arr[Math.floor(Math.random() * arr.length)] : ''; }

  function inCombat() { return !!(S() && S().combat && !S().combat.over); }
  function combatState() { return S() ? S().combat : null; }
  G.engine.inCombat = inCombat;
  G.engine.combatState = combatState;

  // ---- 开战 ---------------------------------------------------------------
  function resolveEnemyIds(encounterId) {
    if (Array.isArray(encounterId)) return encounterId;
    if (G.data.encounters[encounterId]) return G.data.encounters[encounterId].slice();
    return [encounterId];              // 当作单个敌人 id
  }

  function makeEnemy(id) {
    var def = G.data.enemies[id];
    if (!def) { console.warn('[combat] 未知敌人:', id); def = { name: id, hp: 10, dmg: [1, 3], speed: 1, infect: 0 }; }
    // M15：冬季丧尸迟缓（speed -1，下限 1；人类不受影响）——「敌弱我更弱」，非纯堆难度。
    var speed = def.speed || 1;
    if (!def.human && G.engine.isWinter && G.engine.isWinter()) speed = Math.max(1, speed - 1);
    return {
      id: id, name: def.name || id,
      hp: def.hp, maxHp: def.hp,
      dmg: def.dmg || [1, 3],
      speed: speed,
      infect: def.infect || 0,
      loot: def.loot || null,
      descPool: def.descPool || [],
      human: !!def.human,
      alive: true
    };
  }

  // 命中/被咬文案里的名字标签：丧尸包 [zed]，人类（屠夫帮）用原名不套 [zed]
  function foeName(e) { return e.human ? e.name : '[zed]' + e.name + '[/zed]'; }

  function startCombat(encounterId, opts) {
    opts = opts || {};
    var ids = resolveEnemyIds(encounterId);
    var combat = {
      encounterId: encounterId,
      enemies: ids.map(makeEnemy),
      defending: false,
      turn: 0,
      log: [],
      over: false,
      result: null,
      returnPassage: opts.returnPassage || null,
      onWin: opts.onWin || null,
      onLose: opts.onLose || null,
      onFlee: opts.onFlee || null
    };
    S().combat = combat;
    if (G.ui.showCombat) G.ui.showCombat(combat);
    return combat;
  }
  G.engine.startCombat = startCombat;

  // ---- 玩家武器 -----------------------------------------------------------
  function weaponInfo() {
    var w = S().player.weapon;
    if (!w) return { dmg: C.fistDmg, hitPool: null, fists: true };
    var def = G.engine.itemDef(w.id);
    if (!def) return { dmg: C.fistDmg, hitPool: null, fists: true };
    return { dmg: def.dmg || C.fistDmg, hitPool: def.hitPool || null, fists: false, def: def, ref: w };
  }

  // ---- 技能查询 -----------------------------------------------------------
  function hasSkill(name) { var p = S().player; return !!(p && p.skills && p.skills[name]); }
  // melee 只对近战武器/徒手生效（枪械 def.ranged 排除）
  function meleeActive(w) {
    if (!hasSkill('melee')) return false;
    if (w.fists) return true;
    return !(w.def && w.def.ranged);
  }

  function wearWeapon() {
    var w = S().player.weapon;
    if (!w) return;
    // skill:modding —— 每两次攻击才损耗 1 点耐久（损耗减半）
    if (hasSkill('modding')) {
      var cs = S().combat;
      cs._wearTick = (cs._wearTick || 0) + 1;
      if (cs._wearTick % C.moddingWearEvery !== 0) return;
    }
    w.durability -= 1;
    if (w.durability <= 0) {
      var def = G.engine.itemDef(w.id);
      S().combat.log.push('[blood]' + ((def && def.name) || '武器') + '[/blood]彻底损坏，脱手了。');
      S().player.weapon = null;
    }
  }

  // ---- 一回合 -------------------------------------------------------------
  function firstAlive() {
    var es = S().combat.enemies;
    for (var i = 0; i < es.length; i++) if (es[i].alive) return es[i];
    return null;
  }
  function allDead() { return S().combat.enemies.every(function (e) { return !e.alive; }); }

  function playerAttack(heavy) {
    var combat = S().combat, log = combat.log;
    var target = firstAlive();
    if (!target) return;
    var w = weaponInfo();
    var melee = meleeActive(w);
    var hitChance = (heavy ? C.hitHeavy : C.hitNormal) + (melee ? C.meleeHitBonus : 0);
    hitChance = G.engine.clamp(hitChance, 0, 1);
    if (heavy) G.engine.statAdd('energy', -C.heavyEnergy);

    if (Math.random() > hitChance) {
      combat.combo = 0;                                   // 落空则连击中断
      log.push('你' + (heavy ? '奋力挥出重击但落了空' : '的攻击被躲开了') + '。');
    } else {
      var base = rand(w.dmg[0], w.dmg[1]) + (melee ? C.meleeDmgBonus : 0);
      var combo = combat.combo = (combat.combo || 0) + 1;
      var comboAdd = Math.min((combo - 1) * C.comboBonus, C.comboCap);
      var dmg = Math.round(heavy ? base * C.heavyMult : base) + comboAdd;
      target.hp -= dmg;
      var phrase = w.hitPool ? pick(w.hitPool) : (w.fists ? '拳头砸中' : '击中');
      log.push('你' + phrase + foeName(target) + '，造成 ' + dmg + ' 点伤害' +
        (comboAdd > 0 ? '（连击 +' + comboAdd + '）' : '') + '。');
      if (target.hp <= 0) { target.alive = false; log.push(foeName(target) + '倒下不再动弹。'); }
    }
    if (!w.fists) wearWeapon();
  }

  // skill:bandage —— med 类道具的治疗类 fx（hp 增益 / 感染削减）×bandageMult。
  // 返回可直接交给 applyFx 的 fx（无技能或非治疗类时原样返回 def.fx）。
  function medBoostFx(def) {
    if (!def || !def.fx) return def && def.fx;
    if (def.type !== 'med' || !hasSkill('bandage') || !def.fx.stat) return def.fx;
    var fx = def.fx, clone = {};
    for (var k in fx) clone[k] = fx[k];
    clone.stat = {};
    for (var st in fx.stat) {
      var v = fx.stat[st];
      if ((st === 'hp' && v > 0) || (st === 'infection' && v < 0)) v = Math.round(v * C.bandageMult);
      clone.stat[st] = v;
    }
    return clone;
  }
  G.engine.medBoostFx = medBoostFx;

  function useItemInCombat(itemId) {
    var log = S().combat.log;
    if (!itemId || !G.engine.hasItem(itemId)) { log.push('你没有可用的东西。'); return; }
    var def = G.engine.itemDef(itemId);
    G.engine.applyFx(medBoostFx(def));
    G.engine.removeItem(itemId, 1);
    log.push('你使用了[item]' + ((def && def.name) || itemId) + '[/item]。');
  }

  // 逃跑成功率（tryFlee 与 combatOptionInfo 共用同一公式，防两处漂移）
  function fleeChance() {
    var combat = S().combat;
    var energy = S().player.stats.energy;
    var alive = combat.enemies.filter(function (e) { return e.alive; });
    var maxSpeed = alive.length ? Math.max.apply(null, alive.map(function (e) { return e.speed; })) : 1;
    var chance = C.fleeBase + (energy - 50) / 100 - maxSpeed * 0.1;
    if (G.engine.isOverweight()) chance -= 0.4;                 // 超重难以脱身
    return G.engine.clamp(chance, 0.05, 0.95);
  }

  function tryFlee() {
    var log = S().combat.log;
    var chance = fleeChance();
    G.engine.statAdd('energy', -5);
    if (Math.random() < chance) { log.push('你抓住空档拔腿就跑，甩开了它们。'); return true; }
    log.push('你想逃，却被拦了下来。');
    return false;
  }

  // ---- 选项实时数据（供 UI 在按钮上显示成功率/后果） -----------------------
  function playerHitInfo(heavy) {
    var w = weaponInfo();
    var h = (heavy ? C.hitHeavy : C.hitNormal) + (meleeActive(w) ? C.meleeHitBonus : 0);
    return G.engine.clamp(h, 0, 1);
  }
  function playerDmgRange(heavy) {
    var w = weaponInfo(), bonus = meleeActive(w) ? C.meleeDmgBonus : 0;
    var lo = w.dmg[0] + bonus, hi = w.dmg[1] + bonus;
    if (heavy) { lo = Math.round(lo * C.heavyMult); hi = Math.round(hi * C.heavyMult); }
    return [lo, hi];
  }
  function combatOptionInfo() {
    if (!inCombat()) return null;
    return {
      attack: { hit: playerHitInfo(false), dmg: playerDmgRange(false) },
      heavy:  { hit: playerHitInfo(true), dmg: playerDmgRange(true), energy: C.heavyEnergy },
      defend: { reduce: 1 - C.defendReduce, energy: C.defendEnergyRegen },
      flee:   { chance: fleeChance() }
    };
  }
  G.engine.combatOptionInfo = combatOptionInfo;

  function enemyTurn() {
    var combat = S().combat, log = combat.log;
    combat.enemies.forEach(function (e) {
      if (!e.alive) return;
      if (Math.random() > C.enemyHit) { log.push(foeName(e) + '扑空。'); return; }
      var dmg = rand(e.dmg[0], e.dmg[1]);
      if (combat.defending) dmg = Math.round(dmg * C.defendReduce);
      // M14 护甲：全身 armor 合计换算成固定减伤（下限 1，不抵消防御的价值）
      var armor = G.engine.outfitArmor ? G.engine.outfitArmor() : 0;
      var soak = Math.floor(armor / C.armorDenom);
      if (soak > 0 && dmg > 0) dmg = Math.max(1, dmg - soak);
      G.engine.statAdd('hp', -dmg);
      var desc = e.descPool.length ? pick(e.descPool) : foeName(e) + '咬了上来';
      log.push(desc + '，你受到 ' + dmg + ' 点伤害' + (soak > 0 ? '（护甲挡下 ' + soak + '）' : '') + '。');
      // M14 损衣：受击有概率磨损一件在穿服装
      if (dmg > 0 && G.engine.damageClothing && Math.random() < C.clothWearChance) {
        var wearMsg = G.engine.damageClothing(1);
        if (wearMsg) log.push(wearMsg);
      }
      // 感染判定
      if (e.infect && Math.random() < e.infect) {
        var inf = rand(C.infectMin, C.infectMax);
        G.engine.statAdd('infection', inf);
        log.push('[blood]伤口[/blood]被咬破，[med]感染[/med]加重了。');
      }
    });
  }

  // ---- 结算与续接 ---------------------------------------------------------
  function grantLoot() {
    var combat = S().combat, log = combat.log, p = S().player;
    combat.enemies.forEach(function (e) {
      var loot = e.loot; if (!loot) return;
      if (loot.bullets) {
        var lb = loot.bullets;
        var chance = lb.chance == null ? 1 : lb.chance;
        if (Math.random() < chance) {
          var n = (lb.min != null) ? rand(lb.min, lb.max) : (typeof lb === 'number' ? lb : lb.count || 0);
          if (n > 0) { p.bullets += n; log.push('搜到 [item]' + n + ' 发子弹[/item]。'); }
        }
      }
      var drops = loot.drops || loot.items;
      if (Array.isArray(drops)) drops.forEach(function (d) {
        if (Math.random() < (d.chance == null ? 1 : d.chance)) {
          var cnt = d.count || 1;
          G.engine.addItem(d.id, cnt);
          var def = G.engine.itemDef(d.id);
          log.push('搜到 [item]' + ((def && def.name) || d.id) + (cnt > 1 ? '×' + cnt : '') + '[/item]。');
        }
      });
    });
  }

  // ---- M13：对人类敌人的战败非死亡（defeat 机制） ---------------------------
  // 仅对「纯人类敌人编组 + 无 onLose/returnPassage 的散遇」生效：
  //   剧情战斗的 goto 续接段落里写有推进 flag，跳过会永久卡线，维持原「战败=死亡」；
  //   丧尸战败仍死亡（被吃了没得商量）。醒来文本由数据层注册（dol.js），缺失时回退死亡。
  function canHumanDefeat(combat) {
    if (combat.onLose || combat.returnPassage) return false;
    if (!combat.enemies.length) return false;
    if (!combat.enemies.every(function (e) { return e.human; })) return false;
    return !!(G.data.story && G.data.story.get && G.data.story.get('dol_defeat_p1'));
  }

  function humanDefeat() {
    var s = S(), p = s.player;
    // 被洗劫：子弹减半 + 每叠可堆叠物资没收一半（武器留在你手边，剧情道具他们看不上）
    var lostBullets = Math.floor(p.bullets / 2);
    p.bullets -= lostBullets;
    var lostItems = [];
    p.inventory.slice().forEach(function (entry) {
      var def = G.engine.itemDef(entry.id);
      if (def && (def.type === 'key' || def.type === 'weapon')) return;
      var take = Math.floor(entry.count / 2);
      if (take > 0) {
        G.engine.removeItem(entry.id, take);
        lostItems.push({ name: (def && def.name) || entry.id, count: take });
      }
    });
    s._defeatLoss = { bullets: lostBullets, items: lostItems };   // 易失，仅供醒来文本
    s.world.flags.thugDefeats = (s.world.flags.thugDefeats || 0) + 1;
    // 重伤昏迷：先把 hp 立回 15 再挨过昏迷时间（3 小时的饥渴消耗压不死 15 点血）
    G.engine.statSet('hp', 15);
    G.engine.statAdd('sanity', -10);
    s.combat = null;
    G.engine.advance(180, { sleeping: true });
    if (s._dead) return;                       // 保险：昏迷结算若致死交给 onDeath
    G.engine.openPassage('dol_defeat_p1');
  }

  function endCombat(result) {
    var combat = S().combat;
    combat.over = true;
    combat.result = result;
    if (result === 'win') grantLoot();

    // 续接路由（回调优先，其次 returnPassage，最后回地点）
    if (result === 'lose') {
      if (combat.onLose) combat.onLose();
      else if (canHumanDefeat(combat)) humanDefeat();
      else if (G.engine.onDeath) G.engine.onDeath('combat');
      return;
    }
    var cb = result === 'win' ? combat.onWin : combat.onFlee;
    var next = combat.returnPassage;
    // 清空战斗态后再续接
    S().combat = null;
    if (typeof cb === 'function') cb(result);
    else if (next && G.engine.openPassage) G.engine.openPassage(next);
    else if (G.ui.showLocation) G.ui.showLocation();
  }

  function combatAction(action, param) {
    if (!inCombat()) return { status: 'none', log: [], state: null };
    var combat = S().combat;
    combat.turn++;
    combat.log = [];                 // 每回合清空，只保留本回合文本
    var fled = false;

    // 防御仅在选择防御的回合生效
    combat.defending = (action === 'defend');

    switch (action) {
      case 'attack': playerAttack(false); break;
      case 'heavy':  playerAttack(true); break;
      case 'defend':
        combat.combo = 0;
        G.engine.statAdd('energy', C.defendEnergyRegen);       // M10：防御小幅回精力
        combat.log.push('你举起手臂/武器格挡，准备承受下一击，趁隙喘了口气。');
        break;
      case 'item':   combat.combo = 0; useItemInCombat(param); break;
      case 'flee':   combat.combo = 0; fled = tryFlee(); break;
      default: combat.log.push('（无效动作）');
    }

    if (fled) { var flog = combat.log.slice(); endCombat('flee'); return { status: 'flee', log: flog, state: null }; }

    if (allDead()) { combat.log.push('战斗结束。'); var wlog = combat.log.slice(); endCombat('win'); return { status: 'win', log: wlog, state: null }; }

    // 敌人回合
    enemyTurn();

    if (S().player.stats.hp <= 0) { var llog = combat.log.slice(); endCombat('lose'); return { status: 'lose', log: llog, state: null }; }

    if (G.ui.showCombat) G.ui.showCombat(combat);
    return { status: 'ongoing', log: combat.log.slice(), state: combat };
  }
  G.engine.combatAction = combatAction;

})();

</script>
<!-- js/engine/save.js -->
<script>
/* =============================================================================
 * save.js — 存档 / 读档 / 导出导入 / 版本迁移 / 死亡处理
 * -----------------------------------------------------------------------------
 * 挂载到 G.engine（并设 G.SAVE_VERSION）：
 *
 *   G.engine.save(slot)        —— 存档到槽位（slot: 1|2|3|'auto'）
 *   G.engine.load(slot)        —— 读档并载入 G.state，刷新界面
 *   G.engine.autoSave()        —— 存到自动档槽
 *   G.engine.hasSave(slot)     —— 槽位是否有档
 *   G.engine.listSaves()       —— { slot: {exists, meta, summary} }，供读档界面
 *   G.engine.deleteSave(slot)
 *   G.engine.exportCode()      —— 当前存档导出为 Base64 存档码（Unicode 安全）
 *   G.engine.importCode(str)   —— 从存档码导入并载入
 *   G.engine.onDeath(cause)    —— 死亡处理：标记并弹读档界面（G.ui.showDeath）
 *
 * 存档键：lgys_save_{槽位}。存档不含易失的 combat 态。
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  G.engine = G.engine || {};

  G.SAVE_VERSION = 3;   // M14：player.outfit（服装三槽）；M15：player.stats.cold（寒冷值）
  var PREFIX = 'lgys_save_';
  var SLOTS = [1, 2, 3, 'auto'];

  function key(slot) { return PREFIX + slot; }
  function LS() {
    try { return window.localStorage; } catch (e) { return null; }
  }

  // ---- Unicode 安全 Base64 -----------------------------------------------
  function b64encode(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
      function (_, h) { return String.fromCharCode(parseInt(h, 16)); }));
  }
  function b64decode(b64) {
    return decodeURIComponent(Array.prototype.map.call(atob(b64),
      function (c) { return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2); }).join(''));
  }

  // ---- 序列化 -------------------------------------------------------------
  function snapshot() {
    var data = JSON.parse(JSON.stringify(G.state));
    delete data.combat;              // 战斗态易失且含函数回调，不入档
    data.meta = data.meta || {};
    data.meta.version = G.SAVE_VERSION;
    data.meta.saveTime = Date.now();
    return data;
  }

  // ---- 版本迁移 -----------------------------------------------------------
  // 结构补全 + 逐版本升级；新增迁移在此按 version 递增追加。
  function migrate(data) {
    if (!data.meta) data.meta = { version: 0 };
    var v = data.meta.version || 0;
    while (v < G.SAVE_VERSION) {
      switch (v) {
        case 1: migrateV1toV2(data); break;   // 无 outfit → 发默认初始装
        case 2: migrateV2toV3(data); break;   // 无 cold → 补 0（老档进冬季正常生效）
      }
      v++;
    }
    data.meta.version = G.SAVE_VERSION;
    normalize(data);
    return data;
  }
  // v1→v2：老档没有服装系统，按性别补一套垫底初始装（等同新开局发放）。
  function migrateV1toV2(d) {
    var p = d.player; if (!p) return;
    if (!p.outfit) p.outfit = defaultOutfit(p.gender);
  }
  // v2→v3：老档无寒冷字段，补 0（进入冬季后由 time.js 正常累积）。
  function migrateV2toV3(d) {
    var p = d.player; if (!p || !p.stats) return;
    if (p.stats.cold == null) p.stats.cold = 0;
  }
  function defaultOutfit(gender) {
    if (G.engine.initialOutfit) return G.engine.initialOutfit(gender);
    // 引擎未加载时的兜底（durMax 由 items.js 决定，这里给保守值 20）
    return gender === 'f'
      ? { top: { id: 'worn_blouse', dur: 20 }, bottom: { id: 'worn_jeans', dur: 25 }, shoes: { id: 'worn_flats', dur: 18 } }
      : { top: { id: 'worn_tshirt', dur: 20 }, bottom: { id: 'worn_jeans', dur: 25 }, shoes: { id: 'worn_sneakers', dur: 20 } };
  }
  // 补全可能缺失的容器字段（兼容旧档/手工档）
  function normalize(d) {
    d.world = d.world || {};
    d.world.flags = d.world.flags || {};
    d.world.cooldowns = d.world.cooldowns || {};
    d.world._firedDay = d.world._firedDay || {};
    d.world._once = d.world._once || {};
    d.calendar = d.calendar || {};
    d.calendar.appointments = d.calendar.appointments || [];
    d.calendar.milestones = d.calendar.milestones || [];
    d.scavenge = d.scavenge || {};
    d.npcs = d.npcs || {};
    if (d.player && !d.player.outfit) d.player.outfit = defaultOutfit(d.player.gender);
    if (d.player && d.player.stats && d.player.stats.cold == null) d.player.stats.cold = 0;
    return d;
  }

  // ---- 存 / 读 ------------------------------------------------------------
  function save(slot) {
    var ls = LS(); if (!ls) { console.warn('[save] localStorage 不可用'); return false; }
    try {
      ls.setItem(key(slot), JSON.stringify(snapshot()));
      return true;
    } catch (e) { console.error('[save] 存档失败:', e); return false; }
  }
  function autoSave() { return save('auto'); }

  function load(slot) {
    var ls = LS(); if (!ls) return false;
    var raw = ls.getItem(key(slot));
    if (!raw) { console.warn('[save] 空槽位:', slot); return false; }
    try {
      var data = migrate(JSON.parse(raw));
      G.state = data;
      G.state.combat = null;
      if (G.ui.refresh) G.ui.refresh();
      if (G.ui.showLocation) G.ui.showLocation();
      return true;
    } catch (e) { console.error('[save] 读档失败:', e); return false; }
  }

  function hasSave(slot) { var ls = LS(); return !!(ls && ls.getItem(key(slot))); }
  function deleteSave(slot) { var ls = LS(); if (ls) ls.removeItem(key(slot)); }

  function summarize(data) {
    var p = data.player || {};
    var d = G.engine.dateOf ? G.engine.dateOf(p.day || 0) : { md: '', weekdayName: '' };
    var m = p.minute || 0, h = Math.floor(m / 60), mm = m % 60;
    return {
      name: p.name || '（无名）',
      gender: p.gender,
      day: p.day,
      date: d.md + ' ' + d.weekdayName,
      time: (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm,
      location: p.location,
      saveTime: (data.meta && data.meta.saveTime) || 0
    };
  }

  function listSaves() {
    var ls = LS(), out = {};
    SLOTS.forEach(function (slot) {
      var raw = ls && ls.getItem(key(slot));
      if (!raw) { out[slot] = { exists: false }; return; }
      try {
        var data = JSON.parse(raw);
        out[slot] = { exists: true, meta: data.meta, summary: summarize(data) };
      } catch (e) { out[slot] = { exists: false, corrupt: true }; }
    });
    return out;
  }

  // ---- 导出 / 导入 --------------------------------------------------------
  function exportCode() { return b64encode(JSON.stringify(snapshot())); }
  function importCode(str) {
    try {
      var data = migrate(JSON.parse(b64decode(String(str).trim())));
      G.state = data;
      G.state.combat = null;
      if (G.ui.refresh) G.ui.refresh();
      if (G.ui.showLocation) G.ui.showLocation();
      return true;
    } catch (e) { console.error('[save] 存档码无效:', e); return false; }
  }

  // ---- 死亡处理 -----------------------------------------------------------
  function onDeath(cause) {
    if (!G.state) return;
    G.state._dead = cause || true;
    // 不覆盖任何存档，保留玩家读档机会
    if (G.ui.showDeath) G.ui.showDeath(cause);
    else console.warn('[save] 玩家死亡（', cause, '），等待读档。');
  }

  G.engine.save = save;
  G.engine.autoSave = autoSave;
  G.engine.load = load;
  G.engine.hasSave = hasSave;
  G.engine.deleteSave = deleteSave;
  G.engine.listSaves = listSaves;
  G.engine.exportCode = exportCode;
  G.engine.importCode = importCode;
  G.engine.onDeath = onDeath;
  G.engine._migrate = migrate;   // 供测试

})();

</script>
<!-- js/ui/render.js -->
<script>
/* =============================================================================
 * render.js — 应用外壳 / 顶栏 / 状态条 / 主区域（地点·passage·战斗）/ 开局 / 死亡
 * -----------------------------------------------------------------------------
 * 实现 M1 main.js 要求的全部 G.ui 接口：
 *   G.ui.showLocation() / showPassage(id) / refresh() / showCombat(combat)
 *   G.ui.showShop(shopId) —— 薄转发，真正实现在 panels.js（G.ui.panels.openShop）
 *   G.ui.showDeath(cause) / showIntro()
 *
 * 本文件新增并登记的 G.ui 接口（panels.js / _demo.js 可用）：
 *   G.ui.openOverlay(opts)     —— 通用浮层外壳，opts:{title, center?, build(bodyEl,closeFn), onClose?}
 *                                  返回 {root,body,close,refresh()}；面板/商店/道具详情都基于它。
 *   G.ui.toast(msg)            —— 顶部短暂提示（战斗终局文本、错误提示等）。
 *   G.ui._h(tag, attrs, kids)  —— 极简 DOM 构造器（attrs 支持 class/text/html/style(对象)/on*）。
 *   G.ui._clear(el)            —— 清空节点子元素。
 *   G.ui.panels                —— 命名空间，由 panels.js 填充 open(name)/openShop(id)。
 *
 * G.data.locations 结构（M3 交付，M2 先行约定，Schema 未定义部分见此）：
 *   { id:{ name, desc(string|fn(state)), adj:[locId...], npcs:[npcId...]（可选，静态候场名单）,
 *          actions:[ {label, cond?, fx?} ]（复用 Schema 条件/效果 DSL） } }
 *   NPC 到场判定：若 G.engine.npcsAt(locId) 存在（M4 作息表函数）优先使用，否则退化为 def.npcs 静态名单。
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  G.ui = G.ui || {};
  G.data = G.data || {};

  // ---- 极简 DOM 构造器 ------------------------------------------------------
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      var v = attrs[k];
      if (v == null) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') { for (var sk in v) el.style[sk] = v[sk]; }
      else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    }
    if (kids != null) {
      (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
        if (c == null) return;
        el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
    }
    return el;
  }
  function clearNode(el) { while (el && el.firstChild) el.removeChild(el.firstChild); }
  G.ui._h = h;
  G.ui._clear = clearNode;

  function S() { return G.state; }

  // ---- 浮层外壳（面板/商店/道具详情共用） -----------------------------------
  function openOverlay(opts) {
    opts = opts || {};
    var back = h('div', { class: 'overlay' + (opts.center ? ' center' : '') });
    var panel = h('div', { class: 'overlay-panel' });
    var header = h('div', { class: 'panel-header' });
    header.appendChild(h('h2', { text: opts.title || '' }));
    var closeFn = function () { if (back.parentNode) back.parentNode.removeChild(back); if (opts.onClose) opts.onClose(); };
    header.appendChild(h('button', { class: 'panel-close', text: '✕', onclick: closeFn }));
    panel.appendChild(header);
    var body = h('div', { class: 'panel-body' });
    panel.appendChild(body);
    back.appendChild(panel);
    back.addEventListener('click', function (e) { if (e.target === back) closeFn(); });
    document.body.appendChild(back);
    var api = {
      root: back, body: body, close: closeFn,
      refresh: function () { clearNode(body); if (opts.build) opts.build(body, closeFn); }
    };
    if (opts.build) opts.build(body, closeFn);
    return api;
  }
  G.ui.openOverlay = openOverlay;

  // ---- 短暂提示 ---------------------------------------------------------------
  var toastTimer = null;
  function toast(msg) {
    var old = document.querySelector('.toast');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var t = h('div', { class: 'toast', text: msg });
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2600);
  }
  G.ui.toast = toast;

  // ---- 应用外壳（顶栏/状态条/主区域/底部导航），构建一次后复用节点 -----------
  var shellBuilt = false, topbarEl, statusEl, mainEl, bottomnavEl;

  // 每次「切换主屏幕内容」自增，供 doAction 判断行动途中是否已被 tick 事件抢先导航
  var navSeq = 0;

  function timeIcon() {
    var t = G.engine.timeOfDay();
    return { '清晨': '🌅', '白天': '☀️', '黄昏': '🌇', '夜晚': '🌙' }[t] || '🕐';
  }
  function locName(id) {
    var def = G.data.locations && G.data.locations[id];
    return (def && def.name) || id || '';
  }

  var NAV_ITEMS = [
