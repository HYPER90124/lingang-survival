    { name: 'map', icon: '🗺️', label: '地图' },
    { name: 'inventory', icon: '🎒', label: '背包' },
    { name: 'npc', icon: '👥', label: '关系' },   // M4：好感面板（G.ui.panels.open('npc')）
    { name: 'body', icon: '❤', label: '身体' },
    { name: 'calendar', icon: '📅', label: '日历' },
    { name: 'system', icon: '⚙', label: '系统' }
  ];

  function buildShell() {
    if (shellBuilt) return;
    topbarEl = h('div', { class: 'topbar' });
    statusEl = h('div', { class: 'statusbar', onclick: function () { openPanelSafe('body'); } });
    mainEl = h('div', { class: 'main', id: 'main' });
    bottomnavEl = h('div', { class: 'bottomnav' });
    NAV_ITEMS.forEach(function (it) {
      var btn = h('button', { class: 'navbtn', onclick: function () { openPanelSafe(it.name); } });
      btn.appendChild(h('span', { class: 'navicon', text: it.icon }));
      btn.appendChild(h('span', { class: 'navlabel', text: it.label }));
      bottomnavEl.appendChild(btn);
    });
    shellBuilt = true;
  }
  function openPanelSafe(name) {
    if (G.ui.panels && G.ui.panels.open) G.ui.panels.open(name);
  }

  function showGameShell() {
    buildShell();
    var app = document.getElementById('app');
    clearNode(app);
    app.appendChild(topbarEl);
    app.appendChild(statusEl);
    app.appendChild(mainEl);
    app.appendChild(bottomnavEl);
  }
  function showFullScreen(el) {
    var app = document.getElementById('app');
    clearNode(app);
    app.appendChild(el);
  }
  G.ui._mainEl = function () { return mainEl; }; // 供 panels.js 判断当前是否在游戏内视图

  // ---- 顶栏 / 状态条内容渲染（refresh 驱动） ---------------------------------
  function renderTopbarContent() {
    clearNode(topbarEl);
    if (!S()) return;
    var left = h('button', { class: 'topbar-btn topbar-left', onclick: function () { openPanelSafe('calendar'); } });
    left.appendChild(h('span', { class: 'topbar-icon', text: timeIcon() }));
    left.appendChild(h('span', { class: 'topbar-date', text: G.engine.dateStr() }));
    left.appendChild(h('span', { class: 'topbar-time', text: G.engine.timeStr() }));
    var right = h('div', { class: 'topbar-right' });
    right.appendChild(h('span', { class: 'topbar-bullets', text: '● ' + S().player.bullets }));
    right.appendChild(h('span', { class: 'topbar-loc', text: locName(S().player.location) }));
    topbarEl.appendChild(left);
    topbarEl.appendChild(right);
  }

  var STATUS_ITEMS = [
    { key: 'hp', label: '生命' },
    { key: 'hunger', label: '饥饿' },
    { key: 'thirst', label: '口渴' },
    { key: 'energy', label: '精力' }
  ];
  function renderStatusbarContent() {
    clearNode(statusEl);
    if (!S()) return;
    STATUS_ITEMS.forEach(function (it) {
      var val = G.engine.statGet(it.key);
      var low = it.key === 'energy' ? val < G.TUNE.T_ENERGY : (it.key === 'hp' ? val < 30 : val < G.TUNE.T_STARVE);
      var wrap = h('div', { class: 'statusbar-item' });
      var lab = h('div', { class: 'statusbar-label' });
      lab.appendChild(h('span', { text: it.label }));
      lab.appendChild(h('span', { text: Math.round(val) }));
      var track = h('div', { class: 'statusbar-track' });
      track.appendChild(h('div', { class: 'statusbar-fill ' + it.key + (low ? ' low' : ''), style: { width: G.engine.clamp(val, 0, 100) + '%' } }));
      wrap.appendChild(lab); wrap.appendChild(track);
      statusEl.appendChild(wrap);
    });
    // M15：入冬后（或有寒冷残留时）追加「寒冷」条，非冬季且为 0 时不显示以免平时噪声。
    var cold = G.engine.statGet('cold') || 0;
    if (((G.engine.isWinter && G.engine.isWinter()) || cold > 0)) {
      var high = cold > G.TUNE.T_COLD_CAP;
      var cwrap = h('div', { class: 'statusbar-item' });
      var clab = h('div', { class: 'statusbar-label' });
      clab.appendChild(h('span', { text: '寒冷' }));
      clab.appendChild(h('span', { text: Math.round(cold) }));
      var ctrack = h('div', { class: 'statusbar-track' });
      ctrack.appendChild(h('div', { class: 'statusbar-fill cold' + (high ? ' low' : ''), style: { width: G.engine.clamp(cold, 0, 100) + '%' } }));
      cwrap.appendChild(clab); cwrap.appendChild(ctrack);
      statusEl.appendChild(cwrap);
    }
  }

  function refresh() {
    buildShell();
    renderTopbarContent();
    renderStatusbarContent();
  }
  G.ui.refresh = refresh;

  // ---- 地点主界面 -------------------------------------------------------------
  function npcsAtLocation(locId) {
    if (G.engine.npcsAt) return G.engine.npcsAt(locId);
    var def = G.data.locations && G.data.locations[locId];
    if (!def || !def.npcs) return [];
    return def.npcs.filter(function (id) {
      var n = S().npcs[id];
      return n && n.alive;
    });
  }

  function talkTo(id, ndef) {
    if (ndef && ndef.talkPassage) { G.engine.openPassage(ndef.talkPassage); return; }
    if (G.engine.talkTo) { G.engine.talkTo(id); return; }
    toast((ndef && ndef.name || id) + '：暂无更多对话（M4/M5 补充）');
  }

  function cloneFxWithTimeScaled(fx) {
    if (!fx || !fx.time) return fx;
    var copy = {};
    for (var k in fx) copy[k] = fx[k];
    copy.time = Math.round(fx.time * G.engine.timeCostMod());
    return copy;
  }

  // M3 的地点数据（js/data/locations.js）里 home/bar/church 的 actions 是空数组——
  // 睡觉、以及去挂在某地点的交易 NPC 处交易，由 M3 头部注释明确交给 M2 UI 直接调引擎接口。
  // 这里的「补充行动」用的是 M2 自定义的简单 {label, cond?, fx?} / {label, sleep} 形状，
  // 与下面 M3 数据行动 {id,label,type,time,energy,requiresItem}（走 G.engine.scavenge）是两套东西。
  var LOCATION_EXTRA_ACTIONS = {
    home: [{ label: '睡到天亮（恢复精力与生命）', sleep: 8 }]
  };
  function tradeActionsFor(locId) {
    var trade = G.data.trade || {};
    var out = [];
    Object.keys(trade).forEach(function (shopId) {
      var t = trade[shopId];
      if (t.location !== locId) return;
      var npcDef = (G.data.npcs && G.data.npcs[t.npc]) || {};
      out.push({ label: '找' + (npcDef.name || t.npc || '摊主') + '交易', fx: { shop: shopId } });
    });
    return out;
  }

  // action.fx.time 推进过程中可能跨整点触发 tick 事件并直接切到别的 passage
  // （见 G.engine.advance）；navSeq 用于判断这种「行动途中已经换过画面」的情况，
  // 避免行动结束后的兜底 showLocation() 覆盖掉那个画面。
  function doAction(action) {
    if (action.cond && !G.engine.checkCond(action.cond)) return;
    var seq0 = navSeq;
    if (action.sleep) {
      G.engine.sleep(action.sleep);
      if (S() && S()._dead) return;
      if (navSeq === seq0) G.ui.showLocation();
      return;
    }
    var nav = G.engine.applyFx(cloneFxWithTimeScaled(action.fx));
    if (S() && S()._dead) return; // 行动期间可能触发死亡（如饥渴掉血），交给 onDeath 的 showDeath 接管
    if (nav.combat) { G.engine.startCombat(nav.combat, { returnPassage: nav.goto }); return; }
    if (nav.shop) { G.ui.showShop(nav.shop); return; }
    if (nav.goto) { G.engine.openPassage(nav.goto); return; }
    if (navSeq !== seq0) return;
    var ev = G.engine.checkEvents('action');
    if (!ev) G.ui.showLocation();
  }

  // M3/M11 数据行动：type:'scavenge'→G.engine.scavenge，'water'/'boil'（M11 水源系统）→
  // G.engine.gatherWater/boilWater，均处理掉落/耗时/事件结算，形状一致（返回 {ok,msg}）。
  var DATA_ACTION_FN = { scavenge: 'scavenge', water: 'gatherWater', boil: 'boilWater', warm: 'makeFire' };
  function runDataAction(locId, action) {
    var fnName = DATA_ACTION_FN[action.type];
    if (!fnName || !G.engine[fnName]) { console.warn('[ui] 未知地点行动类型:', action.type); return; }
    var seq0 = navSeq;
    var res = G.engine[fnName](locId, action.id);
    if (S() && S()._dead) return;
    if (res && res.msg) toast(G.ui.tags.strip(res.msg));
    if (navSeq === seq0) G.ui.showLocation();
  }

  function travel(destId) {
    var res = G.engine.travelTo(destId);
    if (!res.ok && !res.died) toast(res.msg); // died 时 advance() 内部已经切到死亡界面，这里不再提示
  }

  function renderLocationView() {
    var el = mainEl;
    clearNode(el);
    var locId = S().player.location;
    var def = G.data.locations && G.data.locations[locId];
    if (!def) {
      el.appendChild(h('div', { class: 'passage-text', text: '（地点数据缺失：' + locId + '，等待 M3 数据接入）' }));
      return;
    }
    var desc = h('div', { class: 'location-desc' });
    var descText = G.engine.locationDesc ? G.engine.locationDesc(locId) : (def.name || '');
    desc.innerHTML = G.ui.tags.parse(descText);
    el.appendChild(desc);

    var npcIds = npcsAtLocation(locId);
    if (npcIds.length) {
      el.appendChild(h('div', { class: 'section-title', text: '在场' }));
      var npcWrap = h('div', { class: 'location-npcs' });
      npcIds.forEach(function (id) {
        var ndef = (G.data.npcs && G.data.npcs[id]) || {};
        var chip = h('div', { class: 'npc-chip', onclick: function () { talkTo(id, ndef); } });
        chip.appendChild(h('span', { class: 'dot', style: { background: G.ui.tags.npcColor(id) } }));
        chip.appendChild(h('span', { text: ndef.name || id }));
        npcWrap.appendChild(chip);
      });
      el.appendChild(npcWrap);
    }

    // M11：数据行动支持可选 cond（如「接雨水」仅雨天出现），无 cond 则恒显示。
    var dataActions = (def.actions || []).filter(function (a) { return !a.cond || G.engine.checkCond(a.cond); });
    var extraActions = (LOCATION_EXTRA_ACTIONS[locId] || []).concat(tradeActionsFor(locId))
      .filter(function (a) { return !a.cond || G.engine.checkCond(a.cond); });
    if (dataActions.length || extraActions.length) {
      el.appendChild(h('div', { class: 'section-title', text: '行动' }));
      var alist = h('div', { class: 'action-list' });
      dataActions.forEach(function (a) {
        // requiresItem 缺失时置灰并在文案追加提示（M11：玻璃瓶/打火机等取水+煮水前置道具）。
        var locked = a.requiresItem && !G.engine.hasItem(a.requiresItem);
        var btn = h('button', { class: 'btn' + (locked ? ' disabled' : ''), onclick: function () { runDataAction(locId, a); } });
        var label = a.label || '';
        if (locked) {
          var need = G.engine.itemDef(a.requiresItem);
          label += '（需要' + (need ? need.name : a.requiresItem) + '）';
        }
        btn.innerHTML = G.ui.tags.parse(label);
        alist.appendChild(btn);
      });
      extraActions.forEach(function (a) {
        var btn = h('button', { class: 'btn', onclick: function () { doAction(a); } });
        btn.innerHTML = G.ui.tags.parse(a.label || '');
        alist.appendChild(btn);
      });
      el.appendChild(alist);
    }

    var neighbors = G.engine.locationNeighbors ? G.engine.locationNeighbors(locId) : {};
    var destIds = Object.keys(neighbors);
    if (destIds.length) {
      el.appendChild(h('div', { class: 'section-title', text: '移动' }));
      var mlist = h('div', { class: 'move-list' });
      destIds.forEach(function (id) {
        var mdef = (G.data.locations && G.data.locations[id]) || {};
        var closed = mdef.hours && G.engine.isLocationOpen && !G.engine.isLocationOpen(id);
        var label = (mdef.name || id) + '（约 ' + neighbors[id] + ' 分钟）' + (closed ? ' · 当前未开放' : '');
        mlist.appendChild(h('button', { class: 'btn', text: label, onclick: function () { travel(id); } }));
      });
      el.appendChild(mlist);
    }
  }

  function showLocation() {
    navSeq++;
    showGameShell();
    renderLocationView();
    refresh();
    if (G.engine.autoSave) G.engine.autoSave(); // 回到地点主界面时机较稳定，顺手保自动档
  }
  G.ui.showLocation = showLocation;

  // 把编组 id / 敌人 id / 敌人 id 数组解析成「跛行者×2、奔跑者」这样的构成串
  function encounterComposition(encId) {
    var enc = G.data.encounters || {}, ene = G.data.enemies || {};
    var ids = Array.isArray(encId) ? encId : (enc[encId] || [encId]);
    var order = [], counts = {};
    ids.forEach(function (id) {
      var def = ene[id];
      var nm = (def && def.name) || id;
      if (counts[nm] == null) { counts[nm] = 0; order.push(nm); }
      counts[nm]++;
    });
    return order.map(function (nm) { return counts[nm] > 1 ? nm + '×' + counts[nm] : nm; }).join('、');
  }

  // ---- passage 渲染 -------------------------------------------------------
  function showPassage(id) {
    navSeq++;
    showGameShell();
    var el = mainEl;
    clearNode(el);
    var text = G.engine.passageText(id);
    var textDiv = h('div', { class: 'passage-text' });
    textDiv.innerHTML = G.ui.tags.parse(text);
    el.appendChild(textDiv);

    var choices = G.engine.passageChoices(id);
    var list = h('div', { class: 'choice-list' });
    if (choices.length) {
      choices.forEach(function (c) {
        var btn = h('button', { class: 'btn', onclick: function () { G.engine.selectChoice(c); } });
        var html = G.ui.tags.parse(c.label || '');
        // M10 系统级保险：选项若触发战斗，自动后缀敌方构成，防剧情文本数量写错误导玩家
        if (c.fx && c.fx.combat) {
          var comp = encounterComposition(c.fx.combat);
          if (comp) html += ' <span class="enc-tag">（' + comp + '）</span>';
        }
        btn.innerHTML = html;
        list.appendChild(btn);
      });
    } else {
      list.appendChild(h('button', { class: 'btn primary', text: '继续', onclick: function () { G.ui.showLocation(); } }));
    }
    el.appendChild(list);
    refresh();
  }
  G.ui.showPassage = showPassage;

  // ---- 战斗界面 -------------------------------------------------------------
  // combatHistory：本地会话内的回合日志累积（G.state.combat.log 每回合会被引擎清空，只保留当回合文本）
  var combatHistory = [];
  function pushCombatRound(combat) {
    if (combat.turn === 0) { combatHistory = []; return; }
    var last = combatHistory[combatHistory.length - 1];
    if (combat.log && combat.log.length && (!last || last.turn !== combat.turn)) {
      combatHistory.push({ turn: combat.turn, lines: combat.log.slice() });
    }
  }

  function renderCombatView(combat) {
    var el = mainEl;
    clearNode(el);
    var screen = h('div', { class: 'combat-screen' });

    var erow = h('div', { class: 'enemy-row' });
    combat.enemies.forEach(function (e) {
      var card = h('div', { class: 'enemy-card' + (e.alive ? '' : ' dead') });
      card.appendChild(h('div', { class: 'ename', text: e.name }));
      var track = h('div', { class: 'hp-track' });
      var pct = Math.max(0, e.hp) / (e.maxHp || 1) * 100;
      track.appendChild(h('div', { class: 'hp-fill', style: { width: pct + '%' } }));
      card.appendChild(track);
      card.appendChild(h('div', { style: { fontSize: '11px', color: 'var(--fg-dim)', marginTop: '2px' }, text: Math.max(0, e.hp) + '/' + e.maxHp }));
      erow.appendChild(card);
    });
    screen.appendChild(erow);

    var w = S().player.weapon;
    var wdef = w && G.engine.itemDef(w.id);
    var wtext = w ? ((wdef && wdef.name) || w.id) + '（耐久 ' + w.durability + '）' : '赤手空拳';
    screen.appendChild(h('div', { class: 'combat-weapon', text: '武器：' + wtext }));

    var log = h('div', { class: 'combat-log' });
    combatHistory.forEach(function (round) {
      log.appendChild(h('div', { class: 'line turn-sep', text: '—— 第 ' + round.turn + ' 回合 ——' }));
      round.lines.forEach(function (line) {
        var d = h('div', { class: 'line' });
        d.innerHTML = G.ui.tags.parse(line);
        log.appendChild(d);
      });
    });
    screen.appendChild(log);

    var actions = h('div', { class: 'combat-actions' });
    function actBtn(label, action) {
      return h('button', { class: 'btn', text: label, onclick: function () { runCombatAction(action); } });
    }
    // M10：把实时成功率/伤害/后果渲染到按钮上
    var info = G.engine.combatOptionInfo ? G.engine.combatOptionInfo() : null;
    function pct(x) { return Math.round(x * 100) + '%'; }
    function dmgTxt(r) { return r[0] === r[1] ? r[0] + '伤' : r[0] + '-' + r[1] + '伤'; }
    var atkLabel = '攻击', heavyLabel = '重击', defLabel = '防御', fleeLabel = '逃跑';
    if (info) {
      atkLabel = '攻击（' + pct(info.attack.hit) + '·' + dmgTxt(info.attack.dmg) + '）';
      heavyLabel = '重击（' + pct(info.heavy.hit) + '·' + dmgTxt(info.heavy.dmg) + '·-' + info.heavy.energy + '精力）';
      defLabel = '防御（-' + Math.round(info.defend.reduce * 100) + '%伤·+' + info.defend.energy + '精力）';
      fleeLabel = '逃跑（' + pct(info.flee.chance) + '）';
    }
    actions.appendChild(actBtn(atkLabel, 'attack'));
    actions.appendChild(actBtn(heavyLabel, 'heavy'));
    actions.appendChild(actBtn(defLabel, 'defend'));
    actions.appendChild(h('button', { class: 'btn', text: '用道具', onclick: openCombatItemPicker }));
    actions.appendChild(actBtn(fleeLabel, 'flee'));
    screen.appendChild(actions);

    el.appendChild(screen);
    log.scrollTop = log.scrollHeight;
  }

  function runCombatAction(action, param) {
    var res = G.engine.combatAction(action, param);
    // win/lose/flee：引擎已在 combatAction 内部完成导航（切走了战斗界面），
    // 该终局回合的文本不会再经 showCombat 呈现，这里用 toast 补一条摘要。
    if (res.status !== 'ongoing' && res.status !== 'none' && res.log && res.log.length) {
      toast(res.log.map(function (l) { return G.ui.tags.strip(l); }).join(' '));
    }
  }

  function openCombatItemPicker() {
    openOverlay({
      title: '使用道具',
      build: function (body, close) {
        var inv = (S().player.inventory || []).filter(function (e) {
          var def = G.engine.itemDef(e.id);
          return def && def.fx;   // 只列能产生效果的消耗品（排除武器/服装/材料/关键等无 fx 项，防误耗）
        });
        if (!inv.length) { body.appendChild(h('div', { class: 'inv-empty', text: '没有可用道具' })); return; }
        var list = h('div', { class: 'inv-list' });
        inv.forEach(function (entry) {
          var def = G.engine.itemDef(entry.id) || {};
          var row = h('div', { class: 'inv-item', onclick: function () { close(); runCombatAction('item', entry.id); } });
          row.appendChild(h('span', { class: 'name', text: def.name || entry.id }));
          row.appendChild(h('span', { class: 'count', text: '×' + entry.count }));
          list.appendChild(row);
        });
        body.appendChild(list);
      }
    });
  }

  function showCombat(combat) {
    navSeq++;
    showGameShell();
    pushCombatRound(combat);
    renderCombatView(combat);
    refresh();
  }
  G.ui.showCombat = showCombat;

  // ---- 商店（薄转发，实现见 panels.js） --------------------------------------
  function showShop(shopId) {
    if (G.ui.panels && G.ui.panels.openShop) G.ui.panels.openShop(shopId);
    else console.warn('[ui] showShop: panels.js 未加载');
  }
  G.ui.showShop = showShop;

  // ---- 死亡界面 -------------------------------------------------------------
  var DEATH_CAUSE_TEXT = { exhaustion: '力竭而亡', combat: '死于非命', event: '意外身亡' };
  function showDeath(cause) {
    var el = h('div', { class: 'death-screen' });
    el.appendChild(h('div', { class: 'death-title', text: '死亡' }));
    el.appendChild(h('div', { class: 'death-cause', text: DEATH_CAUSE_TEXT[cause] || ('不幸身亡' + (cause ? '（' + cause + '）' : '')) }));
    var saves = G.engine.listSaves();
    var list = h('div', { class: 'slot-list', style: { width: '100%', maxWidth: '320px' } });
    [1, 2, 3, 'auto'].forEach(function (slot) {
      var info = saves[slot];
      if (!info || !info.exists) return;
      var s = info.summary || {};
      var card = h('div', { class: 'slot-card' });
      card.appendChild(h('div', { class: 'slot-title', text: slot === 'auto' ? '自动存档' : '存档 ' + slot }));
      card.appendChild(h('div', { class: 'slot-summary', text: (s.name || '') + ' · 第' + s.day + '天 ' + (s.date || '') + ' ' + (s.time || '') }));
      card.appendChild(h('button', { class: 'btn primary', text: '读取', onclick: function () { G.engine.load(slot); } }));
      list.appendChild(card);
    });
    if (!list.childNodes.length) list.appendChild(h('div', { class: 'inv-empty', text: '没有可用存档' }));
    el.appendChild(list);
    showFullScreen(el);
  }
  G.ui.showDeath = showDeath;

  // ---- 开局流程（性别 + 姓名） ------------------------------------------------
  function showIntro() {
    var gender = 'm';
    var el = h('div', { class: 'intro-screen' });
    el.appendChild(h('div', { class: 'intro-title', text: '临港余生' }));
    el.appendChild(h('div', { class: 'intro-sub', text: '丧尸末日中，你醒在第 90 天的清晨' }));

    var genderWrap = h('div', { class: 'gender-select' });
    var mBtn = h('button', { class: 'gender-btn active', text: '男' });
    var fBtn = h('button', { class: 'gender-btn', text: '女' });
    mBtn.addEventListener('click', function () { gender = 'm'; mBtn.className = 'gender-btn active'; fBtn.className = 'gender-btn'; });
    fBtn.addEventListener('click', function () { gender = 'f'; fBtn.className = 'gender-btn active'; mBtn.className = 'gender-btn'; });
    genderWrap.appendChild(mBtn); genderWrap.appendChild(fBtn);
    el.appendChild(genderWrap);

    var nameInput = h('input', { class: 'name-input', type: 'text', maxlength: '12', placeholder: '为自己起个名字' });
    el.appendChild(nameInput);

    el.appendChild(h('button', {
      class: 'btn primary', text: '开始', style: { textAlign: 'center', minHeight: '48px' },
      onclick: function () {
        var name = (nameInput.value || '').trim() || '无名氏';
        G.engine.newGameStart({ name: name, gender: gender });
      }
    }));

    showFullScreen(el);
  }
  G.ui.showIntro = showIntro;

})();

</script>
<!-- js/ui/panels.js -->
<script>
/* =============================================================================
 * panels.js — 日历 / 背包 / 身体 / 地图 / 系统 面板 + 商店浮层
 * -----------------------------------------------------------------------------
 * 挂载到 G.ui：
 *   G.ui.panels.open(name)   —— name ∈ 'calendar'|'inventory'|'body'|'map'|'system'
 *                                （render.js 的顶栏/状态条/底部导航按此调用）
 *   G.ui.panels.openShop(id) —— 由 G.ui.showShop 转发调用，见 render.js
 *
 * 依赖 render.js 提供的共享内部工具：G.ui._h（DOM 构造）、G.ui._clear、
 * G.ui.openOverlay（浮层外壳）、G.ui.toast。
 *
 * 背包装备/使用与商店买卖/以物易物，均直接调用 M3（js/data/items.js、trade.js）
 * 补齐的 G.engine.equipWeapon/unequipWeapon/useItem/shopBuyableItems/shopBuy/
 * shopSell/tradeOffersToday/barter；「丢弃道具」两边都没提供，这里直接调最底层
 * 的 G.engine.removeItem。地图面板的地点间连通关系用 G.engine.locationNeighbors
 * （M3 提供，含好感/剧情解锁的下水道捷径）。
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  G.ui = G.ui || {};
  G.data = G.data || {};

  var h = G.ui._h, clearNode = G.ui._clear;
  function S() { return G.state; }

  var activeOverlay = null;
  function openTop(opts) {
    if (activeOverlay) { activeOverlay.close(); activeOverlay = null; }
    var userOnClose = opts.onClose;
    var merged = {};
    for (var k in opts) merged[k] = opts[k];
    merged.onClose = function () { activeOverlay = null; if (userOnClose) userOnClose(); };
    activeOverlay = G.ui.openOverlay(merged);
    return activeOverlay;
  }
  function closePanels() { if (activeOverlay) { activeOverlay.close(); activeOverlay = null; } }

  // =========================================================================
  // 日历面板
  // =========================================================================
  // 与 time.js 相同的日历锚点（引擎未导出「日期→绝对天数」的反向换算，这里按
  // 文档固定值复刻；若 M9 调整锚点须同步改这里）：第 0 天 = 2025-07-14。
  var CAL_ANCHOR = Date.UTC(2025, 6, 14);
  function dayOfDate(year, month, date) {
    return Math.round((Date.UTC(year, month - 1, date) - CAL_ANCHOR) / 86400000);
  }
  function daysInMonth(year, month) { return new Date(Date.UTC(year, month, 0)).getUTCDate(); }

  function dayMarks(offset) {
    var marks = [];
    var cal = S().calendar;
    if (cal.appointments.some(function (a) { return a.day === offset; })) marks.push('appt');
    if (cal.milestones.some(function (m) { return m.day === offset; })) marks.push('milestone');
    var wd = G.engine.dateOf(offset).weekday;
    var hasCycle = G.data.events && G.data.events.all().some(function (ev) {
      return ev.type === 'scheduled' && ev.cond && ev.cond.weekday === wd;
    });
    if (hasCycle) marks.push('cycle');
    return marks;
  }
  function dayItems(offset) {
    var out = [];
    S().calendar.appointments.filter(function (a) { return a.day === offset; }).forEach(function (a) {
      out.push('📌 ' + (a.label || a.eventId || '约定') + (a.done ? '（已完成）' : ''));
    });
    S().calendar.milestones.filter(function (m) { return m.day === offset; }).forEach(function (m) {
      out.push('★ ' + m.label);
    });
    var wd = G.engine.dateOf(offset).weekday;
    (G.data.events ? G.data.events.all() : []).filter(function (ev) {
      return ev.type === 'scheduled' && ev.cond && ev.cond.weekday === wd;
    }).forEach(function (ev) { out.push('🔁 周期事件：' + ev.id); });
    return out;
  }

  function openCalendar() {
    var today = G.engine.dateOf(S().player.day);
    var viewYear = today.year, viewMonth = today.month, selectedDay = S().player.day;
    var ov = openTop({
      title: '日历',
      build: function (body) {
        var head = h('div', { class: 'cal-head' });
        head.appendChild(h('button', {
          text: '‹', onclick: function () {
            viewMonth--; if (viewMonth < 1) { viewMonth = 12; viewYear--; } ov.refresh();
          }
        }));
        head.appendChild(h('div', { text: viewYear + '年' + viewMonth + '月' }));
        head.appendChild(h('button', {
          text: '›', onclick: function () {
            viewMonth++; if (viewMonth > 12) { viewMonth = 1; viewYear++; } ov.refresh();
          }
        }));
        body.appendChild(head);

        var grid = h('div', { class: 'cal-grid' });
        ['一', '二', '三', '四', '五', '六', '日'].forEach(function (w) { grid.appendChild(h('div', { class: 'cal-wd', text: w })); });
        var firstOffset = dayOfDate(viewYear, viewMonth, 1);
        var firstWd = G.engine.dateOf(firstOffset).weekday;
        for (var i = 0; i < firstWd; i++) grid.appendChild(h('div', { class: 'cal-cell pad' }));
        var dim = daysInMonth(viewYear, viewMonth);
        for (var d = 1; d <= dim; d++) {
          var offset = dayOfDate(viewYear, viewMonth, d);
          var cell = h('div', { class: 'cal-cell' + (offset === S().player.day ? ' today' : '') });
          cell.appendChild(document.createTextNode(String(d)));
          var marks = dayMarks(offset);
          if (marks.length) {
            var dots = h('div', { class: 'dots' });
            marks.forEach(function (m) { dots.appendChild(h('i', { class: 'cal-dot-' + m })); });
            cell.appendChild(dots);
          }
          (function (off) { cell.addEventListener('click', function () { selectedDay = off; renderDetail(); }); })(offset);
          grid.appendChild(cell);
        }
        body.appendChild(grid);

        var legend = h('div', { class: 'cal-legend' });
        legend.appendChild(h('span', { html: '<i class="cal-dot-appt"></i>约定' }));
        legend.appendChild(h('span', { html: '<i class="cal-dot-cycle"></i>周期事件' }));
        legend.appendChild(h('span', { html: '<i class="cal-dot-milestone"></i>重要日子' }));
        body.appendChild(legend);

        var detail = h('div', { class: 'cal-day-detail' });
        body.appendChild(detail);
        function renderDetail() {
          clearNode(detail);
          var dt = G.engine.dateOf(selectedDay);
          detail.appendChild(h('div', { text: dt.md + ' ' + dt.weekdayName + (selectedDay === S().player.day ? '（今天）' : '') }));
          var items = dayItems(selectedDay);
          if (!items.length) { detail.appendChild(h('div', { style: { color: 'var(--fg-dim)', marginTop: '6px' }, text: '无登记条目' })); return; }
          items.forEach(function (it) { detail.appendChild(h('div', { style: { marginTop: '4px' }, text: it })); });
        }
        renderDetail();
      }
    });
  }

  // =========================================================================
  // 背包面板
  // =========================================================================
  var INV_CATS = [
    { key: 'all', label: '全部' }, { key: 'weapon', label: '武器' }, { key: 'clothing', label: '服装' },
    { key: 'med', label: '药品' }, { key: 'food', label: '食物' }, { key: 'drink', label: '饮水' },
    { key: 'material', label: '材料' }, { key: 'key', label: '关键' }, { key: 'misc', label: '杂物' }
  ];

  // 装备/卸下/使用由 M3 的 js/data/items.js 提供（G.engine.equipWeapon/unequipWeapon/useItem）；
  // 丢弃道具 M1/M3 均未提供对应函数，直接调最底层的 removeItem。
  function equipWeapon(id) { G.engine.equipWeapon(id); G.ui.refresh(); }
  function unequipWeapon() { G.engine.unequipWeapon(); G.ui.refresh(); }
  function equipClothing(id) { G.engine.equipClothing(id); G.ui.refresh(); }
  function useItem(id) {
    var res = G.engine.useItem(id);
    if (res && res.msg) G.ui.toast(G.ui.tags.strip(res.msg));
    G.ui.refresh();
  }
  function dropItem(id) { G.engine.removeItem(id, 1); G.ui.refresh(); }

  function openItemDetail(entry) {
    var def = G.engine.itemDef(entry.id) || { name: entry.id, desc: '', type: 'misc' };
    G.ui.openOverlay({
      title: def.name || entry.id, center: true,
      build: function (body2, close2) {
        var wrap = h('div', { class: 'item-detail-body' });
        wrap.appendChild(h('div', { class: 'item-detail-desc', text: def.desc || '' }));
        var meta = [];
        if (def.type) meta.push('类型：' + def.type);
        if (def.weight != null) meta.push('重量：' + def.weight);
        if (def.price != null) meta.push('参考价：' + def.price);
        if (entry.durability != null) meta.push('耐久：' + entry.durability + (def.durMax ? ('/' + def.durMax) : ''));
        wrap.appendChild(h('div', { class: 'item-detail-meta', text: meta.join(' · ') }));
        if (def.type === 'clothing') {
          var cslot = { top: '上装', bottom: '下装', shoes: '鞋' }[def.slot] || def.slot;
          wrap.appendChild(h('div', { class: 'item-detail-meta', text: '部位：' + cslot + ' · 保暖 ' + (def.warmth || 0) + ' · 护甲 ' + (def.armor || 0) + ' · 体面 ' + (def.decency || 0) }));
        }

        var actions = h('div', { class: 'item-actions' });
        if (def.type === 'weapon') {
          if (entry.equipped) {
            actions.appendChild(h('button', { class: 'btn', text: '卸下', onclick: function () { unequipWeapon(); close2(); if (activeOverlay) activeOverlay.refresh(); } }));
          } else {
            actions.appendChild(h('button', { class: 'btn primary', text: '装备', onclick: function () { equipWeapon(entry.id); close2(); if (activeOverlay) activeOverlay.refresh(); } }));
          }
        } else if (def.type === 'clothing') {
          actions.appendChild(h('button', { class: 'btn primary', text: '穿上', onclick: function () { equipClothing(entry.id); close2(); if (activeOverlay) activeOverlay.refresh(); } }));
        } else if (def.fx) {
          actions.appendChild(h('button', { class: 'btn primary', text: '使用', onclick: function () { useItem(entry.id); close2(); if (activeOverlay) activeOverlay.refresh(); } }));
        }
        if (!entry.equipped) {
          actions.appendChild(h('button', { class: 'btn danger', text: '丢弃', onclick: function () { dropItem(entry.id); close2(); if (activeOverlay) activeOverlay.refresh(); } }));
        }
        wrap.appendChild(actions);
        body2.appendChild(wrap);
      }
    });
  }

  function openInventory() {
    var activeCat = 'all';
    openTop({
      title: '背包',
      build: function (body) {
        var tabs = h('div', { class: 'inv-tabs' });
        INV_CATS.forEach(function (c) {
          tabs.appendChild(h('button', {
            class: 'inv-tab' + (c.key === activeCat ? ' active' : ''), text: c.label,
            onclick: function () { activeCat = c.key; activeOverlay.refresh(); }
          }));
        });
        body.appendChild(tabs);

        var weight = G.engine.invWeight(), cap = G.engine.carryCap();
        body.appendChild(h('div', {
          class: 'inv-weight' + (weight > cap ? ' over' : ''),
          text: '负重 ' + weight.toFixed(1) + ' / ' + cap + (weight > cap ? '（超重，无法快速撤离）' : '')
        }));

        var list = h('div', { class: 'inv-list' });
        var shown = 0;
        if (S().player.weapon && (activeCat === 'all' || activeCat === 'weapon')) {
          var w = S().player.weapon, wdef = G.engine.itemDef(w.id) || {};
          var row = h('div', {
            class: 'inv-item',
            onclick: function () { openItemDetail({ id: w.id, count: 1, durability: w.durability, equipped: true }); }
          });
          row.appendChild(h('span', { class: 'name equipped', text: wdef.name || w.id }));
          row.appendChild(h('span', { class: 'count', text: '耐久' + w.durability }));
          list.appendChild(row); shown++;
        }
        (S().player.inventory || []).forEach(function (entry) {
          var def = G.engine.itemDef(entry.id) || {};
          var type = def.type || 'misc';
          if (activeCat !== 'all' && type !== activeCat) return;
          shown++;
          var row = h('div', { class: 'inv-item', onclick: function () { openItemDetail(entry); } });
          row.appendChild(h('span', { class: 'name', text: def.name || entry.id }));
          row.appendChild(h('span', { class: 'count', text: (type === 'weapon' || type === 'clothing') ? '耐久' + entry.durability : '×' + entry.count }));
          list.appendChild(row);
        });
        if (!shown) list.appendChild(h('div', { class: 'inv-empty', text: '空空如也' }));
        body.appendChild(list);
      }
    });
  }

  // =========================================================================
  // 身体面板
  // =========================================================================
  var BODY_STATS = [
    { key: 'hp', label: '生命', abnormal: function (v) { return v < 30; }, note: function (v) { return v < 30 ? '生命垂危' : ''; } },
    { key: 'hunger', label: '饥饿', abnormal: function (v) { return v < G.TUNE.T_STARVE; }, note: function (v) { return v < G.TUNE.T_STARVE ? '饥饿难耐，持续掉血' : ''; } },
    { key: 'thirst', label: '口渴', abnormal: function (v) { return v < G.TUNE.T_STARVE; }, note: function (v) { return v < G.TUNE.T_STARVE ? '干渴难忍，持续掉血' : ''; } },
    { key: 'energy', label: '精力', abnormal: function (v) { return v < G.TUNE.T_ENERGY; }, note: function (v) { return v < G.TUNE.T_ENERGY ? '精疲力竭，行动耗时 +50%' : ''; } },
    { key: 'sanity', label: '理智', abnormal: function (v) { return v < G.TUNE.T_SANITY; }, note: function (v) { return v < G.TUNE.T_SANITY ? '理智濒临崩溃，可能出现幻觉' : ''; } },
    { key: 'alcohol', label: '酒精', abnormal: function (v) { return v > G.TUNE.T_DRUNK; }, note: function (v) { return v > G.TUNE.T_DRUNK ? '酩酊大醉，判定受罚' : ''; } },
    { key: 'addiction', label: '成瘾', abnormal: function (v) { return v > G.TUNE.T_ADDICT; }, note: function (v) { return v > G.TUNE.T_ADDICT ? '瘾发难耐，每日发作' : ''; } },
    { key: 'infection', label: '感染', abnormal: function (v) { return v > G.TUNE.T_INFECT; }, note: function (v) { return v > G.TUNE.T_INFECT ? '感染濒危，命悬一线' : ''; } },
    { key: 'cold', label: '寒冷', abnormal: function (v) { return v > G.TUNE.T_COLD_CAP; }, note: function (v) { return v > G.TUNE.T_COLD_HP ? '严重失温，正在掉血' : (v > G.TUNE.T_COLD_CAP ? '冷得发抖，精力上限下降' : ''); } }
  ];
  // ---- 服装区块（三槽显示 + 换装/卸下/修补） ------------------------------
  var CLOTH_SLOT_META = [
    { key: 'top', label: '上装' }, { key: 'bottom', label: '下装' }, { key: 'shoes', label: '鞋' }
  ];
  function pickClothingFor(slot, close) {
    G.ui.openOverlay({
      title: '换' + ({ top: '上装', bottom: '下装', shoes: '鞋' }[slot] || '装'), center: true,
      build: function (body2, close2) {
        var opts = (S().player.inventory || []).filter(function (e) {
          var d = G.engine.itemDef(e.id); return d && d.type === 'clothing' && d.slot === slot;
        });
        if (!opts.length) { body2.appendChild(h('div', { class: 'inv-empty', text: '背包里没有这个部位的替换衣物' })); return; }
        var list = h('div', { class: 'inv-list' });
        opts.forEach(function (entry) {
          var d = G.engine.itemDef(entry.id) || {};
          var row = h('div', { class: 'inv-item', onclick: function () {
            G.engine.equipClothing(entry.id); G.ui.refresh(); close2(); if (activeOverlay) activeOverlay.refresh();
          } });
          row.appendChild(h('span', { class: 'name', text: d.name || entry.id }));
          row.appendChild(h('span', { class: 'count', text: '耐久' + entry.durability }));
          list.appendChild(row);
        });
        body2.appendChild(list);
      }
    });
  }
  function renderOutfit(body) {
    var o = S().player.outfit || {};
    body.appendChild(h('div', { class: 'section-title', text: '着装' }));
    var sum = h('div', { class: 'outfit-summary', text: '保暖 ' + G.engine.outfitWarmth() + ' · 护甲 ' + G.engine.outfitArmor() + ' · 体面 ' + G.engine.outfitDecency() });
    body.appendChild(sum);
    var wrap = h('div', { class: 'outfit-slots' });
    CLOTH_SLOT_META.forEach(function (sm) {
      var c = o[sm.key];
      var row = h('div', { class: 'outfit-row' });
      var left = h('div', { class: 'outfit-info' });
      left.appendChild(h('span', { class: 'outfit-slot', text: sm.label }));
      if (c) {
        var def = G.engine.itemDef(c.id) || {};
        var eff = G.engine.clothingEff(c);
        left.appendChild(h('span', { class: 'outfit-name' + (eff.torn ? ' torn' : ''), text: (def.name || c.id) + (eff.torn ? '（破损）' : '') }));
        left.appendChild(h('span', { class: 'outfit-dur', text: '耐久 ' + c.dur + '/' + (def.durMax || '?') }));
      } else {
        left.appendChild(h('span', { class: 'outfit-name empty', text: '（空着）' }));
      }
      row.appendChild(left);
      var acts = h('div', { class: 'outfit-acts' });
      acts.appendChild(h('button', { class: 'btn', text: c ? '更换' : '穿上', onclick: function () { pickClothingFor(sm.key); } }));
      if (c) {
        var def2 = G.engine.itemDef(c.id) || {};
        if (c.dur < (def2.durMax || 1) && G.engine.hasItem('sewingkit')) {
          acts.appendChild(h('button', { class: 'btn', text: '修补', onclick: function () {
            var res = G.engine.repairClothing(sm.key);
            if (res && res.msg) G.ui.toast(G.ui.tags.strip(res.msg));
            if (activeOverlay) activeOverlay.refresh();
          } }));
        }
        acts.appendChild(h('button', { class: 'btn', text: '脱下', onclick: function () {
          G.engine.unequipClothing(sm.key); G.ui.refresh(); if (activeOverlay) activeOverlay.refresh();
        } }));
      }
      row.appendChild(acts);
      wrap.appendChild(row);
    });
    body.appendChild(wrap);
  }

  function openBody() {
    openTop({
      title: '身体状态',
      build: function (body) {
        renderOutfit(body);
        body.appendChild(h('div', { class: 'section-title', text: '状态' }));
        var grid = h('div', { class: 'body-grid' });
        BODY_STATS.forEach(function (st) {
          var v = G.engine.statGet(st.key);
          var abn = st.abnormal(v);
          var wrap = h('div', { class: 'body-stat' + (abn ? ' abnormal' : '') });
          var lab = h('div', { class: 'label' });
          lab.appendChild(h('span', { text: st.label }));
          lab.appendChild(h('span', { class: 'val', text: Math.round(v) }));
          wrap.appendChild(lab);
          var track = h('div', { class: 'track' });
          track.appendChild(h('div', { class: 'fill', style: { width: G.engine.clamp(v, 0, 100) + '%', background: abn ? 'var(--danger)' : 'var(--accent)' } }));
          wrap.appendChild(track);

      }
    });

  // =========================================================================
  // 地图面板
  // =========================================================================
  var SVG_NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) {
    var el = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  // M11：按 G.data.locations[id].mapPos（0–100 逻辑坐标）真实摆放，替代原环形自动布局；
  // 缺 mapPos 的地点（理论上不存在，防御性兜底）落在画布中心。
  function openMap() {
    openTop({
      title: '地图',
      build: function (body) {
        var locs = G.data.locations || {};
        var ids = Object.keys(locs);
        if (!ids.length) { body.appendChild(h('div', { class: 'inv-empty', text: '地图数据未加载（等待 M3）' })); return; }
        var cur = S().player.location;
        var neighbors = G.engine.locationNeighbors ? G.engine.locationNeighbors(cur) : {};
        var shortcutUnlocked = !!(G.engine.getFlag && G.engine.getFlag('world.sewerShortcut'));

        var size = 300, pad = 32, span = size - 2 * pad;
        var pos = {};
        ids.forEach(function (id) {
          var mp = locs[id].mapPos || { x: 50, y: 50 };
          pos[id] = { x: pad + (mp.x / 100) * span, y: pad + (mp.y / 100) * span };
        });

        var svg = svgEl('svg', { viewBox: '0 0 ' + size + ' ' + size, class: 'map-svg' });
        function midLabel(a, b, minutes) {
          var t = svgEl('text', { class: 'map-edge-label', x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
          t.textContent = minutes + '分';
          return t;
        }
        // 相邻地点连线（实线，标注移动分钟数）
        var drawn = {};
        ids.forEach(function (id) {
          Object.keys((locs[id].adjacent) || {}).forEach(function (nb) {
            if (!pos[nb]) return;
            var key = [id, nb].sort().join('-');
            if (drawn[key]) return; drawn[key] = true;
            svg.appendChild(svgEl('line', { class: 'map-edge', x1: pos[id].x, y1: pos[id].y, x2: pos[nb].x, y2: pos[nb].y }));
            svg.appendChild(midLabel(pos[id], pos[nb], locs[id].adjacent[nb]));
          });
        });
        // 下水道捷径（虚线，仅 world.sewerShortcut 解锁后画出）
        if (shortcutUnlocked) {
          ids.forEach(function (id) {
            Object.keys((locs[id].shortcuts) || {}).forEach(function (nb) {
              if (!pos[nb]) return;
              svg.appendChild(svgEl('line', { class: 'map-edge shortcut', x1: pos[id].x, y1: pos[id].y, x2: pos[nb].x, y2: pos[nb].y }));
              svg.appendChild(midLabel(pos[id], pos[nb], locs[id].shortcuts[nb]));
            });
          });
        }
        // 地点节点：危险度着色（0 绿→3 红）、营业时间外灰显、当前/可达描边
        ids.forEach(function (id) {
          var loc = locs[id];
          var open = G.engine.isLocationOpen ? G.engine.isLocationOpen(id) : true;
          var cls = 'map-node danger-' + (loc.danger || 0)
            + (id === cur ? ' current' : (neighbors[id] != null ? ' adj' : ''))
            + (!open ? ' closed' : '');
          var g = svgEl('g', { class: cls });
          g.appendChild(svgEl('circle', { cx: pos[id].x, cy: pos[id].y, r: id === cur ? 9 : 6 }));
          var t = svgEl('text', { x: pos[id].x, y: pos[id].y + (pos[id].y > size / 2 ? 15 : -10) });
          t.textContent = loc.name || id;
          g.appendChild(t);
          g.addEventListener('click', function () {
            if (id === cur) return;
            if (neighbors[id] == null) { G.ui.toast('不相邻，需先移动到中间地点'); return; }
            var res = G.engine.travelTo(id);
            if (!res.ok && !res.died) { G.ui.toast(res.msg); return; }
            closePanels();
          });
          svg.appendChild(g);
        });

        var wrap = h('div', { class: 'map-wrap' });
        wrap.appendChild(svg);
        body.appendChild(wrap);
        body.appendChild(h('div', { class: 'map-legend', text: '青色描边 = 可直接前往　灰显 = 现在没开门　虚线 = 下水道捷径' }));
        body.appendChild(h('div', { class: 'map-legend', text: '危险度：绿→黄→橙→红（0→3）' }));
      }
    });
  }

  // =========================================================================
  // 系统面板
  // =========================================================================
  function openSystem() {
    openTop({
      title: '系统',
      build: function (body) {
        var slots = G.engine.listSaves();
        var list = h('div', { class: 'slot-list' });
        [1, 2, 3].forEach(function (slot) {
          var info = slots[slot];
          var card = h('div', { class: 'slot-card' });
          card.appendChild(h('div', { class: 'slot-title', text: '存档 ' + slot }));
          if (info && info.exists) {
            var s = info.summary;
            card.appendChild(h('div', { class: 'slot-summary', text: (s.name || '') + ' · 第' + s.day + '天 ' + s.date + ' ' + s.time }));
          } else {
            card.appendChild(h('div', { class: 'slot-summary', text: '空槽位' }));
          }
          var actions = h('div', { class: 'slot-actions' });
          actions.appendChild(h('button', {
            class: 'btn', text: '存档', onclick: function () {
              G.engine.save(slot); G.ui.toast('已存至槽位 ' + slot); activeOverlay.refresh();
            }
          }));
          if (info && info.exists) {
            actions.appendChild(h('button', { class: 'btn primary', text: '读档', onclick: function () { closePanels(); G.engine.load(slot); } }));
            actions.appendChild(h('button', { class: 'btn danger', text: '删除', onclick: function () { G.engine.deleteSave(slot); activeOverlay.refresh(); } }));
          }
          card.appendChild(actions);
          list.appendChild(card);
        });
        var autoInfo = slots['auto'];
        var autoCard = h('div', { class: 'slot-card' });
        autoCard.appendChild(h('div', { class: 'slot-title', text: '自动存档' }));
        autoCard.appendChild(h('div', {
          class: 'slot-summary',
          text: (autoInfo && autoInfo.exists) ? ((autoInfo.summary.name || '') + ' · 第' + autoInfo.summary.day + '天') : '暂无'
        }));
        if (autoInfo && autoInfo.exists) {
          var aa = h('div', { class: 'slot-actions' });
          aa.appendChild(h('button', { class: 'btn primary', text: '读档', onclick: function () { closePanels(); G.engine.load('auto'); } }));
          autoCard.appendChild(aa);
        }
        list.appendChild(autoCard);
        body.appendChild(list);

        body.appendChild(h('div', { class: 'section-title', text: '存档码（导出）' }));
        var exportBox = h('textarea', { class: 'export-box', readonly: 'readonly' });
        exportBox.value = G.engine.exportCode();
        body.appendChild(exportBox);
        var expRow = h('div', { class: 'item-actions', style: { marginTop: '8px' } });
        expRow.appendChild(h('button', {
          class: 'btn', text: '复制', onclick: function () {
            exportBox.focus(); exportBox.select();
            try { document.execCommand('copy'); G.ui.toast('已复制到剪贴板'); }
            catch (e) { G.ui.toast('复制失败，请手动选择文本'); }
          }
        }));
        body.appendChild(expRow);

        body.appendChild(h('div', { class: 'section-title', text: '导入存档码' }));
        var importBox = h('textarea', { class: 'export-box', placeholder: '粘贴存档码' });
        body.appendChild(importBox);
        body.appendChild(h('button', {
          class: 'btn primary', text: '导入', style: { marginTop: '8px' }, onclick: function () {
            if (G.engine.importCode(importBox.value)) { G.ui.toast('导入成功'); closePanels(); }
            else G.ui.toast('存档码无效');
          }
        }));

        body.appendChild(h('div', { class: 'about-text', text: '《临港余生》—— 丧尸末日文字冒险。纯前端实现，存档保存在本机浏览器中。' }));

        // 仅当 _demo.js 已加载（G.data.story 里注册了演示段落）时显示，
        // 供 M2 验收标签渲染 / 战斗界面；M3 数据接入后 _demo.js 移除，本区块自动消失。
        if (G.data.story && G.data.story.get('demo_tags')) {
          body.appendChild(h('div', { class: 'section-title', text: '演示（M2 验收用，正式数据接入后自动消失）' }));
          var demoRow = h('div', { class: 'item-actions' });
          demoRow.appendChild(h('button', { class: 'btn', text: '标签演示', onclick: function () { closePanels(); G.engine.openPassage('demo_tags'); } }));
          demoRow.appendChild(h('button', { class: 'btn', text: '战斗演示', onclick: function () { closePanels(); G.engine.startCombat('demo_pair'); } }));
          body.appendChild(demoRow);
        }
      }
    });
  }

  // =========================================================================
  // 商店（买卖/以物易物逻辑均由 M3 的 js/data/trade.js 提供）
  // =========================================================================
  function shopTitle(shopId, def) {
    var npcDef = (G.data.npcs && G.data.npcs[def.npc]) || {};
    return (npcDef.name || def.npc || shopId) + (def.type === 'barter' ? '·以物易物' : '·交易');
  }
  function openShop(shopId) {
    openTop({
      title: (G.data.trade && G.data.trade[shopId] && shopTitle(shopId, G.data.trade[shopId])) || '交易',
      build: function (body) {
        var def = G.data.trade && G.data.trade[shopId];
        if (!def) { body.appendChild(h('div', { class: 'inv-empty', text: '商店数据缺失：' + shopId })); return; }
        function refreshShop() { if (activeOverlay) activeOverlay.refresh(); G.ui.refresh(); }

        body.appendChild(h('div', { class: 'shop-bullets', text: '子弹：' + S().player.bullets }));

        if (def.type === 'barter') {
          body.appendChild(h('div', { class: 'section-title', text: '今日以物易物' }));
          var offerList = h('div', { class: 'shop-list' });
          var offers = G.engine.tradeOffersToday ? G.engine.tradeOffersToday(shopId) : [];
          offers.forEach(function (o) {
            var giveDef = G.engine.itemDef(o.offer.give.id) || {};
            var wantDef = G.engine.itemDef(o.offer.want.id) || {};
            var row = h('div', { class: 'shop-item' });
            row.appendChild(h('span', { text: (wantDef.name || o.offer.want.id) + '×' + o.offer.want.count + ' 换 ' + (giveDef.name || o.offer.give.id) + '×' + o.offer.give.count }));
            row.appendChild(h('button', {
              class: 'btn', text: '交换', onclick: function () {
                var res = G.engine.barter(shopId, o.index);
                if (res && res.msg) G.ui.toast(G.ui.tags.strip(res.msg));
                refreshShop();
              }
            }));
            offerList.appendChild(row);
          });
          if (!offers.length) offerList.appendChild(h('div', { class: 'inv-empty', text: '今天没有可交换的东西' }));
          body.appendChild(offerList);
          return;
        }

        body.appendChild(h('div', { class: 'section-title', text: '购买' }));
        var buyIds = G.engine.shopBuyableItems ? G.engine.shopBuyableItems(shopId) : [];
        var buyList = h('div', { class: 'shop-list' });
        buyIds.forEach(function (id) {
          var idef = G.engine.itemDef(id); if (!idef) return;
          var price = G.engine.itemPriceNow ? G.engine.itemPriceNow(id) : idef.price;  // M15：冬季保暖装涨价
          var hiked = price != null && idef.price != null && price > idef.price;
          var row = h('div', { class: 'shop-item' });
          row.appendChild(h('span', { text: (idef.name || id) + (hiked ? ' ❄' : '') }));
          row.appendChild(h('span', { class: 'price', text: (price || 0) + ' 弹' }));
          row.appendChild(h('button', {
            class: 'btn', text: '购买', onclick: function () {
              var res = G.engine.shopBuy(shopId, id, 1);
              if (res && res.msg) G.ui.toast(G.ui.tags.strip(res.msg));
              refreshShop();
            }
          }));
          buyList.appendChild(row);
        });
        if (!buyIds.length) buyList.appendChild(h('div', { class: 'inv-empty', text: '暂无可购' }));
        body.appendChild(buyList);

        body.appendChild(h('div', { class: 'section-title', text: '出售' }));
        var sellList = h('div', { class: 'shop-list' });
        var sellable = (S().player.inventory || []).filter(function (e) {
          var d = G.engine.itemDef(e.id); return d && d.price != null;
        });
        sellable.forEach(function (entry) {
          var idef = G.engine.itemDef(entry.id);
          var value = Math.round((idef.price || 0) * (def.sellRate == null ? 0.5 : def.sellRate));
          var row = h('div', { class: 'shop-item' });
          row.appendChild(h('span', { text: (idef.name || entry.id) + ' ×' + entry.count }));
          row.appendChild(h('span', { class: 'price', text: value + ' 弹' }));
          row.appendChild(h('button', {
            class: 'btn', text: '出售', onclick: function () {
              var res = G.engine.shopSell(shopId, entry.id, 1);
              if (res && res.msg) G.ui.toast(G.ui.tags.strip(res.msg));
              refreshShop();
            }
          }));
          sellList.appendChild(row);
        });
        if (!sellable.length) sellList.appendChild(h('div', { class: 'inv-empty', text: '没有可出售的物品' }));
        body.appendChild(sellList);
      }
    });
  }

  // =========================================================================
  G.ui.panels = {
    open: function (name) {
      if (name === 'calendar') openCalendar();
      else if (name === 'inventory') openInventory();
      else if (name === 'body') openBody();
      else if (name === 'map') openMap();
      else if (name === 'system') openSystem();
      else console.warn('[panels] 未知面板:', name);
    },
    openShop: openShop
  };

})();

</script>
<!-- js/ui/tags.js -->
<script>
/* =============================================================================
 * tags.js — 文字标签解析（Schema「文字标签」节，唯一允许的富文本方式）
 * -----------------------------------------------------------------------------
 * 挂载到 G.ui：
 *
 *   G.ui.tags.parse(text)      —— 将 passage/事件正文中的 [类型:参数]文本[/类型]
 *                                  解析为带 class/内联色的 HTML 字符串（已转义原文）。
 *                                  每次调用独立计数：horror/flash 两个动效标签合计
 *                                  全 passage 最多生效 1 次，超出的降级为纯色 span
 *                                  （仍保留标签自身的红色，只是去掉动效 class）。
 *   G.ui.tags.npcColor(id)     —— 取 NPC 专色：优先读 G.data.npcs[id].color，
 *                                  未注册（M4 前 / 未知 id）时按 id 哈希兜底取色，
 *                                  保证标签在数据未就绪时仍可视。
 *   G.ui.tags.escapeHtml(s)    —— HTML 转义，供其他 UI 文件拼接动态文本时复用。
 *
 * 用法：render.js/panels.js 渲染 passage 正文时用 innerHTML = G.ui.tags.parse(text)，
 * 其余所有来自玩家/数据的动态文本一律用 textContent 或 escapeHtml，禁止裸拼 innerHTML。
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  G.ui = G.ui || {};

  // 标签 → CSS class（颜色见 style.css :root 变量，与 Schema 标签表一一对应）
  var TAG_DEFS = {
    item:   { cls: 'tag-item' },
    place:  { cls: 'tag-place' },
    blood:  { cls: 'tag-blood' },
    med:    { cls: 'tag-med' },
    zed:    { cls: 'tag-zed' },
    lust:   { cls: 'tag-lust' },
    horror: { cls: 'tag-horror', anim: 'tag-anim-horror' },
    flash:  { cls: 'tag-flash', anim: 'tag-anim-flash' }
  };
  // 全游戏仅这两个动效标签，合计每 passage 最多出现 1 次动效
  var MOTION_TYPES = { horror: true, flash: true };

  var TAG_RE = /\[(npc|item|place|blood|med|zed|lust|horror|flash)(?::([^\]]*))?\]([\s\S]*?)\[\/\1\]/g;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  G.ui.tags = G.ui.tags || {};
  G.ui.tags.escapeHtml = escapeHtml;

  // 去掉标签方括号，仅留纯文本（toast 等无法渲染 HTML 的场合用）
  function strip(text) {
    return String(text == null ? '' : text).replace(/\[\/?[a-z]+(?::[^\]]*)?\]/g, '');
  }
  G.ui.tags.strip = strip;

  // 兜底调色板：M4 交付 G.data.npcs[id].color 前（或遇到未知 id）按哈希取一个稳定颜色
  var FALLBACK_PALETTE = ['#4a7fb5', '#69b0a2', '#a06cc4', '#c46a8a', '#c4a24a',
    '#5a9bd4', '#b57b4a', '#7a8a5c', '#9a6a6a', '#6a8ac4'];
  function npcColor(id) {
    var def = G.data && G.data.npcs && G.data.npcs[id];
    if (def && def.color) return def.color;
    var h = 0, s = String(id || '');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return FALLBACK_PALETTE[h % FALLBACK_PALETTE.length];
  }
  G.ui.tags.npcColor = npcColor;

  function renderTag(type, param, content, claimMotion) {
    if (type === 'npc') {
      return '<span class="tag-npc" style="color:' + npcColor(param) + '">' + content + '</span>';
    }
    var def = TAG_DEFS[type];
    if (MOTION_TYPES[type]) {
      var granted = claimMotion();
      return '<span class="tag-' + type + (granted ? ' ' + def.anim : '') + '">' + content + '</span>';
    }
    return '<span class="' + def.cls + '">' + content + '</span>';
  }

  function parse(text) {
    text = text == null ? '' : String(text);
    var motionUsed = false;
    function claimMotion() {
      if (motionUsed) return false;
      motionUsed = true;
      return true;
    }

    var out = '', lastIndex = 0, m;
    TAG_RE.lastIndex = 0;
    while ((m = TAG_RE.exec(text))) {
      out += escapeHtml(text.slice(lastIndex, m.index));
      out += renderTag(m[1], m[2], escapeHtml(m[3]), claimMotion);
      lastIndex = TAG_RE.lastIndex;
    }
    out += escapeHtml(text.slice(lastIndex));
    return out;
  }
  G.ui.tags.parse = parse;

})();

    cai_oldphoto: { name: '旧照片', type: 'key', desc: '一张边角卷起的合影，背面写着一个日期。', price: null, weight: 1 }, // 预留：cai 剧情道具
    worn_idcard: { name: '旧身份证', type: 'misc', desc: '主角身上带着的身份证，塑封已经发黄开裂。', price: null, weight: 1 } // 预留：主角前情伏笔道具
  };

  // ---- 配套小逻辑：使用 / 装备（M1 未提供，数据层补齐） -------------------
  function useItem(id) {
    var def = G.engine.itemDef(id);
    if (!def) return { ok: false, msg: '没有这样东西。' };
    if (!G.engine.hasItem(id)) return { ok: false, msg: '你身上没有[item]' + def.name + '[/item]。' };
    if (def.type === 'weapon' || def.type === 'key' || def.type === 'misc') {
      return { ok: false, msg: '[item]' + def.name + '[/item]没法直接使用。' };
    }
    // skill:bandage 治疗类增益（引擎 medBoostFx 无技能时原样返回 def.fx）
    var fx = (G.engine.medBoostFx ? G.engine.medBoostFx(def) : def.fx) || {};
    G.engine.applyFx(fx);
    G.engine.removeItem(id, 1);
    return { ok: true, msg: '你用掉了[item]' + def.name + '[/item]。' };
  }
  G.engine.useItem = useItem;

  function equipWeapon(id) {
    var def = G.engine.itemDef(id);
    if (!def || def.type !== 'weapon') return false;
    var inv = G.state.player.inventory, idx = -1;
    for (var i = 0; i < inv.length; i++) if (inv[i].id === id) { idx = i; break; }
    if (idx < 0) return false;
    var entry = inv[idx];
    var cur = G.state.player.weapon;
    inv.splice(idx, 1);
    if (cur) inv.push({ id: cur.id, count: 1, durability: cur.durability });
    G.state.player.weapon = { id: id, durability: entry.durability };
    return true;
  }
  G.engine.equipWeapon = equipWeapon;

  function unequipWeapon() {
    var w = G.state.player.weapon;
    if (!w) return false;
    G.state.player.weapon = null;
    G.state.player.inventory.push({ id: w.id, count: 1, durability: w.durability });
    return true;
  }
  G.engine.unequipWeapon = unequipWeapon;

  // ---- 服装装备/卸下/修补（M14；outfit 结构与效果计算见 state.js） ----------
  // 从背包取该 id 的第一件服装穿上，占用其 slot，原槽位服装（若有）放回背包。
  function equipClothing(id) {
    var def = G.engine.itemDef(id);
    if (!def || def.type !== 'clothing') return false;
    var p = G.state.player;
    p.outfit = p.outfit || { top: null, bottom: null, shoes: null };
    var inv = p.inventory, idx = -1;
    for (var i = 0; i < inv.length; i++) if (inv[i].id === id) { idx = i; break; }
    if (idx < 0) return false;
    var entry = inv[idx];
    var slot = def.slot;
    var cur = p.outfit[slot];
    inv.splice(idx, 1);
    if (cur) inv.push({ id: cur.id, count: 1, durability: cur.dur });
    p.outfit[slot] = { id: id, dur: entry.durability != null ? entry.durability : (def.durMax || 1) };
    return true;
  }
  G.engine.equipClothing = equipClothing;

  function unequipClothing(slot) {
    var p = G.state.player;
    if (!p.outfit || !p.outfit[slot]) return false;
    var c = p.outfit[slot];
    p.outfit[slot] = null;
    p.inventory.push({ id: c.id, count: 1, durability: c.dur });
    return true;
  }
  G.engine.unequipClothing = unequipClothing;

  // 用一只针线包把某槽位服装耐久补满（消耗 1 针线包）。返回 {ok,msg}。
  function repairClothing(slot) {
    var p = G.state.player;
    if (!p.outfit || !p.outfit[slot]) return { ok: false, msg: '这个部位没穿衣服。' };
    if (!G.engine.hasItem('sewingkit')) return { ok: false, msg: '你没有[item]针线包[/item]。' };
    var c = p.outfit[slot], def = G.engine.itemDef(c.id) || {};
    if (c.dur >= (def.durMax || 1)) return { ok: false, msg: '[item]' + (def.name || c.id) + '[/item]还是完好的，用不着补。' };
    c.dur = def.durMax || 1;
    G.engine.removeItem('sewingkit', 1);
    return { ok: true, msg: '你把[item]' + (def.name || c.id) + '[/item]缝补如新。' };
  }
  G.engine.repairClothing = repairClothing;

})();

</script>

  // 雨天「接雨水」：任意室外地点新增该行动（home/bar/church 是室内安全区，不给）；
  // 需 world.rainDay 才可见（render.js 按 action.cond 过滤），需 glassbottle（消耗 1 换生水 1）。
  var RAIN_EXEMPT = { home: true, bar: true, church: true };
  Object.keys(G.data.locations).forEach(function (id) {
    if (RAIN_EXEMPT[id]) return;
    G.data.locations[id].actions.push({
      id: 'rain_water', label: '接雨水', type: 'water', water: 'rain',
      time: 20, energy: 3, requiresItem: 'glassbottle',
      cond: { flag: { 'world.rainDay': true } }
    });
  });

  // M15「生火取暖」：室内安全区外的地点新增该行动，消耗 1 柴火大幅消退寒冷，
  // 仅当身上确有寒冷值（cold>0）时显示（cond 走既有 stat DSL），避免非冬季冗余。
  Object.keys(G.data.locations).forEach(function (id) {
    if (RAIN_EXEMPT[id]) return;
    G.data.locations[id].actions.push({
      id: 'make_fire', label: '生火取暖', type: 'warm',
      time: 20, energy: 2, requiresItem: 'firewood',
      cond: { stat: { cold: { gt: 0 } } }
    });
  });

  // ---- 配套小逻辑 -----------------------------------------------------------
  // M15：入冬后给地点描述追加一句季节变体（从简：按季节档 + 室内外 + 昼夜取固定句，
  // 不随机以免每次重渲染闪烁）。秋季返回空串（不改动原描述）。
  var INDOOR_LOC = { home: true, bar: true, church: true };
  function seasonSuffix(locId) {
    var tier = G.engine.seasonTierNow ? G.engine.seasonTierNow() : 0;
    if (tier === 0) return '';
    var night = G.engine.isNight();
    if (INDOOR_LOC[locId]) {
      return tier >= 2
        ? '　屋里那点火光挡不住深冬的寒气，呵气成霜，你把领口又裹紧了些。'
        : '　入了冬，屋里也存不住多少暖意，指尖凉得发僵。';
    }
    if (tier >= 2) {
      return night
        ? '　深冬的夜里滴水成冰，风像刀子，在外头多留一刻都是煎熬。'
        : '　天地一片惨白，积雪没过脚踝，呼出的白气转眼散在刺骨的风里。';
    }
    return night
      ? '　初冬的夜风灌进衣领，冻得人骨头发紧。'
      : '　初冬的寒意漫上来，路边的水洼结了层薄冰。';
  }
  function locationDesc(locId) {
    var loc = G.data.locations[locId];
    if (!loc) return '';
    return (G.engine.isNight() ? loc.descNight : loc.descDay) + seasonSuffix(locId);
  }
  G.engine.locationDesc = locationDesc;

  // 含 sewer 捷径的双向可达表：捷径只登记在 sewer 一端，未解锁时不生效，
  // 解锁后对端地点也能自动查到回程（反向扫描），无需重复登记数据。
  function locationNeighbors(locId) {
    var loc = G.data.locations[locId];
    if (!loc) return {};
    var out = {};
    Object.keys(loc.adjacent || {}).forEach(function (k) { out[k] = loc.adjacent[k]; });
    if (G.engine.getFlag('world.sewerShortcut')) {
      Object.keys(loc.shortcuts || {}).forEach(function (k) { out[k] = loc.shortcuts[k]; });
      Object.keys(G.data.locations).forEach(function (otherId) {
        var other = G.data.locations[otherId];
        if (other && other.shortcuts && other.shortcuts[locId] != null && out[otherId] == null) {
          out[otherId] = other.shortcuts[locId];
        }
      });
    }
    return out;
  }
  G.engine.locationNeighbors = locationNeighbors;

  function isLocationOpen(locId) {
    var loc = G.data.locations[locId];
    if (!loc || !loc.hours) return true;
    return G.engine.inTimeRange(G.state.player.minute, loc.hours);
  }
  G.engine.isLocationOpen = isLocationOpen;

  // 移动：校验可达与开放时段，扣时间（随精力惩罚倍率），再切换地点触发 enter 事件
  function travelTo(destId) {
    var cur = G.state.player.location;
    var neighbors = locationNeighbors(cur);
    if (!(destId in neighbors)) return { ok: false, msg: '那里现在到不了。' };
    var destLoc = G.data.locations[destId];
    if (!isLocationOpen(destId)) return { ok: false, msg: '『' + (destLoc ? destLoc.name : destId) + '』现在没开。' };
    var minutes = Math.round(neighbors[destId] * G.engine.timeCostMod());
    G.engine.applyFx({ time: minutes });
    if (G.state.player.stats.hp <= 0) return { ok: false, msg: '你倒下了。', died: true };
    G.engine.goLocation(destId);
    return { ok: true, minutes: minutes };
  }
  G.engine.travelTo = travelTo;

  function pickWeighted(tiers) {
    var total = 0;
    for (var i = 0; i < tiers.length; i++) total += tiers[i].weight;
    var r = Math.random() * total;
    for (var j = 0; j < tiers.length; j++) {
      r -= tiers[j].weight;
      if (r <= 0) return tiers[j];
    }
    return tiers[tiers.length - 1];
  }

  // 搜刮：按行动 id 取地点表，requiresItem 不满足直接拒绝；命中率随该地点已搜刮次数递减（保底 25%）
  function scavenge(locId, actionId) {
    var loc = G.data.locations[locId];
    if (!loc) return { ok: false, msg: '未知地点。' };
    var action = null;
    for (var i = 0; i < (loc.actions || []).length; i++) if (loc.actions[i].id === actionId) { action = loc.actions[i]; break; }
    if (!action) return { ok: false, msg: '这里没有这个行动。' };
    if (action.requiresItem && !G.engine.hasItem(action.requiresItem)) {
      var need = G.engine.itemDef(action.requiresItem);
      return { ok: false, msg: '没有[item]' + (need ? need.name : action.requiresItem) + '[/item]，什么都看不清。' };
    }

    // 命中率随该地点已搜刮次数递减，但保底不低于 scavengeFloor（M9 平衡：
    // 过低的保底会让被搜空的地点永久失去价值，导致中后期食水必死循环）。
    var count = G.state.scavenge[locId] || 0;
    var floor = (G.TUNE && G.TUNE.scavengeFloor != null) ? G.TUNE.scavengeFloor : 0.25;
    var decay = Math.max(floor, 1 - count * 0.12);
    var found = [];
    if (loc.scavengeTable && loc.scavengeTable.length) {
      var tier = pickWeighted(loc.scavengeTable);
      (tier.items || []).forEach(function (it) {
        var chance = (it.chance == null ? 0.5 : it.chance) * decay;
        if (Math.random() < chance) {
          var n = it.max != null ? (it.min + Math.floor(Math.random() * (it.max - it.min + 1))) : (it.count || 1);
          G.engine.addItem(it.id, n);
          found.push({ id: it.id, count: n });
        }
      });
    }
    G.state.scavenge[locId] = count + 1;

    G.engine.applyFx({ stat: { energy: -(action.energy || 0) }, time: action.time || 0 });
    if (G.state.player.stats.hp > 0) G.engine.checkEvents('action');

    var msg;
    if (found.length) {
      msg = found.map(function (f) {
        var def = G.engine.itemDef(f.id);
        return '搜到 [item]' + (def ? def.name : f.id) + (f.count > 1 ? ('×' + f.count) : '') + '[/item]';
      }).join('，') + '。';
    } else {
      msg = '翻了一圈，什么都没找到。';
    }
    return { ok: true, found: found, msg: msg };
  }
  G.engine.scavenge = scavenge;

  function findAction(locId, actionId) {
    var loc = G.data.locations[locId];
    if (!loc) return null;
    for (var i = 0; i < (loc.actions || []).length; i++) if (loc.actions[i].id === actionId) return loc.actions[i];
    return null;
  }

  // 取水（M11）：'去江边取水'（水源常驻）/'接雨水'（仅雨天，render.js 按 cond 过滤显示）。
  // 消耗 1 个 glassbottle 换生水 1 份，不走 scavengeTable（结果确定，非概率掉落）。
  function gatherWater(locId, actionId) {
    var action = findAction(locId, actionId);
    if (!action) return { ok: false, msg: '这里没有这个行动。' };
    if (action.requiresItem && !G.engine.hasItem(action.requiresItem)) {
      var need = G.engine.itemDef(action.requiresItem);
      return { ok: false, msg: '没有[item]' + (need ? need.name : action.requiresItem) + '[/item]，没法盛水。' };
    }
    if (action.water === 'rain' && !G.engine.getFlag('world.rainDay')) {
      return { ok: false, msg: '今天没下雨，接不到雨水。' };
    }
    // M15 水源冬季联动：深冬江边取水要破冰（耗时翻倍）；冬季「接雨水」实为接雪化水，
    // 产出减半（半数概率空手而归），且不消耗玻璃瓶（瓶子留着，不算白费一趟）。
    var tier = G.engine.seasonTierNow ? G.engine.seasonTierNow() : 0;
    var isRain = action.water === 'rain';
    var time = action.time || 0;
    var prefix = '';
    if (!isRain && tier >= 2) { time *= 2; prefix = '江面结了冰，你先砸开一个窟窿才够着水——'; }
    if (isRain && tier >= 1) {
      prefix = '天上飘的是雪不是雨，你刮拢积雪慢慢化水——';
      if (Math.random() < 0.5) {
        G.engine.applyFx({ stat: { energy: -(action.energy || 0) }, time: time });
        if (G.state.player.stats.hp > 0) G.engine.checkEvents('action');
        return { ok: true, msg: prefix + '积雪太薄，这一趟没化出多少，瓶子还空着。' };
      }
    }
    G.engine.removeItem(action.requiresItem, 1);
    var itemId = isRain ? 'rainwater' : 'riverwater';
    G.engine.addItem(itemId, 1);
    G.engine.applyFx({ stat: { energy: -(action.energy || 0) }, time: time });
    if (G.state.player.stats.hp > 0) G.engine.checkEvents('action');
    var def = G.engine.itemDef(itemId);
    return { ok: true, msg: prefix + '打了一瓶[item]' + (def ? def.name : itemId) + '[/item]，生水没烧开不能直接喝。' };
  }
  G.engine.gatherWater = gatherWater;

  // 煮水（M11）：需 requiresItem（打火机）在包但不消耗；把包里 1 份生水转成 boiledwater，
  // 两种生水都有时优先煮江水（riverwater），无江水才煮雨水（rainwater），实现从简不弹选择。
  function boilWater(locId, actionId) {
    var action = findAction(locId, actionId);
    if (!action) return { ok: false, msg: '这里没有这个行动。' };
    if (action.requiresItem && !G.engine.hasItem(action.requiresItem)) {
      var need = G.engine.itemDef(action.requiresItem);
      return { ok: false, msg: '没有[item]' + (need ? need.name : action.requiresItem) + '[/item]，生不起火。' };
    }
    var raw = G.engine.hasItem('riverwater') ? 'riverwater' : (G.engine.hasItem('rainwater') ? 'rainwater' : null);
    if (!raw) return { ok: false, msg: '包里没有生水可以煮。' };
    G.engine.removeItem(raw, 1);
    G.engine.addItem('boiledwater', 1);
    // M15：煮水行动兼「取暖」——炉火顺带消退寒冷。
    var warmed = false;
    if (G.TUNE && G.engine.statGet('cold') > 0) { G.engine.statAdd('cold', -G.TUNE.boilWarmRelief); warmed = true; }
    G.engine.applyFx({ stat: { energy: -(action.energy || 0) }, time: action.time || 0 });
    if (G.state.player.stats.hp > 0) G.engine.checkEvents('action');
    var rawDef = G.engine.itemDef(raw);
    return { ok: true, msg: '把[item]' + (rawDef ? rawDef.name : raw) + '[/item]烧开，得到[item]净水[/item]。' +
      (warmed ? '就着炉火烤了烤手，暖和了些。' : '') };
  }

  function makeFire(locId, actionId) {
    var action = findAction(locId, actionId);
    if (!action) return { ok: false, msg: '这里没有这个行动。' };
    if (!G.engine.hasItem('firewood')) return { ok: false, msg: '没有[item]柴火[/item]，生不起火。' };

    var relief = (G.TUNE && G.TUNE.fireWarmRelief) || 40;
    G.engine.statAdd('cold', -relief);
    G.engine.applyFx({ stat: { energy: -(action.energy || 0) }, time: action.time || 0 });
    if (G.state.player.stats.hp > 0) G.engine.checkEvents('action');
    return { ok: true, msg: '你拢起[item]柴火[/item]生了堆火，凑近烤了烤，寒气退了大半。' };
  }

<script>
/* =============================================================================
 * trade.js — 交易数据 + 买卖/以物易物配套小逻辑（M3）
 * -----------------------------------------------------------------------------
 * G.data.trade[id] = {
 *   npc, location, sellRate, restock,       // restock 仅描述性，如 "weekday==4"
 *   tiers: { affinityThreshold: [itemId...] }   // 好感分层货架，累加解锁
 * }  —— zhao_main / fang_ammo 用此结构
 * G.data.trade.cai_barter = { npc, location, type:'barter', offers:[{give:{id,count}, want:{id,count}}] }
 *
 * 配套小逻辑（M1 未提供，数据层补齐，挂到 G.engine）：
 *   G.engine.shopBuyableItems(shopId)     —— 按 NPC 好感累加已解锁的货架 id 列表
 *   G.engine.shopBuy(shopId, itemId, qty) —— 用子弹购买，返回 {ok,msg}
 *   G.engine.shopSell(shopId, itemId, qty)—— 按 sellRate 卖出换子弹，返回 {ok,msg}
 *   G.engine.isRestockDay(shopId)         —— 今天是否为该店的进货日（仅供 UI 提示用）
 *   G.engine.tradeOffersToday(shopId)     —— barter 型：按天数轮换今天可用的 2 条报价
 *   G.engine.barter(shopId, offerIndex)   —— 执行一次以物易物
 * ========================================================================== */
(function () {
  'use strict';
  window.G = window.G || {};
  G.data = G.data || {};

  G.data.trade = {
    zhao_main: {

    },
    fang_ammo: {

      tiers: {
        0: ['pistol', 'revolver', 'militaryfirstaid', 'scrapmetal', 'gasoline',
            'tactical_vest', 'tactical_pants', 'combat_boots']           // M14：军用护甲装
      }

    cai_barter: {
      npc: 'cai', location: 'dock', type: 'barter',
      offers: [
        { give: { id: 'liquor', count: 1 }, want: { id: 'gasoline', count: 1 } },
        { give: { id: 'chocolatebar', count: 1 }, want: { id: 'cannedfish', count: 1 } },
        { give: { id: 'huntingknife', count: 1 }, want: { id: 'toolkit', count: 1 } },

    }
  };

  // M15：当前实际售价（冬季保暖衣物 warmth>=3 涨价；其余物品原价）。
  function itemPriceNow(id) {
    var def = G.engine.itemDef(id);
    if (!def || def.price == null) return def ? def.price : null;
    var price = def.price;
    if (def.type === 'clothing' && (def.warmth || 0) >= 3 &&
        G.engine.isWinter && G.engine.isWinter()) {
      price = Math.ceil(price * ((G.TUNE && G.TUNE.winterWarmMarkup) || 1.5));
    }
    return price;
  }
  G.engine.itemPriceNow = itemPriceNow;

  // ---- 好感分层货架 ---------------------------------------------------------
  function buyableItems(shopId) {
    var shop = G.data.trade[shopId];
    if (!shop || !shop.tiers) return [];
    var aff = shop.npc ? G.engine.affGet(shop.npc) : 0;
    var out = [];
    Object.keys(shop.tiers).map(Number).sort(function (a, b) { return a - b; }).forEach(function (threshold) {
      if (aff >= threshold) out = out.concat(shop.tiers[threshold]);
    });
    // M15 冬季上新：winterStock 仅在初冬/深冬追加（去重，避免与货架重复）
    if (shop.winterStock && G.engine.isWinter && G.engine.isWinter()) {
      shop.winterStock.forEach(function (id) { if (out.indexOf(id) < 0) out.push(id); });
    }
    return out;
  }
  G.engine.shopBuyableItems = buyableItems;

  function shopBuy(shopId, itemId, qty) {
    qty = qty || 1;
    var shop = G.data.trade[shopId];
    if (!shop || shop.type === 'barter') return { ok: false, msg: '这里不支持这样买卖。' };
    if (buyableItems(shopId).indexOf(itemId) < 0) return { ok: false, msg: '这里没有卖这个。' };
    var def = G.engine.itemDef(itemId);
    if (!def) return { ok: false, msg: '未知道具。' };
    var cost = (itemPriceNow(itemId) || 0) * qty;   // M15：冬季保暖衣物按涨价后价结算
    if (G.state.player.bullets < cost) return { ok: false, msg: '子弹不够。' };
    G.state.player.bullets -= cost;
    G.engine.addItem(itemId, qty);
    return { ok: true, msg: '买下[item]' + def.name + (qty > 1 ? ('×' + qty) : '') + '[/item]，花了 ' + cost + ' 发子弹。' };
  }
  G.engine.shopBuy = shopBuy;

  function shopSell(shopId, itemId, qty) {
    qty = qty || 1;
    var shop = G.data.trade[shopId];
    if (!shop || shop.type === 'barter') return { ok: false, msg: '这里不支持这样买卖。' };
    var def = G.engine.itemDef(itemId);
    if (!def || def.price == null) return { ok: false, msg: '这东西没法卖。' };
    if (G.engine.countItem(itemId) < qty) return { ok: false, msg: '你没有这么多。' };
    var gain = Math.round(def.price * (shop.sellRate == null ? 0.5 : shop.sellRate) * qty);
    G.engine.removeItem(itemId, qty);
    G.state.player.bullets += gain;
    return { ok: true, msg: '卖出[item]' + def.name + (qty > 1 ? ('×' + qty) : '') + '[/item]，得了 ' + gain + ' 发子弹。' };
  }
  G.engine.shopSell = shopSell;

  function isRestockDay(shopId) {
    var shop = G.data.trade[shopId];
    if (!shop || !shop.restock) return false;
    var m = /weekday==(\d)/.exec(shop.restock);
    if (!m) return false;
    return (G.state.player.day % 7) === Number(m[1]);
  }
  G.engine.isRestockDay = isRestockDay;

  // ---- 以物易物（老蔡）：按天数轮换今天可用的报价 --------------------------
  function tradeOffersToday(shopId) {
    var shop = G.data.trade[shopId];
    if (!shop || !shop.offers || !shop.offers.length) return [];
    var n = shop.offers.length;
    var day = G.state.player.day;
    var i1 = day % n, i2 = (day + Math.floor(n / 2)) % n;
    var idxs = i1 === i2 ? [i1] : [i1, i2];
    return idxs.map(function (i) { return { index: i, offer: shop.offers[i] }; });
  }
  G.engine.tradeOffersToday = tradeOffersToday;

  function barter(shopId, offerIndex) {
    var shop = G.data.trade[shopId];
    if (!shop || !shop.offers || !shop.offers[offerIndex]) return { ok: false, msg: '没有这条交易。' };
    var offer = shop.offers[offerIndex];
    if (G.engine.countItem(offer.want.id) < offer.want.count) {
      var wantDef = G.engine.itemDef(offer.want.id);
      return { ok: false, msg: '你没有足够的[item]' + (wantDef ? wantDef.name : offer.want.id) + '[/item]。' };
    }
    G.engine.removeItem(offer.want.id, offer.want.count);
    G.engine.addItem(offer.give.id, offer.give.count);
    var giveDef = G.engine.itemDef(offer.give.id);
    return { ok: true, msg: '拿东西换到了[item]' + (giveDef ? giveDef.name : offer.give.id) + '[/item]。' };
  }
  G.engine.barter = barter;

})();

</script>

  function presentNow(id, locId) {

    var p = S().player, sch = d.schedule || [];
    for (var i = 0; i < sch.length; i++) {
      var slot = sch[i];
      if (slot.loc !== locId) continue;
      if (slot.weekday != null && (p.day % 7) !== slot.weekday) continue;
      if (slot.stageMin != null && n.stage < slot.stageMin) continue;
      if (slot.range && !G.engine.inTimeRange(p.minute, slot.range)) continue;
      return true;
    }
    return false;
  }
  function npcsAt(locId) {
    var ids = G.NPC_IDS || Object.keys(NPC);
    return ids.filter(function (id) { return NPC[id] && presentNow(id, locId); });

  // ==========================================================================
  function stageName(id) {
    var st = G.engine.stageGet(id);
    return STAGE_NAMES[st] || STAGE_NAMES[0];
  }
  function affNeededForNext(id) {
    var st = G.engine.stageGet(id);
    return st >= STAGE_AFF.length - 1 ? null : STAGE_AFF[st + 1];
  }
  // 好感已达下一阶段阈值、但阶段尚未推进（升阶须由剧情 fx.stage 完成）
  function affinityReadyToAdvance(id) {
    var need = affNeededForNext(id);
    return need != null && G.engine.affGet(id) >= need;
  }
  G.engine.stageName = stageName;
  G.engine.affNeededForNext = affNeededForNext;
  G.engine.affinityReadyToAdvance = affinityReadyToAdvance;

  function pronoun(id) { var d = def(id); return d && d.sex === 'f' ? '她' : '他'; }

  // 搭话入口提示态（好感面板 / 未来的搭话按钮用）
  function talkHint(id) {
    var n = nstate(id); if (!n) return '';
    if (!n.alive) return '——';
    var st = n.stage, ta = pronoun(id);
    var story = findTalkStory(id);
    if (story) return ta + '似乎有话想说。';
    if (st >= STAGE_AFF.length - 1) return '你们之间已无需多言。';
    var need = STAGE_AFF[st + 1], aff = G.engine.affGet(id);
    if (aff >= need) return '好感已足，只差一个契机。';
    return '距离「' + STAGE_NAMES[st + 1] + '」还差好感 ' + (need - aff) + '。';
  }
  G.engine.talkHint = talkHint;

  // ==========================================================================
  // 剧情入口调度：搭话时优先可触发的 story 事件（when 含 'talk'、按 npc 归属过滤）
  // ==========================================================================
  function betterEvent(a, b) {
    var pa = a.priority || 0, pb = b.priority || 0;
    if (pa !== pb) return pa > pb;
    return (a._order || 0) < (b._order || 0);
  }
  function storyEligible(ev) {
    var s = S();
    s.world._once = s.world._once || {};
    s.world.cooldowns = s.world.cooldowns || {};
    if (ev.once && s.world._once[ev.id]) return false;
    var cd = s.world.cooldowns[ev.id];
    if (cd && G.engine.absMinute() < cd) return false;
    if (!G.engine.checkCond(ev.cond)) return false;
    return true;
  }
  function findTalkStory(id) {
    if (!G.data.events || !G.data.events.all) return null;
    var all = G.data.events.all(), best = null;
    for (var i = 0; i < all.length; i++) {
      var ev = all[i];
      if (ev.type !== 'story' || ev.npc !== id) continue;
      var w = ev.when || [];
      if (w.indexOf('talk') < 0) continue;
      if (!storyEligible(ev)) continue;
      if (!best || betterEvent(ev, best)) best = ev;
    }
    return best;
  }
  function fireTalkStory(ev) {
    var s = S(), now = G.engine.absMinute();
    s.world._once = s.world._once || {};

    if (ev.cooldown) s.world.cooldowns[ev.id] = now + ev.cooldown;
    if (ev.passage) G.engine.openPassage(ev.passage);
    return ev;
  }

  // ==========================================================================
  // 一个复用的动态段落：正文取自 state._talkLine（易失，不入档也无妨）
  if (G.data.story && G.data.story.register) {
    G.data.story.register({
      id: 'npc_daily_talk',
      text: function (s) { return (s && s._talkLine) || '……'; },
      choices: [{ label: '（离开）', fx: {} }]

  }

  function pickLine(pool, n, key) {
    if (!pool || !pool.length) return '……';
    if (pool.length === 1) return pool[0];
    var last = n.vars[key], i = Math.floor(Math.random() * pool.length);
    if (pool[i] === last) i = (i + 1) % pool.length;
    n.vars[key] = pool[i];
    return pool[i];
  }
  function showTalkLine(line) {
    S()._talkLine = line;
    if (G.engine.openPassage) G.engine.openPassage('npc_daily_talk');
  }
  function toast(msg) { if (G.ui && G.ui.toast) G.ui.toast(msg); }

  function dailyChat(id) {
    var d = def(id), n = nstate(id), p = S().player;
    var tier = Math.min(n.stage, d.chat.length - 1);
    var line = pickLine(d.chat[tier], n, 'chatIdx');
    if (n.vars.lastChatDay === p.day) {
      // 今天已互动过：仍给一句话，但不再加好感
      showTalkLine(line);
      return { ok: true, gain: 0 };
    }
    n.vars.lastChatDay = p.day;
    var gain = 1 + (Math.random() < 0.5 ? 0 : 1);   // +1~2
    G.engine.affAdd(id, gain);
    showTalkLine(line);
    toast('对' + d.name + '的好感 +' + gain);
    return { ok: true, gain: gain };
  }
